<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语法漏洞诊断台｜广州初中英语</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2317140f'/><path d='M20 50h60' stroke='%238a3f22' stroke-width='8'/><path d='M50 20v60' stroke='%238a3f22' stroke-width='8'/></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500&family=Roboto+Mono:wght@400;500&display=swap">
<style>
:root{
--paper:#f7f4ec;--ink:#17140f;--ink2:#3d362b;--muted:#6f6657;--line:rgba(23,20,15,.13);
--rule:#d8d0bf;--acc:#8a3f22;--sage:#4b5c46;--amber:#9a742e;--wash:#efe9db;
--serif:"Noto Serif SC","Songti SC",Georgia,serif;
--sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
--mono:"Roboto Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:212px minmax(0,1fr);max-width:1240px;margin:0 auto}
/* ===== 左索引 ===== */
.rail{position:sticky;top:0;align-self:start;height:100vh;border-right:1px solid var(--line);padding:26px 0 20px;display:flex;flex-direction:column}
.mark{padding:0 22px 22px;border-bottom:1px solid var(--line);margin-bottom:14px}
.mark .eyebrow{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.mark h1{font-family:var(--serif);font-size:19px;font-weight:700;margin:6px 0 2px;letter-spacing:.02em}
.mark .sub{font-size:11px;color:var(--muted);line-height:1.55}
.nav{list-style:none;margin:0;padding:0 0 6px}
.nav li{padding:0}
.nav a{display:flex;gap:12px;align-items:baseline;padding:9px 22px;text-decoration:none;font-size:13px;color:var(--ink2);border-left:2px solid transparent}
.nav a .no{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.nav a:hover{color:var(--ink);background:rgba(23,20,15,.03)}
.nav a.on{color:var(--ink);border-left-color:var(--acc);background:rgba(138,63,34,.045)}
.nav a.on .no{color:var(--acc)}
.railstats{margin-top:auto;padding:16px 22px 0;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.9}
.railstats b{font-family:var(--mono);font-size:12px;color:var(--ink2);font-weight:500}
/* ===== 主列 ===== */
main{padding:0 0 70px}
.masthead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;align-items:end;padding:30px 34px 22px;border-bottom:1px solid var(--line)}
.masthead .eyebrow{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.masthead h2{font-family:var(--serif);font-size:25px;font-weight:700;margin:7px 0 6px;letter-spacing:.01em;line-height:1.35}
.masthead p{font-size:12.5px;color:var(--ink2);max-width:58ch;margin:0;line-height:1.75}
figures{display:flex;gap:26px;text-align:right}
figure{margin:0}
figure figcaption{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
figure b{font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:-.01em}
figure b i{font-style:normal;font-size:11px;color:var(--muted)}
.sec{padding:26px 34px 30px;border-bottom:1px solid var(--line)}
.sec:last-of-type{border-bottom:0}
.sechead{display:flex;gap:12px;align-items:baseline;margin-bottom:4px}
.sechead .no{font-family:var(--mono);font-size:10px;color:var(--acc);letter-spacing:.1em}
.sechead h3{font-family:var(--serif);font-size:18px;font-weight:700;margin:0}
.sechead .tag{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.lede{font-size:12.5px;color:var(--ink2);max-width:66ch;margin:8px 0 18px;line-height:1.8}
h4{font-family:var(--serif);font-size:14px;font-weight:700;margin:18px 0 8px}
/* 表格（编辑体：只横线） */
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{text-align:left;font-weight:400;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 10px 7px 0;border-bottom:1px solid var(--rule)}
tbody td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
td.mut{color:var(--muted);font-size:11.5px}
.mx{display:grid;grid-template-columns:196px repeat(3,46px) 1fr;gap:0;align-items:center}
.cell{height:18px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;letter-spacing:.05em;color:var(--muted);width:40px;margin:3px 0}
.cell.ok{background:#e3e8d8;border-color:#c3cdb3;color:var(--sage)}
.cell.no{background:#f4ded4;border-color:#dcb9a8;color:var(--acc)}
.cell.na{background:#eee8da;border-style:dashed}
/* 综合应用：短文 */
.passage{font-family:var(--serif);font-size:15px;line-height:2.05;max-width:none;color:var(--ink)}
.passage .blank{display:inline-flex;align-items:baseline;gap:3px;border-bottom:1px solid var(--ink2);padding:0 2px;margin:0 2px}
.passage .blank input{border:0;background:transparent;font-family:var(--sans);font-size:13px;color:var(--acc);width:78px;padding:0 1px;text-align:center}
.passage .blank input:focus{outline:0;border-bottom:1px solid var(--acc)}
.passage .blank i{font-style:normal;font-family:var(--mono);font-size:9px;color:var(--muted);align-self:flex-start;margin-top:1px}
.passage .blank.ok{border-bottom-color:var(--sage)}
.passage .blank.ok input{color:var(--sage)}
.passage .blank.bad{border-bottom-color:var(--acc);background:rgba(138,63,34,.05)}
.passage .hint{font-family:var(--sans);font-size:11.5px;color:var(--muted);margin-left:1px}
/* 问题与选项 */
.qrow{border-bottom:1px solid var(--line);padding:13px 0}
.qrow:last-child{border-bottom:0}
.qmeta{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap}
.qmeta .idx{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.qmeta .layer{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:0 5px}
.stem{font-size:14px;line-height:1.75}
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:9px;border:1px solid var(--line)}
.opt{text-align:left;padding:9px 11px;background:transparent;border:0;border-right:1px solid var(--line);font-size:13px;font-family:var(--sans);color:var(--ink);cursor:pointer;line-height:1.55}
.opt:last-child{border-right:0}
.opt:hover{background:var(--wash)}
.opt.sel{background:rgba(138,63,34,.07);box-shadow:inset 2px 0 0 var(--acc)}
.opt.ok{background:#e8eddc;box-shadow:inset 2px 0 0 var(--sage)}
.opt.bad{background:#f7e4dc;box-shadow:inset 2px 0 0 var(--acc)}
.opt em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--muted);margin-right:6px}
.inline{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
.inline input{border:0;border-bottom:1px solid var(--ink2);background:transparent;font-size:14px;font-family:var(--sans);color:var(--ink);padding:5px 2px;width:190px}
.inline input:focus{outline:0;border-bottom-color:var(--acc)}
.fb{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.75}
.fb b{font-family:var(--mono);font-weight:500}
.fb .r{color:var(--sage);font-weight:500}
.fb .w{color:var(--acc);font-weight:500}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 15px;font-size:12px;letter-spacing:.06em;cursor:pointer;font-family:var(--sans)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.note{font-size:11.5px;color:var(--muted);line-height:1.8}
.reason{font-family:var(--mono);font-size:10px;letter-spacing:.04em;border:1px solid var(--line);padding:1px 5px;color:var(--ink2);white-space:nowrap}
.big{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em}
.barlist{margin:6px 0 0}
.bar{display:grid;grid-template-columns:96px 1fr 72px;gap:10px;align-items:center;font-size:11.5px;padding:4px 0}
.track{height:6px;background:var(--wash);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.fill.s{background:var(--sage)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.kv{border-top:1px solid var(--rule);padding-top:8px;font-size:12px}
.kv b{font-family:var(--serif);font-size:13px;display:block;margin-bottom:2px}
details{border-bottom:1px solid var(--line);padding:10px 0}
summary{cursor:pointer;font-size:12.5px;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
details[open] summary{color:var(--acc)}
details p{font-size:12px;color:var(--ink2);margin:8px 0 0;line-height:1.8}
.rule{font-size:12.5px;line-height:1.85;padding:7px 0 7px 14px;border-left:2px solid var(--acc);margin:8px 0;color:var(--ink2)}
.copy{width:100%;border:1px solid var(--line);background:#fffdf6;font-family:var(--sans);font-size:12px;line-height:1.8;color:var(--ink2);padding:14px;height:210px;resize:vertical}
.foot{padding:22px 34px 40px;font-size:10.5px;color:var(--muted);line-height:1.85;border-top:1px solid var(--line)}
@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 0 0}
  .mark{padding:0 16px 14px;border-bottom:0;margin:0}
  .nav{display:flex;overflow-x:auto;padding:0 10px 10px;gap:2px}
  .nav a{padding:7px 10px;border-left:0;border-bottom:2px solid transparent;white-space:nowrap}
  .nav a.on{border-bottom-color:var(--acc);background:transparent}
  .railstats{display:none}
  .masthead{padding:18px 16px 16px;grid-template-columns:minmax(0,1fr)}
  figures{text-align:left;gap:20px;flex-wrap:wrap}
  .sec{padding:20px 16px 24px}
  .two,.three{grid-template-columns:minmax(0,1fr);gap:16px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mx{grid-template-columns:150px repeat(3,40px) minmax(76px,1fr);font-size:12px}
  table{min-width:520px}
  .tablewrap{overflow-x:auto}
  .inline input{width:150px}
}
</style>
</head>
<body>
<div class="shell">
<aside class="rail">
  <div class="mark">
    <div class="eyebrow">Grammar Diagnostic</div>
    <h1>语法漏洞诊断台</h1>
    <div class="sub">广州初中 · 沪教版牛津<br>三层诊断 · 按盲区推送训练</div>
  </div>
  <ul class="nav" id="nav">
    <li><a href="#assess" data-nav="assess"><span class="no">01</span>评估</a></li>
    <li><a href="#gaps" data-nav="gaps"><span class="no">02</span>漏洞</a></li>
    <li><a href="#drill" data-nav="drill"><span class="no">03</span>训练</a></li>
    <li><a href="#apply" data-nav="apply"><span class="no">04</span>综合</a></li>
    <li><a href="#units" data-nav="units"><span class="no">05</span>专题</a></li>
    <li><a href="#report" data-nav="report"><span class="no">06</span>报告</a></li>
  </ul>
  <div class="railstats" id="railstats">—</div>
</aside>
<main>
<div class="masthead">
  <div>
    <div class="eyebrow">Diagnostic Workspace</div>
    <h2 id="mt">先把漏洞找全，再谈考多少分</h2>
    <p id="md">面向已经能考 80 分以上、能自己读规则的学生：先 42 题把盲区找全，再按盲区推训练，目标是把可能出错的位置逐个关掉，做到 100%。</p>
  </div>
  <figures>
    <figure><figcaption>Passed</figcaption><b id="s-pass">0<i>/14</i></b></figure>
    <figure><figcaption>Gaps</figcaption><b id="s-gap">—</b></figure>
    <figure><figcaption>Closed</figcaption><b id="s-closed">0<i>/14</i></b></figure>
  </figures>
</div>
<div id="app"></div>
<p class="foot">题目、判卷、记录全在本机，换设备不同步。判断口径按中考常规；涉及语感差异、或某题你认为答案有问题的，回对话里说，别在这里改答案。</p>
</main>
</div>
<script>
const U=[
{n:'名词',sub:'可数／不可数／复数／所有格',rules:['可数名词有单复数；以 s、x、ch、sh 结尾加 es；辅音字母加 y 结尾变 y 为 i 再加 es；f、fe 多数变 v 加 es。','不规则复数：man→men，woman→women，child→children，tooth→teeth，foot→feet，mouse→mice，sheep→sheep。','不可数名词不加 s、不加 a/an，用 much、a little、a piece of 计量：information、advice、news、bread、homework。','所有格：人加 ’s；以 s 结尾的复数只加 ’；两人共有只在最后加 ’s。'],items:[
{cell:'A',q:'I need some ___ about the trip.',o:['information','informations','an information','information of'],a:0,x:'information 不可数，不加 s 也不加 a。',r:'rule'},
{cell:'B',q:'There are three ___ on the table.（knife）',f:1,a:'knives',x:'knife 以 fe 结尾，变 v 加 es。',r:'form'},
{cell:'C',q:'下面哪一句正确？',o:['I have two informations.','There are three children in the room.','He gave me some advices.','Two woman doctors are here.'],a:1,x:'children 是不规则复数；其余三句都错在复数或不可数。',r:'trap'},
{cell:'D',q:'How many ___ are there in your school?',o:['woman doctors','women doctors','women doctor','woman doctor'],a:1,x:'woman 修饰复数名词时两个词都变复数。',r:'form'}]},
{n:'冠词',sub:'a/an、the、零冠词',rules:['泛指可数单数用 a/an，看读音不看字母：an hour、an honest boy、a useful book。','特指用 the：双方知道的、上文提过的、独一无二、最高级、序数词、乐器。','零冠词：三餐、球类、学科、星期月份、by 加交通工具。'],items:[
{cell:'A',q:'He is ___ honest boy.',o:['a','an','the','/'],a:1,x:'honest 的 h 不发音，以元音音素开头。',r:'rule'},
{cell:'B',q:'I play ___ piano every day.（不需要冠词就填 /）',f:1,a:['the','/'],x:'乐器前用 the。',r:'pos'},
{cell:'C',q:'下面哪一句正确？',o:['He is a honest boy.','I play piano every day.','The sun rises in the east.','We have a lunch at twelve.'],a:2,x:'其余三句分别错在 an、乐器前缺 the、三餐加了 a。',r:'trap'},
{cell:'D',q:'We have ___ lunch at twelve.',o:['a','an','the','/'],a:3,x:'三餐前零冠词。',r:'rule'}]},
{n:'代词',sub:'人称／物主／反身／指示',rules:['主格做主语，宾格做宾语；动词后、介词后一律宾格。','形容词性物主后面必须跟名词；名词性物主单独用，后面不能再接名词。','反身代词：主语和宾语同一人；enjoy oneself、by oneself、teach oneself。','her 三身份：help her（宾格）、her book（形容词性）、hers（名词性）；his、its 两种身份同形。'],items:[
{cell:'A',q:'Can you help ___? I cannot do it.',o:['I','me','my','mine'],a:1,x:'help 后面是宾语，用宾格。',r:'pos'},
{cell:'B',q:'This book is ___.（I）',f:1,a:'mine',x:'后面没有名词，用名词性物主 mine。',r:'form'},
{cell:'C',q:'下面哪一句正确？',o:['Me is a student.','Please give it to she.','Her bike is new.','This book is my.'],a:2,x:'her 作定语修饰 bike；my 后面缺名词。',r:'trap'},
{cell:'D',q:'Help ___ to some fish, children.',o:['yourself','yourselves','you','your'],a:1,x:'children 是复数，反身用 yourselves。',r:'form'}]},
{n:'数词',sub:'基数／序数／hundred／时刻',rules:['hundred、thousand 前有具体数字时不加 s；笼统数量才加 s 并接 of。','序数词：first、second、third、fifth、eighth、ninth、twelfth、twentieth。','分数：分子基数词，分母序数词；分子大于 1 分母加 s。'],items:[
{cell:'A',q:'There are ___ students in our school.',o:['two thousands','two thousand','two thousand of','thousands'],a:1,x:'前面有具体数字，不加 s。',r:'rule'},
{cell:'B',q:'Today is my ___ birthday.（twelve）',f:1,a:'twelfth',x:'第十二是 twelfth，不是 twelveth。',r:'form'},
{cell:'C',q:'下面哪一句正确？',o:['Two thousands students are here.','Thousands of people visit the park every year.','Today is my twelveth birthday.','Two third of the students are boys.'],a:1,x:'Thousands of 表笼统数量；其余错在 thousands 加复数、拼写、分母没加 s。',r:'trap'},
{cell:'D',q:'He lives on ___ floor.',o:['five','the five','the fifth','fifth'],a:2,x:'楼层用序数词，前面加 the。',r:'pos'}]},
{n:'形容词与副词',sub:'比较级／最高级／as…as',rules:['单音节加 er、est；多音节前加 more、most；good→better→best，bad→worse→worst。','比较级前可加 much、even；最高级前必须 the，后接 in 或 of 表范围。','形容词修饰名词或放系动词后；副词修饰动词。','as 加原级加 as，中间不用比较级。'],items:[
{cell:'A',q:'This book is ___ than that one.',o:['interesting','more interesting','most interesting','the most interesting'],a:1,x:'多音节比较级用 more，不加 the。',r:'rule'},
{cell:'B',q:'Please listen ___ .（careful）',f:1,a:'carefully',x:'修饰动词 listen 用副词。',r:'form'},
{cell:'C',q:'下面哪一句正确？',o:['He runs more fast than his brother.','She is tallest girl in her class.','He runs faster than his brother.','English is as more important as Chinese.'],a:2,x:'fast 的比较级是 faster；最高级缺 the；as 中间不加比较级。',r:'trap'},
{cell:'D',q:'Which is ___, the sun, the moon or the earth?',o:['big','bigger','biggest','the biggest'],a:3,x:'三者比较用最高级，前面加 the。',r:'pos'}]},
{n:'介词',sub:'时间／地点／方式／搭配',rules:['大于一天用 in（年、月、季节、上下午）；具体某天用 on；钟点用 at。','交通工具 by 加名词，不加冠词；步行 on foot。','材料看得出用 of，看不出用 from。','固定搭配：be good at、be interested in、thank you for。'],items:[
{cell:'A',q:'We have an English class ___ Monday morning.',o:['in','on','at','for'],a:1,x:'具体某天的上午用 on。',r:'rule'},
{cell:'B',q:'The box is made ___ paper.（看得出材料）',f:1,a:'of',x:'看得出材料用 be made of。',r:'form'},
{cell:'C',q:'下面哪一句正确？',o:['He was born in 2011.','The film begins in seven thirty.','I go to school by the bus.','Thank you to your help.'],a:0,x:'钟点用 at、by 后不加冠词、thank you for。',r:'trap'},
{cell:'D',q:'The film begins ___ seven thirty.',o:['in','on','at','for'],a:2,x:'钟点用 at。',r:'rule'}]},
{n:'连词',sub:'并列／转折／因果／关联词',rules:['and 并列、but 转折、or 选择或“否则”、so 结果。','because 原因；although 让步，不能与 but 连用。','both…and、either…or、neither…nor（谓语就近）。'],items:[
{cell:'A',q:'___ he is young, he knows a lot.',o:['Although','Because','So','But'],a:0,x:'两个半句是让步关系。',r:'pos'},

function norm(v){
  let s=String(v==null?'':v).toLowerCase().replace(/\s+/g,' ');
  s=s.replace(/\bcannot\b/g,'cant').replace(/\bcan not\b/g,'cant')
     .replace(/\bdo not\b/g,'dont').replace(/\bdoes not\b/g,'doesnt').replace(/\bdid not\b/g,'didnt')
     .replace(/\bis not\b/g,'isnt').replace(/\bare not\b/g,'arent').replace(/\bwas not\b/g,'wasnt').replace(/\bwere not\b/g,'werent')
     .replace(/\bhas not\b/g,'hasnt').replace(/\bhave not\b/g,'havent').replace(/\bhad not\b/g,'hadnt')
     .replace(/\bwill not\b/g,'wont').replace(/\bwould not\b/g,'wouldnt')
     .replace(/\bmust not\b/g,'mustnt').replace(/\bshould not\b/g,'shouldnt').replace(/\bneed not\b/g,'neednt');
  return s.replace(/[.。,，!?？;；:'"‘’“”\s]/g,'');
}
function itemsOf(u,cell){return u.items.filter(it=>it.cell===cell)}
function unitById(id){return U.find(u=>u.n===id)}
function evalItems(){
  const out=[];
  ['A','B','C'].forEach(c=>CORE.forEach(u=>{const it=itemsOf(u,c)[0];if(it)out.push({u:u.n,c:c,it})}));
  return out;
}
function ansText(it){return it.f?(Array.isArray(it.a)?it.a.join(' / '):it.a):it.o[it.a]}
function ok(it,val){if(it.f)return Array.isArray(it.a)?it.a.some(a=>norm(val)===norm(a)):norm(val)===norm(it.a);return +val===it.a}
function pct(n,d){return d?Math.round(n/d*100):0}
function gaps(){
  const out=[];
  if(D.last){U.forEach(u=>{['A','B','C'].forEach(c=>{
    const r=D.last[u.n]&&D.last[u.n][c];
    if(!r)return;
    if(!r.ok)out.push({u:u.n,c:c,item:itemsOf(u,c)[0],given:r.given});
  })})}
  (D.applyW||[]).forEach(w=>out.push(w));
  return out;
}
function gradeApply(){
  const pi=S.apply,p=PASS[pi-1],A=S.applyAns||{};
  let right=0;
  p.blanks.forEach((b,i)=>{if(ok({f:1,a:b.a},A['b'+i]))right++});
  p.qs.forEach((q,i)=>{if(A['q'+i]===q.a)right++});
  S.applyGraded=true;
  D.apply=D.apply||{};D.apply[pi]={right:right,total:p.blanks.length+p.qs.length,date:today()};
  D.applyW=(D.applyW||[]).filter(x=>x.pi!==pi);
  p.blanks.forEach((b,i)=>{if(!ok({f:1,a:b.a},A['b'+i]))D.applyW.push({pi:pi,u:b.u,c:'Y',item:{f:1,a:b.a,q:'第 '+(i+1)+' 空（'+b.h+'）',x:b.x,r:b.r},given:A['b'+i]||'（未答）'})});
  p.qs.forEach((q,i)=>{if(A['q'+i]!==q.a)D.applyW.push({pi:pi,u:q.u,c:'Y',item:{q:q.q,o:q.o,a:q.a,x:q.x,r:q.r},given:A['q'+i]===undefined?'（未答）':q.o[A['q'+i]]})});
  save();render();
}
function openGaps(){return gaps().filter(g=>!D.closed[g.u])}
function gapByUnit(){const m={};gaps().forEach(g=>{(m[g.u]=m[g.u]||[]).push(g)});return m}

function uIndex(name){return U.findIndex(u=>u.n===name)}
function qHTML(x,ui,idx,ansStore,graded){
  const it=x.it,val=ansStore[idx];
  const judged=graded;
  let body;
  if(it.f){
    body=`<div class="inline"><span class="note">填：</span><input type="text" data-q="${idx}" value="${val||''}" ${judged?'readonly':''} placeholder="写出正确形式"><span class="note">${it.hint||''}</span></div>`;
  }else{
    body=`<div class="opts">${it.o.map((o,oi)=>{
      let cls='opt';
      if(judged){if(oi===it.a)cls+=' ok';else if(val===oi)cls+=' bad'}
      else if(val===oi)cls+=' sel';
      return `<button class="${cls}" data-opt="${idx}" data-o="${oi}"><em>${'ABCD'[oi]}</em>${o}</button>`;
    }).join('')}</div>`;
  }
  const good=judged&&ok(it,val);
  return `<div class="qrow"><div class="qmeta"><span class="idx">${String(idx+1).padStart(2,'0')}</span><span class="layer">${LAYER[x.c]}</span><span class="note">${x.u}</span>${judged?'<span class="reason">'+(good?'稳':'漏洞')+'</span>':''}</div>

function planGroups(){
  const o=openGaps(),m={};
  o.forEach(g=>{const x=m[g.u]=m[g.u]||{u:g.u,count:0,cells:[],rs:{}};x.count++;x.cells.push(g.c);x.rs[g.item.r]=1});
  return Object.values(m).sort((a,b)=>b.count-a.count);
}
function pickSet(u){
  const pool=u.items;
  const wrong=(D.last&&D.last[u.n])?['A','B','C'].filter(c=>D.last[u.n][c]&&!D.last[u.n][c].ok):[];
  const seen=(D.seen&&D.seen[u.n])||[];
  const idOf=it=>it.cell+'#'+pool.indexOf(it);
  const capList=(list)=>{const c={};return list.filter(it=>{c[it.cell]=(c[it.cell]||0)+1;return c[it.cell]<=2})};
  let pick=[];
  wrong.forEach(c=>{const it=pool.find(x=>x.cell===c);if(it&&!pick.includes(it))pick.push(it)});
  const proto=pool.find(x=>x.cell==='D');if(proto&&!pick.includes(proto))pick.push(proto);
  const rest=pool.filter(it=>!pick.includes(it));
  const fresh=rest.filter(it=>!seen.includes(idOf(it)));
  for(const it of [...fresh,...rest]){if(pick.length>=6)break;pick.push(it)}
  const capped=capList(pick);
  const need=6-capped.length;
  if(need>0){const extra=pick.filter(it=>!capped.includes(it)).slice(0,need);capped.push(...extra)}
  return capped.slice(0,6);
}

  </div>
  ${D.last?`<h4>掌握矩阵</h4>
  <div class="mx" style="border-bottom:1px solid var(--rule);padding-bottom:6px"><span class="note">专题</span><span class="note">识别</span><span class="note">产出</span><span class="note">语境</span><span class="note">判定</span></div>
  ${U.map(u=>{const x=D.last[u.n];const cells=['A','B','C'].map(c=>{const r=x&&x[c];return `<div class="cell ${r?(r.ok?'ok':'no'):'na'}">${r?(r.ok?'✓':'✗'):'·'}</div>`}).join('');
    const all=x&&['A','B','C'].every(c=>!x[c]||x[c].ok);
    return `<div class="mx"><span style="font-size:12px">${u.n}</span>${cells}<span class="note">${all?'无漏洞':(D.closed[u.n]?'已补':'待补')}</span></div>`}).join('')}`:'<p class="note">还没做诊断，这里只显示综合应用的成绩。</p>'}
<h4>综合应用</h4>
  <div class="tablewrap"><table><thead><tr><th style="width:8%">#</th><th style="width:34%">篇目</th><th style="width:16%">得分</th><th>状态</th></tr></thead><tbody>
  ${PASS.map((p,i)=>`<tr><td class="num">${i+1}</td><td>${p.n}</td><td class="num">${D.apply&&D.apply[i+1]?D.apply[i+1].right+'/'+(D.apply[i+1].total||12):'—'}</td><td class="mut">${D.apply&&D.apply[i+1]?(D.apply[i+1].right===(D.apply[i+1].total||12)?'全对':'仍有错，已并入盲区'):'未做'}</td></tr>`).join('')}
  </tbody></table></div>  <h4>错因分布</h4>
  <div class="barlist">${reasons.map(([k,n])=>`<div class="bar"><span>${REASON[k]}</span><div class="track"><div class="fill s" style="width:${pct(n,g.length)}%"></div></div><span class="num">${n}</span></div>`).join('')||'<p class="note">没有漏洞。</p>'}</div>
  <h4>结论</h4>
  ${reportText().split('\n').slice(1).map(t=>`<p class="rule" style="border-left-color:var(--sage)">${t}</p>`).join('')}
  <h4>可复制文本</h4>
  <textarea class="copy" id="rep">${reportText()}</textarea>
  <div class="row"><button class="btn" data-act="copy">复制报告</button><button class="btn ghost" data-act="wipe">清空本机记录</button></div>
  </section>`;
}
/* ===== 判卷 ===== */
function gradeAssess(){
  const all=evalItems();
  const res={};let right=0;
  all.forEach((x,i)=>{
    const val=S.ans[i];const good=ok(x.it,val);
    if(good)right++;
    res[x.u]=res[x.u]||{};
    res[x.u][x.c]={ok:good,right:ansText(x.it),given:x.it.f?(val==null?'':String(val)):(val==null?'':(x.it.o[val]||'')),r:x.it.r};
  });
  D.last=res;D.lastDate=today();D.hist=D.hist||[];D.hist.push({date:today(),right:right,total:all.length});save();
  S.graded=true;S.view='assess';render();
}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
/* ===== 渲染 ===== */
function render(){
  try{draw()}catch(e){
    document.getElementById('app').innerHTML='<section class="sec"><div class="sechead"><span class="no">!</span><h3>这一页没能渲染出来</h3></div><p class="lede">'+String(e&&e.message||e)+'　记录还在本机，刷新一次或回诊断页即可。</p><div class="row"><button class="btn" data-act="go" data-v="assess">回诊断</button><button class="btn ghost" onclick="location.reload()">刷新页面</button></div></section>';
  }
}
function draw(){
  const app=document.getElementById('app');
  const map={assess:vAssess,gaps:vGaps,drill:vDrill,apply:vApply,units:vUnits,report:vReport};
  app.innerHTML=map[S.view]();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===S.view));
  const pass=passedCount(),g=gaps().length,closed=Object.keys(D.closed).length;
  document.getElementById('s-pass').innerHTML=pass+'<i>/'+CORE.length+'</i>';
  document.getElementById('s-gap').textContent=D.last?openGaps().length:'—';
  document.getElementById('s-closed').innerHTML=closed+'<i>/'+CORE.length+'</i>';
  document.getElementById('railstats').innerHTML='诊断 <b>'+(D.last?'已做':'未做')+'</b><br>题库 <b>'+(U.reduce((a,u)=>a+u.items.length,0)+PASS.reduce((a,x)=>a+x.blanks.length+x.qs.length,0))+'</b> 题 · 诊断 '+evalItems().length+' · 综合 '+PASS.length+' 篇<br>待补 <b>'+(D.last?openGaps().length+' / 已通过 '+closed:'—')+'</b>';
  if(S.view==='drill'){document.getElementById('mt').textContent='盲区在哪，训练就从哪开始';document.getElementById('md').textContent='每组六题，全对才通过；过一组推下一组，顺序按漏洞多少排，不用自己挑。';}
  else if(S.view==='gaps'){document.getElementById('mt').textContent='漏洞不补，分数不会自己上去';document.getElementById('md').textContent='按层拆开看：识别错是规则没立住，产出错是会认不会写，语境错是被干扰句带走。三类补法完全不同。';}
  else if(S.view==='report'){document.getElementById('mt').textContent='一份能直接给老师看的评估';document.getElementById('md').textContent='矩阵看结构，错因看性质，结论看顺序。报告末尾可复制。';}
  else if(S.view==='apply'){document.getElementById('mt').textContent='规则最终要落在读上';document.getElementById('md').textContent='短文里的空看你会不会写形式，理解题看你能否靠句子结构读出谁指谁、谁做的、什么时候。';}
  else if(S.view==='units'){document.getElementById('mt').textContent='判据都在这里，按需取用';document.getElementById('md').textContent='不用从头学。带着漏洞来查规则，读完就去训练。';}
  else{document.getElementById('mt').textContent='先把漏洞找全，再谈考多少分';document.getElementById('md').textContent='42 题、14 个七上专题、三层诊断，三层全对才算没有盲区。';}
}
/* ===== 交互 ===== */
document.addEventListener('click',function(e){
  const a=e.target.closest('[data-act]');
  if(a){
    const act=a.dataset.act,u=a.dataset.u;
    if(act==='start'){S.started=true;S.ans={};S.graded=false;render()}
    else if(act==='grade'){gradeAssess()}
    else if(act==='restart'){S.ans={};S.graded=false;S.started=true;render()}
    else if(act==='to-gaps'){S.view='gaps';render()}
    else if(act==='go'){S.view=a.dataset.v;render()}
    else if(act==='drill'){startDrill(u)}
    else if(act==='drill-regen'){startDrill(S.drillU,true)}
    else if(act==='drill-back'){S.drillU=null;S.view='drill';render()}
    else if(act==='to-report'){S.view='report';render()}
    else if(act==='plan'){S.drillU=null;S.view='drill';render()}
    else if(act==='apply'){S.apply=+u;S.applyAns={};S.applyGraded=false;S.view='apply';render()}
    else if(act==='apply-back'){S.apply=null;S.view='apply';render()}
    else if(act==='apply-grade'){gradeApply()}
    else if(act==='drill-retry'){Object.keys(S.drillLock||{}).forEach(k=>{if(!S.drillLock[k].ok){delete S.drillLock[k];delete S.drillAns[k]}});render()}
    else if(act==='drill-check'){
      let allOk=true;
      (S.drillSet||[]).forEach((it,k)=>{
        const v=S.drillAns[k];
        if(v===undefined||v===''){allOk=false;return}
        const good=ok(it,v);S.drillLock[k]={ok:good};
        if(!good)allOk=false;
      });
      render();
    }
    else if(act==='drill-close'){if(S.drillU){D.closed[S.drillU]=1;save();
      const next=planGroups()[0];S.drillU=next?next.u:null;S.drillAns={};S.drillLock={};S.view='drill';render()}}
    else if(act==='copy'){const t=document.getElementById('rep');t.select();try{document.execCommand('copy')}catch(err){};document.getElementById('mt').textContent='已复制，粘贴到微信或文档里';}
    else if(act==='wipe'){if(confirm('清空全部记录？')){D={last:null,drill:null,closed:{},hist:[]};save();S.ans={};S.graded=false;S.started=false;S.drillU=null;render()}}
    return;
  }
  const o=e.target.closest('[data-opt]');
  if(o){if(S.graded)return;const idx=+o.dataset.opt;S.ans[idx]=+o.dataset.o;render();return}
  const aq=e.target.closest('[data-aq]');
  if(aq){if(S.applyGraded)return;S.applyAns=S.applyAns||{};S.applyAns['q'+aq.dataset.aq]=+aq.dataset.o;render();return}
  const d=e.target.closest('[data-dopti]');
  if(d){const k=+d.dataset.dopti;if(S.drillLock[k]&&S.drillLock[k].ok)return;if(S.drillLock[k])delete S.drillLock[k];S.drillAns[k]=+d.dataset.o;render();return}
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.dataset&&t.dataset.q!==undefined){S.ans[+t.dataset.q]=t.value}
  if(t.dataset&&t.dataset.di!==undefined){S.drillAns[t.dataset.di]=t.value}
  if(t.dataset&&t.dataset.ab!==undefined){S.applyAns=S.applyAns||{};S.applyAns['b'+t.dataset.ab]=t.value}
});
window.addEventListener('hashchange',function(){
  const h=location.hash.replace('#','');
  if(['assess','gaps','drill','apply','units','report'].includes(h)){S.view=h;render()}
});
load();
document.querySelectorAll('#nav a').forEach(a=>{
  a.addEventListener('click',function(e){
    e.preventDefault();
    S.view=a.dataset.nav;
    if(history.replaceState)history.replaceState(null,'','#'+S.view);
    render();
  });
});
const h0=location.hash.replace('#','');
if(['assess','gaps','drill','apply','units','report'].includes(h0))S.view=h0;
if(D.last){S.started=true;S.graded=false;if(!h0)S.view='report'}
render();
</script>
</body>
</html>
