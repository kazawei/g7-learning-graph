<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音标课件 · 48 个音可点击</title>
<style>
:root{--paper:#faf7f2;--ink:#17140f;--ink2:#4a453c;--muted:#8b8478;--acc:#8a3f22;--line:#e2dbcd;--serif:'Noto Serif SC','Songti SC',serif;--mono:'Roboto Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Noto Sans SC',system-ui,sans-serif}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);padding:24px 0 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.brand{padding:0 20px 18px;border-bottom:1px solid var(--line)}
.kick{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted)}
h1{font-family:var(--serif);font-size:20px;margin:8px 0 4px}
.brand p{font-size:11.5px;color:var(--muted);line-height:1.6}
.idx{padding:12px 14px;overflow-y:auto;flex:1}
.cat{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);margin:12px 0 6px;padding-left:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);background:#fff;padding:5px 7px;cursor:pointer;border-radius:2px;min-width:40px;text-align:center;color:var(--ink2)}
.chip:hover{border-color:var(--acc)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:34px 44px 90px;min-width:0}
.prog{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.12em}
.stage{display:grid;grid-template-columns:300px minmax(0,1fr);gap:34px;margin-top:16px;align-items:start}
.photo{border:1px solid var(--line);background:#fff;padding:10px}
.photo img{width:100%;display:block;aspect-ratio:1/1;object-fit:cover}
.photo figcaption{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
.sym{font-family:var(--serif);font-size:64px;line-height:1;color:var(--acc)}
.han{font-family:var(--serif);font-size:22px;color:var(--ink2);margin-left:12px}
.cat2{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px}
.art{font-size:14.5px;line-height:1.9;color:var(--ink2);margin:14px 0 0;max-width:62ch}
.words{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.word{border:1px solid rgba(23,20,15,.22);background:#fff;padding:9px 13px;font-size:15px;cursor:pointer;border-radius:2px;color:var(--ink)}
.word:hover{border-color:var(--acc);color:var(--acc)}
.word.play{background:rgba(138,63,34,.08)}
.row2{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{font-size:12.5px;padding:8px 15px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink);border-color:rgba(23,20,15,.25)}
.btn.ghost:hover{border-color:var(--ink)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.cmp{border-top:1px solid var(--line);margin-top:28px;padding-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.cmp .box{border:1px solid var(--line);background:#fff;padding:14px}
.cmp .box h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin-bottom:8px}
.cmp .box .top{display:flex;gap:12px;align-items:center}
.cmp img{width:74px;height:74px;object-fit:cover;border:1px solid var(--line)}
.cmp .s{font-family:var(--serif);font-size:30px;color:var(--acc)}
.cmp .t{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-top:8px}
.cmp .ws{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:34px;border-top:1px solid var(--line);padding-top:16px;gap:12px}
.nav .note{font-size:11.5px;color:var(--muted)}
footer{font-size:11px;color:var(--muted);margin-top:26px;border-top:1px solid var(--line);padding-top:12px;line-height:1.8}
@media(max-width:900px){
 .wrap{grid-template-columns:1fr}
 aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px 0 0}
 .idx{max-height:170px;display:block;overflow-y:auto}
 main{padding:20px 16px 70px}
 .stage{grid-template-columns:1fr;gap:18px}
 .photo img{aspect-ratio:16/10}
 .sym{font-size:48px}
 .cmp{grid-template-columns:1fr}
}
</style></head><body>
<div class="wrap">
<aside>
  <div class="brand">
    <div class="kick">PHONICS · IPA</div>
    <h1>音标课件</h1>
    <p>48 个音 · 点符号就发音<br>口型 · 声音 · 文字，三样对齐</p>
  </div>
  <div class="idx" id="idx"></div>
  <div style="padding:10px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)" id="voicebox">正在检查本机英语语音…</div>
</aside>
<main>
  <div class="prog"><span id="p1"></span><span id="p2"></span></div>
  <div id="stage"></div>
  <div class="nav">
    <button class="btn ghost" id="prev">← 上一个</button>
    <span class="note">点左边符号跳页，键盘 ← → 也能翻</span>
    <button class="btn" id="next">下一个 →</button>
  </div>
</main>
</div>

  CATS.forEach(c=>{
    const items=PH.filter(p=>p[1]===c);
    h+='<div class="cat">'+c+'</div><div class="chips">'+items.map(p=>'<button class="chip" data-s="'+PH.indexOf(p)+'">/'+p[0]+'/</button>').join('')+'</div>';
  });
  idx.innerHTML=h;
}
function render(){
  const p=PH[cur];
  document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',+b.dataset.s===cur));
  const mate=PH.find(x=>x[0]===p[5]);
  document.getElementById('p1').textContent=p[1]+' · /'+p[0]+'/';
  document.getElementById('p2').textContent=(cur+1)+' / '+PH.length;
  document.getElementById('stage').innerHTML=
  '<div class="stage">'+
    '<figure class="photo"><img src="'+IMG[p[2]]+'" alt="口型"><figcaption>口型参考图：照着做动作，再看嘴</figcaption></figure>'+
    '<div>'+
      '<div class="cat2">'+p[1]+'</div>'+
      '<div><span class="sym">/'+p[0]+'/</span></div>'+
      '<p class="art">'+p[3]+'</p>'+
      '<div class="words">'+p[4].map(w=>'<button class="word" data-w="'+w+'">'+w+'</button>').join('')+'</div>'+
      '<div class="row2">'+
        '<button class="btn" data-read="1">连读这 6 个词</button>'+
        '<button class="btn ghost" data-rate="0.6">慢速 0.6</button>'+
        '<button class="btn ghost" data-rate="0.8">常速 0.8</button>'+
        '<button class="btn ghost" data-rate="1">原速 1.0</button>'+
        (mate?'<button class="btn ghost" data-goto="'+PH.indexOf(mate)+'">跳到对比音 /'+mate[0]+'/</button>':'')+
      '</div>'+
      '<div class="cmp">'+
        [p,mate].filter(Boolean).map((q,k)=>'<div class="box">'+
          '<h4>'+(k?'对比音 CONTRAST':'这个音 THIS')+'</h4>'+
          '<div class="top"><img src="'+IMG[q[2]]+'" alt=""><span class="s">/'+q[0]+'/</span></div>'+
          '<div class="t">'+q[3]+'</div>'+
          '<div class="ws">'+q[4].slice(0,4).map(w=>'<button class="word" data-w="'+w+'">'+w+'</button>').join('')+'</div>'+
        '</div>').join('')+
      '</div>'+
      '<footer>先看图做口型，再点词听两遍，最后跟着读。听不出差别，就把「这个音」和「对比音」两个词交替点着听。</footer>'+
    '</div>'+
  '</div>';
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===PH.length-1;
}
document.addEventListener('click',function(e){
  const c=e.target.closest('.chip');if(c){cur=+c.dataset.s;render();return}
  const w=e.target.closest('.word');if(w){w.classList.add('play');setTimeout(()=>w.classList.remove('play'),600);say(w.dataset.w,{twice:true});return}
  const g=e.target.closest('[data-goto]');if(g){cur=+g.dataset.goto;render();return}
  const r=e.target.closest('[data-read]');if(r){
    const p=PH[cur];let i=0;
    const step=function(){if(i>=p[4].length)return;say(p[4][i],{twice:false});i++;setTimeout(step,1150)};
    step();return}
  const rt=e.target.closest('[data-rate]');if(rt){VOICE.rate=+rt.dataset.rate;return}
  const n=e.target.closest('#next');if(n&&cur<PH.length-1){cur++;render();return}
  const pr=e.target.closest('#prev');if(pr&&cur>0){cur--;render();return}
});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'&&cur<PH.length-1){cur++;render()}
  if(e.key==='ArrowLeft'&&cur>0){cur--;render()}
});
buildIdx();render();pickVoice();
</script></body></html>
