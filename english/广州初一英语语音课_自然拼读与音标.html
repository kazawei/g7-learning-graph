<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语音课 · 自然拼读到音标</title>
<style>
:root{
  --paper:#faf7f2;--ink:#2b2b2b;--ink2:#4a4642;--muted:#8b837a;
  --acc:#9c5c38;--acc2:#7d4526;--warn:#b43c3c;--sage:#4b5c46;
  --line:rgba(43,43,43,.12);--line2:rgba(43,43,43,.22);
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"Roboto Mono","SFMono-Regular",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--sans);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);padding:26px 0 30px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--paper)}
.brand{padding:0 22px 22px;border-bottom:1px solid var(--line)}
.brand .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.brand h1{font-family:var(--serif);font-size:21px;font-weight:700;margin:8px 0 4px;letter-spacing:.01em}
.brand p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.6}
.nav{list-style:none;margin:0;padding:8px 0 0;overflow-y:auto}
.nav a{display:flex;gap:12px;align-items:baseline;padding:9px 22px;font-size:13px;color:var(--ink2);border-left:2px solid transparent}
.nav a .no{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.nav a:hover{background:rgba(43,43,43,.03)}
.nav a.on{color:var(--ink);border-left-color:var(--acc);background:rgba(156,92,56,.06)}
.nav a.on .no{color:var(--acc)}
.sidefoot{margin-top:auto;padding:16px 22px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.7}
main{padding:30px 42px 70px;min-width:0}
.hero{display:flex;justify-content:space-between;gap:24px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}
.hero h2{font-family:var(--serif);font-size:30px;line-height:1.35;margin:0 0 8px;letter-spacing:.01em}
.hero p{margin:0;color:var(--ink2);max-width:60ch;font-size:13.5px}
.stats{display:flex;gap:26px;flex:none}
.stats figure{margin:0;text-align:right}
.stats figcaption{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.stats b{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em}
.stats b i{font-style:normal;font-size:12px;color:var(--muted)}
.sec{margin-bottom:38px}
.sechead{display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--line2);padding-top:14px;margin-bottom:16px}
.sechead .no{font-family:var(--mono);font-size:10px;color:var(--acc);letter-spacing:.1em;white-space:nowrap;flex:none}
.sechead h3{font-family:var(--serif);font-size:19px;margin:0}
.sechead .tag{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.lede{color:var(--ink2);font-size:13px;max-width:72ch;margin:0 0 18px}
.note{font-size:11.5px;color:var(--muted);line-height:1.7}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.btn{font-family:var(--sans);font-size:12.5px;padding:8px 16px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;border-radius:2px}

.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--ink);background:rgba(43,43,43,.04)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.say{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);background:#fff;color:var(--acc);padding:3px 8px;cursor:pointer;border-radius:2px}

.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}

.mcard:hover{background:#fdfbf6}

.msym{font-family:var(--mono);font-size:14px;color:var(--ink);letter-spacing:.02em}

.sep{grid-column:1/-1;font-size:11px;letter-spacing:.14em;color:var(--ink3);padding:14px 0 2px;border-bottom:1px solid var(--line);margin-bottom:2px}
.pc{border:1px solid var(--line);background:#fff;padding:12px 12px 10px;cursor:pointer;transition:.15s}
.pc:hover{border-color:var(--acc);transform:translateY(-1px)}

.rule .ex .w{color:var(--ink);border-bottom:1px dotted var(--line2);cursor:pointer}

.rule .cav{font-size:11px;color:var(--warn);margin-top:8px}
.q{border-bottom:1px solid var(--line);padding:14px 0 16px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:500}
.num{font-family:var(--mono);font-size:12px}
.kv{border-left:2px solid var(--acc);padding-left:14px;margin:14px 0}

  .nav a{display:block;padding:6px 10px;border-left:0;border-bottom:2px solid transparent;white-space:nowrap;font-size:12px}

<script>
/* ===== 发音引擎 ==== */
const VOICE={rate:0.85,accent:'en-GB',voice:null,ready:false,none:false};
function showVoiceBox(){
  const box=document.getElementById('voicebox');if(!box)return;
  if(VOICE.voice){
    const nm=VOICE.voice.name.replace(/Microsoft|Google|Desktop|Online \(Natural\)|- English.*$/gi,'').trim();
    box.innerHTML='发音：'+(VOICE.accent==='en-GB'?'英式':'美式')+' · '+nm+'<br>点单词读两遍，可切语速';
  }else{
    box.innerHTML='这台设备暂时没有英语语音包，点词没有声音。<br>换 Chrome / Edge 打开，或在系统里装一个英语语音。';
  }
}
function pickVoice(){
  if(!window.speechSynthesis){VOICE.none=true;showVoiceBox();return null}
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test(v.lang||''));
  if(!vs.length){
    VOICE.tries=(VOICE.tries||0)+1;
    if(VOICE.tries<5){setTimeout(pickVoice,700)}else{VOICE.none=true;showVoiceBox()}
    return null;
  }
  VOICE.none=false;
  const want=VOICE.accent.toLowerCase();
  const same=vs.filter(v=>(v.lang||'').toLowerCase().replace('_','-').indexOf(want)>=0);
  const pool=same.length?same:vs;
  const rank=v=>{
    const n=v.name||'';let r=0;
    if(/Google UK English Female/i.test(n))r-=40;
    if(/Google UK English Male/i.test(n))r-=35;
    if(/Natural|Neural/i.test(n))r-=25;
    if(/Sonia|Libby|Hazel|Ryan|George|Daniel|Serena|Kate|Stephanie/i.test(n))r-=12;
    if(/Google US English/i.test(n))r-=8;
    return r;
  };
  VOICE.voice=pool.slice().sort((a,b)=>rank(a)-rank(b))[0];
  VOICE.ready=true;showVoiceBox();return VOICE.voice;
}
if(window.speechSynthesis){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function say(text,opt){
  opt=opt||{};
  if(!window.speechSynthesis){flash('本机不支持语音合成');return}
  if(!VOICE.voice)pickVoice();
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(String(text));
    u.lang=VOICE.accent;if(VOICE.voice)u.voice=VOICE.voice;
    u.rate=opt.rate||VOICE.rate;u.pitch=1;
    if(opt.twice){
      u.onend=()=>{const v=new SpeechSynthesisUtterance('… '+text);v.lang=VOICE.accent;if(VOICE.voice)v.voice=VOICE.voice;v.rate=(opt.rate||VOICE.rate);speechSynthesis.speak(v)};
    }
    speechSynthesis.speak(u);return u;
  }catch(e){flash('发音失败：'+e.message)}
}
function flash(msg){
  const el=document.getElementById('flash');
  if(!el)return;el.textContent=msg;el.style.opacity=1;clearTimeout(flash._t);flash._t=setTimeout(()=>el.style.opacity=0,2600);
}

const KEY='phonics7.v2';
const D=Object.assign({min:{},minGraded:false,minScore:null,dict:{},dictGraded:false,dictScore:null,round:[],cover:[],gi:0,earRight:0,earAll:0,hist:[]},JSON.parse(localStorage.getItem(KEY)||'{}'));
const S={view:'map',playing:''};
const save=()=>localStorage.setItem(KEY,JSON.stringify(D));
const norm=v=>String(v==null?'':v).toLowerCase().replace(/[.。,，!?？;；:'"‘’“”\s]/g,'');

/* ===== 渲染 ===== */
function render(){
  const app=document.getElementById('app');
  const v={map:vMap,rules:vRules,min:vMin,dict:vDict,ear:vEar,report:vReport}[S.view]||vMap;
  app.innerHTML=v();
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===S.view));
  updateStats();
}
function updateStats(){
  const el=document.getElementById('s-ph');
  if(!el)return;
}
function hero(title,sub){
  const minDone=(D.minScore?D.minScore.right:0)+'<i>/'+MIN.length+'</i>';
  const dictDone=(D.cover?D.cover.length:0)+'<i>/'+BANK.length+'</i>';
  return `<div class="hero"><div><h2>${title}</h2><p>${sub}</p></div>
  <div class="stats">
    <figure><figcaption>辨析</figcaption><b>${minDone}</b></figure>
    <figure><figcaption>写词</figcaption><b>${dictDone}</b></figure>
    <figure><figcaption>听音</figcaption><b>${(D.earAll?D.earRight:0)+'<i>/'+(D.earAll||EAR.length)+'</i>'}</b></figure>
  </div></div>`;
}
function vMap(){
  const rows=PHON.map((p,i)=>`${i===20?'<div class="sep">辅音 · 28　CONSONANTS</div>':''}<div class="pc" data-say="${p[3].split(' / ')[0].split(' · ')[0].replace(/\s*\/.*$/,'').trim()}" data-i="${i}">
    <div class="sym">/${p[0]}/</div><div class="type">${p[1]}</div>
    <div class="w">${p[3].replace(/<|>/g,'')}</div>
    <div class="tip">${p[2]}</div></div>`).join('');
  return hero('48 个音标，不是 48 个符号','每个音都不是孤立的：点卡片听例词，先听词，再把这个音从词里拎出来。英式发音，语速 0.85。')+
  `<section class="sec"><div class="sechead"><span class="no">01</span><h3>点一张卡，先听词，再听音</h3><span class="tag">20 vowels · 28 consonants</span></div>
  <p class="lede">元音 20 个：长元音 5、短元音 7、双元音 8。辅音 28 个，按清浊成对记。广州学生最该盯的是 /ɪ/ 与 /iː/、/θ/ 与 /s/、/n/ 与 /l/、/r/ 与 /l/。</p>
  <div class="grid48">${rows}</div>
  <div class="row"><button class="btn ghost" data-jump="mnsec">48 个速记卡 ↓</button><button class="btn ghost" data-rate="0.65">更慢 0.65</button><button class="btn ghost" data-rate="0.85">正常 0.85</button><button class="btn ghost" data-rate="1">原速 1.0</button><button class="btn ghost" data-accent="en-GB">英式</button><button class="btn ghost" data-accent="en-US">美式</button><span class="note">切换语速和口音后，点词生效</span></div>
  </section>`+
  `<section class="sec"><div class="sechead"><span class="no">01—B</span><h3>记不住 48 个？先记这 6 组对立</h3><span class="tag">minimal pairs</span></div>
  <div class="rules">
    <div class="rule"><h4>/ɪ/ 与 /iː/</h4><div class="sub">短促 vs 拉长</div><div class="ex"><span class="w" data-say="ship">ship</span> /ʃɪp/ · <span class="w" data-say="sheep">sheep</span> /ʃiːp/</div><div class="cav">ship 短，sheep 长，嘴形一个松一个紧。</div></div>
    <div class="rule"><h4>/æ/ 与 /e/</h4><div class="sub">嘴张两指 vs 一指</div><div class="ex"><span class="w" data-say="bad">bad</span> /bæd/ · <span class="w" data-say="bed">bed</span> /bed/</div><div class="cav">bad 的嘴要张到能塞两指。</div></div>
    <div class="rule"><h4>/θ/ 与 /s/</h4><div class="sub">咬舌 vs 不咬舌</div><div class="ex"><span class="w" data-say="think">think</span> /θɪŋk/ · <span class="w" data-say="sink">sink</span> /sɪŋk/</div><div class="cav">对着镜子，看得到舌尖才是 /θ/。</div></div>
    <div class="rule"><h4>/n/ 与 /l/</h4><div class="sub">鼻腔 vs 舌侧</div><div class="ex"><span class="w" data-say="night">night</span> /naɪt/ · <span class="w" data-say="light">light</span> /laɪt/</div><div class="cav">捏鼻子还能发的，是 /l/。</div></div>
    <div class="rule"><h4>/r/ 与 /l/</h4><div class="sub">卷舌 vs 顶齿龈</div><div class="ex"><span class="w" data-say="red">red</span> /red/ · <span class="w" data-say="led">led</span> /led/</div><div class="cav">/r/ 舌尖悬空，/l/ 舌尖必须碰到上齿龈。</div></div>
    <div class="rule"><h4>/ɔː/ 与 /ɜː/</h4><div class="sub">圆唇 vs 扁唇</div><div class="ex"><span class="w" data-say="walk">walk</span> /wɔːk/ · <span class="w" data-say="work">work</span> /wɜːk/</div><div class="cav">walk 圆唇，work 唇放松。</div></div>
  </div></section>`+
  `<section class="sec" id="mnsec"><div class="sechead"><span class="no" id="mnno">01—C</span><h3>48 个音，每个挂一个汉字 + 一张嘴型图</h3><span class="tag">memory hooks</span></div>
  <p class="lede">音标本身没有意义，硬背符号记不住。先给它挂一个字和一个动作，比如 /ɜː/ 记成「饿」——想一条饿鳄鱼张着嘴「饿——」，口型就跟着对了。点卡片听例词，听着核对口型。</p>
  <p class="note" style="margin:-6px 0 12px">图是教材式的口型写实插画：嘴角拉开、张大嘴、圆唇、咬舌、食指竖唇前、舌尖抵齿龈……每张图对应一个动作，照着做，别只看符号。</p>
  <div class="mgrid">${MNE.map((m,i)=>`<div class="mcard" data-say="${PHON[i][3].split(' / ')[0].split(' · ')[0].replace(/\s*\/.*$/,'').trim()}">
    <div class="mico"><img src="${IMG[m[3]]||IMG.relax}" alt=""></div>
    <div class="mtxt"><div class="msym">/${m[0]}/</div><div class="mhan">${m[1]}</div><div class="mline">${m[2]}</div></div>
  </div>`).join('')}</div>
  <p class="note" style="margin-top:12px">谐音只是拐杖：能读准了就丢掉汉字，只留口型。辅音的汉字只借开头那一下，别把后面的韵母带进来（「泼」别读成 po）；/θ/ /ð/ 不要读成「丝、兹」，/v/ 不要读成「五」。</p>
  </section>`;
}
function vRules(){
  const cards=RULES.map((r,i)=>`<div class="rule"><h4>${r.h}</h4><div class="sub">${r.sub}</div><div class="ex">${r.ex}</div><div class="ex" style="margin-top:6px">${r.e}</div>${r.cav?`<div class="cav">注意：${r.cav}</div>`:''}</div>`).join('');
  return hero('自然拼读：看到字母组合，就知道该发什么音','规则不是拿来背的，是拿来猜的。先用规则把生词读个七八成，再查音标核对最后那一两成。')+
  `<section class="sec"><div class="sechead"><span class="no">02</span><h3>18 条规则，覆盖七上词汇的九成</h3><span class="tag">click any word</span></div>
  <p class="lede">每条都带例词，点词就能听。重点看三处：magic e（词尾 e 让前面元音变长）、r 音节（ar/er/ir/or/ur）、词尾 -ed 与 -s 的三读。</p>
  <div class="rules">${cards}</div></section>`;
}
function vMin(){
  const items=MIN.map((m,i)=>{
    const ans=D.min[i],g=D.minGraded;
    const opts=m.o.map((o,oi)=>{
      let cls='opt';
      if(g){if(oi===m.a)cls+=' ok';else if(ans===oi)cls+=' bad'}
      else if(ans===oi)cls+=' sel';
      return `<button class="${cls}" data-minopt="${i}" data-o="${oi}"><em>${'ABCD'[oi]}</em><span>${o}</span><span class="ph">${(m.ps||m.ph.split(' '))[oi]||''}</span></button>`;
    }).join('');
    return `<div class="q"><div class="qmeta"><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="layer">辨音</span><span class="reason">${m.t}</span>${g?`<span class="reason">${ans===m.a?'对':'漏洞'}</span>`:''}</div>
    <div class="stem">${m.q}</div><div class="opts">${opts}</div>
    ${g?`<div class="fb"><span class="${ans===m.a?'r':'w'}">${ans===m.a?'对':'错'}</span>　答案 <b>${'ABCD'[m.a]}</b>　${(m.ps||m.ph.split(' ')).join(' ')}　${m.x}</div>`:''}</div>`;
  }).join('');
  const score=D.minScore;
  return hero('语音辨析：划线部分，哪一个读音不同？','广州卷的固定题型。先在心里读出四个词的划线部分，再找那个不合群的。判卷后每个错题都会告诉你差在哪个音位。')+
  `<section class="sec"><div class="sechead"><span class="no">03</span><h3>30 题，按音位归类</h3><span class="tag">${MIN.length} items</span></div>
  <div class="row"><span class="note">已答 <b class="num">${Object.keys(D.min).length}</b>/${MIN.length}${D.minGraded?'　·　得分 <b class="num">'+(score?score.right+'/'+score.total:'')+'</b>':''}</span></div>
  ${items}
  <div class="row">${D.minGraded?'<button class="btn ghost" data-act="min-reset">重做</button>':'<button class="btn" data-act="min-grade">交卷判分</button>'}</div>
  </section>`;
}
function newRound(){
  const ids=BANK.map((_,i)=>i);
  const fresh=shuffle(ids.filter(i=>(D.cover||[]).indexOf(i)<0));
  let pick=fresh.slice(0,15);
  if(pick.length<15){const rest=shuffle(ids.filter(i=>pick.indexOf(i)<0));pick=pick.concat(rest.slice(0,15-pick.length))}
  D.round=shuffle(pick);D.dict={};D.dictGraded=false;D.dictScore=null;D.gi=(D.gi||0)+1;
}
function vDict(){
  if(!D.round||!D.round.length){newRound();}
  const items=D.round.map((id,k)=>{
    const d=BANK[id],val=D.dict[id],g=D.dictGraded;
    const okv=g&&norm(val)===norm(d[0]);
    return `<div class="q"><div class="qmeta"><span class="idx">${String(k+1).padStart(2,'0')}</span><span class="layer">音标→词</span><span class="reason">${UNITS[d[4]]}</span>${g?`<span class="reason">${okv?'对':'漏洞'}</span>`:''}</div>
    <div class="stem"><span style="font-family:var(--mono);font-size:15px">${ipa(d[1])}</span>　<span class="note">（${d[2]}）</span></div>
    <div class="fill"><input type="text" data-dict="${id}" value="${val||''}" ${g?'readonly':''} class="${g?(okv?'ok':'bad'):''}" placeholder="写出单词" autocomplete="off" spellcheck="false">
      <button class="say" data-say="${d[0]}">听</button>
      ${g?`<span class="note">应为 <b style="color:var(--acc)">${d[0]}</b></span>`:''}</div>
    ${g?`<div class="fb">${d[3]}${okv?'':'　<span class="w">再听一遍，按音标逐段拼。</span>'}</div>`:''}</div>`;
  }).join('');
  const score=D.dictScore;
  const answered=Object.keys(D.dict).length, cov=(D.cover||[]).length;
  return hero('看音标写单词：每次 15 词，随机抽，抽到会的也照写','题库是七年级上册 U1–U5 的全部词条，共 '+BANK.length+' 个。每轮随机抽 15 个，先抽没过的，凑不满再补已过关的词。')+
  `<section class="sec"><div class="sechead"><span class="no">04</span><h3>第 ${D.gi||1} 组 · 15 个词，从音标倒推拼写</h3><span class="tag">${BANK.length} words · U1–U5</span></div>
  <div class="row"><span class="note">本组已答 <b class="num">${answered}</b>/15　·　累计过关 <b class="num">${cov}</b>/${BANK.length}${D.dictGraded?'　·　本组 <b class="num">'+(score?score.right+'/'+score.total:'')+'</b>':''}</span>${D.dictGraded?'':'<span class="note">大小写、句末标点不计；拼错一个字母就算错</span>'}</div>
  <div class="dictgrid">${items}</div>
  <div class="row">${D.dictGraded?'<button class="btn" data-act="dict-new">下一组 15 词</button><button class="btn ghost" data-act="dict-reset">本组重做</button>':'<button class="btn ghost" data-act="dict-new">换一组</button><button class="btn" data-act="dict-grade">交卷判分</button>'}</div>
  </section>`;
}
function vEar(){
  const pairs=EAR.map((p,i)=>{
    const r=D['ear'+i];
    const btns=[0,1].map(k=>{
      let cls='opt';if(r){if(k===r.ans)cls+=' ok';else if(r.pick===k)cls+=' bad'}else if(r&&r.pick===k)cls+=' sel';
      return `<button class="${cls}" data-earpick="${i}" data-k="${k}"><em>${k?'B':'A'}</em><span>${p[k]}</span><span class="ph">${p[2]}</span></button>`;
    }).join('');
    return `<div class="q"><div class="qmeta"><span class="idx">${String(i+1).padStart(2,'0')}</span><span class="layer">听音</span><span class="reason">${p[3]}</span>${r?`<span class="reason">${r.pick===r.ans?'对':'再听一次'}</span>`:''}</div>
    <div class="earbox"><button class="btn" data-earplay="${i}">播放这个词</button><span class="big">听清楚了再选</span></div>
    <div class="opts" style="margin-top:10px">${btns}</div>
    ${r?`<div class="fb">${r.pick===r.ans?'<span class="r">对</span>':`<span class="w">错</span>　答案 <b>${EAR[i][r.ans]}</b>`}　这一组差在 ${p[2]}。</div>`:''}</div>`;
  }).join('');
  return hero('听音对比：同一组里，你听到的是哪一个？','点播放，系统随机读其中一个词，你选听到的那个。选错了不算失败，说明这两个音在你的耳朵里还没分开。')+
  `<section class="sec"><div class="sechead"><span class="no">05</span><h3>14 组最小对立对</h3><span class="tag">listen & choose</span></div>
  <p class="lede">播放用的是同一个语音引擎，读得快和慢都不改变音素。选完可以再点一次播放核对。成绩记在报告里。</p>
  ${pairs}</section>`;
}
function vReport(){
  const minW=MIN.map((m,i)=>({i,m,v:D.min[i]})).filter(x=>D.minGraded&&x.v!==x.m.a);
  const dictW=(D.round||[]).map((id,k)=>({k,id,d:BANK[id],v:D.dict[id]})).filter(x=>D.dictGraded&&norm(x.v)!==norm(x.d[0]));
  const earW=EAR.map((p,i)=>({i,p,r:D['ear'+i]})).filter(x=>x.r&&x.r.pick!==x.r.ans);
  const cov=(D.cover||[]).length;
  const left=BANK.map((d,i)=>({i,d})).filter(x=>(D.cover||[]).indexOf(x.i)<0);
  return hero('语音报告：哪几个音还没过关','不按题号看，按音位看。同一个音位错三次以上，就是它，不是你“粗心”。')+
  `<section class="sec"><div class="sechead"><span class="no">06</span><h3>错在哪</h3><span class="tag">by phoneme</span></div>
  <div class="tablewrap"><table><thead><tr><th style="width:26%">模块</th><th style="width:22%">成绩</th><th style="width:26%">错题数</th><th>先补什么</th></tr></thead><tbody>
    <tr><td>语音辨析</td><td class="num">${D.minScore?D.minScore.right+'/'+D.minScore.total:'未做'}</td><td class="num">${minW.length}</td><td class="mut">${minW.length?minW.slice(0,3).map(x=>x.m.t).join('、'):'—'}</td></tr>
    <tr><td>音标写词</td><td class="num">${cov}/${BANK.length} 词</td><td class="num">${D.dictGraded?dictW.length:'未做'}</td><td class="mut">${dictW.length?dictW.slice(0,3).map(x=>x.d[0]).join('、'):'—'}</td></tr>
    <tr><td>听音对比</td><td class="num">${D.earAll?D.earRight+'/'+D.earAll:'未做'}</td><td class="num">${earW.length}</td><td class="mut">${earW.length?earW.slice(0,3).map(x=>x.p[2]).join('、'):'—'}</td></tr>
  </tbody></table></div>
  <p class="note" style="margin-top:10px">音标写词还剩 ${BANK.length-cov} 个词没过关：${left.slice(0,12).map(x=>x.d[0]).join('、')}${left.length>12?' …':''}</p>
  </section>
  <section class="sec"><div class="sechead"><span class="no">06—B</span><h3>三天怎么补</h3><span class="tag">plan</span></div>
  <div class="kv"><b>第一天 · 归音</b><p>把报告里出现两次以上的音位，在「音标地图」逐个点开，每个例词听两遍、跟读三遍。不求快，只求嘴形对。</p></div>
  <div class="kv"><b>第二天 · 辨音</b><p>重做「语音辨析」错的那几组，再回到「听音对比」把同一组最小对立对听 5 遍。错的那一题，抄下划线字母和音标。</p></div>
  <div class="kv"><b>第三天 · 落笔</b><p>「音标写词」只做错的题：先按音标分音节，再逐段写字母。写完再点「听」核对，不看答案。</p></div>
  <div class="row"><button class="btn ghost" data-act="export">复制这份报告</button><span class="note" id="mt"></span></div>
  <div class="tablewrap" style="margin-top:14px"><table><thead><tr><th style="width:8%">#</th><th style="width:24%">音标</th><th style="width:30%">单词</th><th>错因提示</th></tr></thead><tbody>
  ${dictW.slice(0,15).map(x=>`<tr><td class="num">${x.k+1}</td><td class="num">${x.d[1]}</td><td><b>${x.d[0]}</b></td><td class="mut">你写：${x.v||'（空）'}　${x.d[3]}</td></tr>`).join('')||'<tr><td colspan="4" class="mut">还没有写词错题。</td></tr>'}
  </tbody></table></div>
  <textarea id="rep" style="position:absolute;left:-9999px" readonly>${reportText()}</textarea>
  </section>`;
}
function reportText(){
  const minW=MIN.filter((m,i)=>D.minGraded&&D.min[i]!==m.a).length;
  const dictW=(D.round||[]).filter(id=>D.dictGraded&&norm(D.dict[id])!==norm(BANK[id][0])).length;
  const lines=['【语音学习报告】'];
  lines.push('语音辨析：'+(D.minScore?D.minScore.right+'/'+D.minScore.total:'未做')+'，错 '+minW+' 题。');
  lines.push('音标写词：已过关 '+(D.cover||[]).length+'/'+BANK.length+' 词，'+(D.dictGraded?'本轮错 '+dictW+' 题。':'本轮未交卷。'));
  lines.push('听音对比：'+(D.earAll?D.earRight+'/'+D.earAll:'未做')+'。');
  lines.push('下一步：先归音（音标地图），再辨音（语音辨析错题），最后落笔（音标写词错题）。');
  return lines.join('\n');
}

/* ===== 交互 ===== */
document.addEventListener('click',function(e){
  const t=e.target;
  const sayEl=t.closest('[data-say]');
  if(sayEl){ sayEl.classList.add('play'); setTimeout(()=>sayEl.classList.remove('play'),700); say(sayEl.dataset.say,{twice:true}); return; }
  const nav=t.closest('[data-nav]');
  if(nav){ e.preventDefault(); S.view=nav.dataset.nav; render(); return; }
  const minOpt=t.closest('[data-minopt]');
  if(minOpt&&!D.minGraded){ D.min[+minOpt.dataset.minopt]=+minOpt.dataset.o; save(); render(); return; }
  const dictIn=t.closest('[data-dict]');
  if(dictIn){return}
  const earPlay=t.closest('[data-earplay]');
  if(earPlay){
    const i=+earPlay.dataset.earplay,ans=Math.random()<.5?0:1;
    D['ear'+i]={ans:ans,pick:D['ear'+i]&&D['ear'+i].pick};
    say(EAR[i][ans]);
    render(); return;
  }
  const earPick=t.closest('[data-earpick]');
  if(earPick){
    const i=+earPick.dataset.earpick,k=+earPick.dataset.k,r=D['ear'+i];
    if(!r){flash('先点播放，再选');return}
    r.pick=k;D.earAll=(D.earAll||0)+1;if(k===r.ans)D.earRight=(D.earRight||0)+1;save();render();return;
  }
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='min-grade'){let right=0;MIN.forEach((m,i)=>{if(D.min[i]===m.a)right++});D.minGraded=true;D.minScore={right:right,total:MIN.length};save();render();}
    else if(a==='min-reset'){D.min={};D.minGraded=false;D.minScore=null;save();render();}
    else if(a==='dict-grade'){let right=0;D.round.forEach(id=>{if(norm(D.dict[id])===norm(BANK[id][0])){right++;if((D.cover||[]).indexOf(id)<0)D.cover.push(id)}});D.dictGraded=true;D.dictScore={right:right,total:D.round.length};save();render();}
    else if(a==='dict-reset'){D.dict={};D.dictGraded=false;D.dictScore=null;save();render();}
    else if(a==='dict-new'){newRound();save();render();}
    else if(a==='export'){const r=document.getElementById('rep');r.select();try{document.execCommand('copy')}catch(err){};document.getElementById('mt').textContent='已复制';}
    return;
  }
  const jump=t.closest('[data-jump]');if(jump){const el=document.getElementById(jump.dataset.jump);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});return}
  const rate=t.closest('[data-rate]');if(rate){VOICE.rate=+rate.dataset.rate;flash('语速 '+rate.dataset.rate);return}
  const acc=t.closest('[data-accent]');if(acc){VOICE.accent=acc.dataset.accent;VOICE.ready=false;pickVoice();flash(acc.dataset.accent==='en-GB'?'英式发音':'美式发音');return}
});
document.addEventListener('input',function(e){
  const el=e.target;
  if(el.dataset&&el.dataset.dict!==undefined&&!D.dictGraded){D.dict[+el.dataset.dict]=el.value;save()}
});
window.addEventListener('hashchange',()=>{});
if(!D.round||!D.round.length){newRound();save();}
render();
</script>
<div id="flash" style="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(43,43,43,.92);color:#fff;font-size:12px;padding:8px 14px;border-radius:2px;opacity:0;transition:opacity .25s;pointer-events:none"></div>
</body>
