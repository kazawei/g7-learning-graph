<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>初一英语语法通关 · 沪教版七上全模块</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b2450'/%3E%3Cpath d='M9 22V11h3.2l4 6.6V11H19v11h-3.2l-4-6.6V22z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4fa;
  --card:#ffffff;
  --ink:#1b2340;
  --ink2:#4a5470;
  --ink3:#78829c;
  --line:#e2e7f2;
  --indigo:#26327a;
  --blue:#3552d6;
  --teal:#0f9c8f;
  --purple:#6b5bd2;
  --amber:#c47a15;
  --red:#c8453f;
  --green:#1f8a5b;
  --shadow:0 6px 22px rgba(27,35,64,.07);
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
a{color:var(--blue);text-decoration:none}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* ===== 左侧导航 ===== */
.nav{
  position:sticky;top:0;align-self:start;height:100vh;overflow:auto;
  background:var(--indigo);color:#e8ecff;padding:20px 16px 26px;
  display:flex;flex-direction:column;gap:18px;
}
.brand{display:flex;gap:10px;align-items:flex-start}
.brand .mark{width:34px;height:34px;border-radius:9px;background:#35449c;display:grid;place-items:center;flex:0 0 auto}
.brand h1{font-size:15px;margin:0;line-height:1.35;font-weight:600;letter-spacing:.2px}
.brand p{margin:3px 0 0;font-size:11px;color:#a8b3e0;line-height:1.4}
.navlist{display:flex;flex-direction:column;gap:2px}
.navitem{
  display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;
  color:#cfd6f5;font-size:13.5px;cursor:pointer;border:0;background:none;text-align:left;width:100%;
  font-family:inherit;
}
.navitem:hover{background:rgba(255,255,255,.08);color:#fff}
.navitem.on{background:#fff;color:var(--indigo);font-weight:600}
.navitem .badge{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;color:inherit;opacity:.8}
.navitem svg{width:16px;height:16px;flex:0 0 auto;opacity:.85}
.navfoot{margin-top:auto;background:rgba(255,255,255,.08);border-radius:11px;padding:11px 12px;font-size:12px;color:#c3ccf2}
.navfoot b{color:#fff;font-variant-numeric:tabular-nums}
.navfoot .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.16);margin-top:7px;overflow:hidden}
.navfoot .bar i{display:block;height:100%;background:#57d6c5;border-radius:3px;transition:width .4s}
/* ===== 主区 ===== */
main{min-width:0;padding:0 0 60px}
.topbar{
  position:sticky;top:0;z-index:8;background:rgba(242,244,250,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:13px 30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.topbar h2{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px}
.topbar .sub{color:var(--ink3);font-size:12px}
.pills{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--ink2)}
.pill b{color:var(--ink);font-variant-numeric:tabular-nums}
.wrap{padding:24px 30px 0;max-width:1180px}
/* ===== 通用卡片 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:20px 22px}
h3.sec{font-size:19px;margin:0 0 6px;font-weight:600;letter-spacing:.2px}
p.lead{margin:0 0 16px;color:var(--ink2);font-size:13.5px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:10px;
  padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  background:var(--blue);color:#fff;transition:.16s;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:#c3ccdf}
.btn.teal{background:var(--teal)}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
/* ===== 首页 ===== */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) 300px;gap:18px}
.hero .card{padding:26px 26px 24px}
.hero h3{margin:0;font-size:26px;line-height:1.35;letter-spacing:.3px}
.hero .kicker{font-size:12px;letter-spacing:2px;color:var(--teal);font-weight:700;text-transform:uppercase;margin-bottom:8px}
.hero p{margin:10px 0 18px;color:var(--ink2);font-size:14px;max-width:56ch}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap}
.ringbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring .inner{width:122px;height:122px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center}
.ring .inner strong{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.ring .inner span{display:block;font-size:11.5px;color:var(--ink3);margin-top:6px}
.ringlegend{font-size:12px;color:var(--ink3);text-align:center}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12px;color:var(--ink3)}
.suggest{margin-top:16px;border:1px dashed #c8d1e8;background:#f8faff;border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--ink2)}
.suggest b{color:var(--ink)}
.path{margin-top:22px}
.pathgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.step{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 16px;position:relative}
.step .n{font-size:12px;color:var(--teal);font-weight:700;letter-spacing:1px}
.step h4{margin:6px 0 4px;font-size:15px}
.step p{margin:0;font-size:12.5px;color:var(--ink3);line-height:1.6}
/* ===== 规则精讲 ===== */
.rulecard{padding:22px 24px;margin-bottom:16px}
.rulecard .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rulecard h3{margin:0;font-size:18px}
.tag{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:6px;background:#eef2ff;color:var(--indigo);border:1px solid #dde4ff;white-space:nowrap}
.tag.warn{background:#fff4e6;color:#8a5410;border-color:#f4dfc2}
.tag.ext{background:#f1ecff;color:#5540a8;border-color:#e0d6ff}
.tag.core{background:#e7f7f3;color:#0a7a6f;border-color:#cfeee7}
.rulecard .body{margin-top:12px;color:var(--ink2);font-size:14px}
.rulecard .body p{margin:8px 0}
.formula{background:#f6f8ff;border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 14px;margin:12px 0;font-size:14px;color:var(--ink)}
.formula code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:#22307a}
.eg{display:grid;grid-template-columns:26px minmax(0,1fr);gap:6px;margin:6px 0;font-size:14px}
.eg i{font-style:normal;font-weight:700;font-size:13px}
.eg i.ok{color:var(--green)}
.eg i.no{color:var(--red)}
.eg .note{color:var(--ink3);font-size:12.5px;margin-left:6px}
table.cmp{width:100%;border-collapse:collapse;margin:12px 0;table-layout:fixed}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:9px 11px;font-size:13px;vertical-align:top;text-align:left}
table.cmp th{background:#f5f7ff;color:var(--ink);font-weight:600}
table.cmp td code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#f6f8ff;padding:1px 5px;border-radius:4px;font-size:12.5px}
.mnemonic{background:#fffaf0;border:1px solid #f0e2c6;border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13.5px;color:#6b4a12}
/* ===== 文章 / 对比 / 闭环 ===== */
.passage{background:#fbfcff;border:1px solid #dde4f3;border-radius:12px;padding:17px 19px;margin:12px 0 16px;font-size:14px;line-height:1.95;color:#33405f}
.passage .ptitle{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-weight:600;color:var(--ink);font-size:15px}
.passage .pline{margin:0 0 9px}
.clozebox{background:#fbfcff;border:1px solid #dde4f3;border-radius:12px;padding:16px 19px;margin:12px 0;font-size:14.5px;line-height:2.1;color:#33405f;white-space:pre-line}
.clozebox b{color:var(--blue);font-weight:700}
.bank{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.bank code{background:#f6f8ff;border:1px solid #e2e7f2;border-radius:6px;padding:3px 9px;font-size:13px;color:#22307a}
.contrastgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.contrast{padding:18px 19px}
.contrast .chead{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.contrast h4{margin:0;font-size:15.5px;line-height:1.5;flex:1;min-width:0}
.contrast .crow{display:grid;grid-template-columns:22px minmax(0,1fr);gap:7px;padding:7px 0;border-top:1px solid #edf0f7;font-size:13.5px;line-height:1.65}
.contrast .crow:first-of-type{border-top:0}
.contrast .crow i{font-style:normal;font-weight:700;font-size:12px}
.contrast .crow i.ok{color:var(--green)}
.contrast .crow i.no{color:var(--red)}
.contrast .crow .cn{color:var(--ink3);font-size:12px;margin-left:5px}
.contrast .crule{background:#f7f9ff;border-radius:8px;padding:8px 11px;font-size:12.5px;color:#4a5470;margin:8px 0 10px;line-height:1.65}
.loopcard{padding:18px 20px}
.loopgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:12px}
.loopstep{border:1px solid var(--line);border-radius:10px;padding:12px 12px;background:#fff;position:relative;min-width:0}
.loopstep .ln{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.8px}
.loopstep h4{margin:5px 0 3px;font-size:14px}
.loopstep p{margin:0;color:var(--ink3);font-size:12px;line-height:1.55}
.loopstep .lstatus{display:inline-block;margin-top:7px;font-size:11px;padding:2px 7px;border-radius:5px;background:#eef2ff;color:var(--indigo)}
.loopstep.on{border-color:#b9c6ef;background:#f8faff;box-shadow:0 4px 14px rgba(38,50,122,.06)}
.finaltoc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.finaltoc .ft{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 12px;font-size:12.5px;color:var(--ink2)}
.finaltoc .ft b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:2px}
@media (max-width:1100px){.loopgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.finaltoc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.contrastgrid{grid-template-columns:1fr}.loopgrid{grid-template-columns:1fr 1fr}.passage{font-size:13.5px;padding:14px}.clozebox{font-size:13.5px}}

/* ===== 题卡 ===== */
.secbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.secbar h3{margin:0;font-size:19px}
.qlist{display:flex;flex-direction:column;gap:14px}
.q{padding:18px 20px}
.q .qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink3)}
.q .qno{font-weight:700;color:var(--indigo);font-size:13px;letter-spacing:.4px}
.q .stem{margin:10px 0 0;font-size:15px;line-height:1.75}
.q .stem .blank{display:inline-block;min-width:64px;border-bottom:1.5px solid #9aa6c6;margin:0 3px}
.q .stem em{font-style:normal;color:var(--blue);font-weight:600}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{
  display:flex;align-items:center;gap:10px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;
  background:#fff;cursor:pointer;font-size:14px;text-align:left;font-family:inherit;color:var(--ink);
}
.opt:hover{border-color:#b9c3e2;background:#fbfcff}
.opt .k{width:22px;height:22px;border-radius:6px;background:#eef1fa;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2);flex:0 0 auto}
.opt.sel{border-color:var(--blue);background:#f4f7ff}
.opt.right{border-color:#8ed2bd;background:#f0fbf7}
.opt.right .k{background:#d5f2e8;color:#0a7a6f}
.opt.wrong{border-color:#edb1ad;background:#fff5f4}
.opt.wrong .k{background:#fbe0de;color:#a2352f}
.opt:disabled{cursor:default}
.qtext{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.qtext input{
  flex:1 1 260px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;
  font-size:14px;font-family:inherit;background:#fff;color:var(--ink);
}
.qtext input:focus{outline:none;border-color:#9fb0ea;box-shadow:0 0 0 3px rgba(53,82,214,.10)}
.qtext input.right{border-color:#8ed2bd;background:#f4fdf9}
.qtext input.wrong{border-color:#edb1ad;background:#fff7f6}
.fb{margin-top:12px;border-radius:10px;padding:11px 14px;font-size:13.5px;display:none}
.fb.show{display:block}
.fb.ok{background:#f0fbf6;border:1px solid #cdeade;color:#0d6b4b}
.fb.no{background:#fff6f5;border:1px solid #f3d6d3;color:#962c26}
.fb .title{font-weight:700;margin-bottom:4px;font-size:13.5px}
.fb .why{margin-top:6px;color:var(--ink2);font-size:13px;line-height:1.7}
.fb .ans{margin-top:6px;font-size:13px;color:var(--ink)}
.fb .ans b{color:var(--indigo)}
.selfcheck{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{padding:34px 20px;text-align:center;color:var(--ink3);font-size:13.5px}
/* ===== 分组入口 ===== */
.groupgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.group{
  display:flex;gap:14px;align-items:flex-start;padding:18px 20px;background:#fff;border:1px solid var(--line);
  border-radius:12px;cursor:pointer;text-align:left;font-family:inherit;
}
.group:hover{border-color:#c2cbe6;box-shadow:0 8px 20px rgba(27,35,64,.06)}
.group .idx{width:42px;height:42px;border-radius:10px;background:#eef2ff;color:var(--indigo);display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto}
.group h4{margin:0 0 3px;font-size:15.5px}
.group p{margin:0;font-size:12.5px;color:var(--ink3);line-height:1.6}
.group .prog{margin-top:8px;font-size:12px;color:var(--ink2);display:flex;gap:10px;align-items:center}
.group .prog .bar{flex:1 1 90px;height:5px;background:#eef1f8;border-radius:3px;overflow:hidden;max-width:160px}
.group .prog .bar i{display:block;height:100%;background:var(--teal);border-radius:3px}
/* ===== 综合通关 ===== */
.exambar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:16px 20px;margin-bottom:16px}
.exambar .big{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--indigo)}
.exambar .meta{font-size:12.5px;color:var(--ink3)}
.resultcard{padding:26px}
.resultcard h3{margin:0 0 4px;font-size:22px}
.resultcard .score{font-size:40px;font-weight:700;color:var(--indigo);font-variant-numeric:tabular-nums;line-height:1.1}
.resultcard .lv{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700}
.lv.s{background:#e9f8f2;color:#0d6b4b}
.lv.a{background:#eef2ff;color:#26327a}
.lv.b{background:#fff6e8;color:#8a5410}
.lv.c{background:#fdeeee;color:#962c26}
/* ===== 表格 ===== */
table.rep{width:100%;border-collapse:collapse;background:#fff;table-layout:fixed}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:10px 12px;font-size:13px;text-align:left;vertical-align:middle}
table.rep th{background:#f7f9ff;color:var(--ink2);font-weight:600;font-size:12.5px}
table.rep td.num{font-variant-numeric:tabular-nums}
.mini{height:5px;background:#eef1f8;border-radius:3px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--teal);border-radius:3px}
/* ===== 提示条 ===== */
.note{border:1px solid #dbe3f7;background:#f7f9ff;border-radius:10px;padding:11px 14px;font-size:13px;color:var(--ink2);margin:12px 0}
.note b{color:var(--ink)}
/* ===== 听力与助教 ===== */
.audiobar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.audiobar .btn{background:#eef4ff;color:#26327a;border:1px solid #d5e0ff}
.audiobar .btn:hover{background:#e2ebff}
.audiobar .hint{font-size:12px;color:var(--ink3)}
.scriptbox{display:none;margin-top:10px;background:#f7f9ff;border:1px dashed #cfd9f2;border-radius:9px;padding:10px 13px;font-size:13.5px;color:var(--ink2);white-space:pre-line}
.scriptbox.show{display:block}
.setgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.setcard{padding:18px 20px;cursor:pointer;text-align:left;font-family:inherit;background:#fff;border:1px solid var(--line);border-radius:12px}
.setcard:hover{border-color:#c2cbe6;box-shadow:0 8px 20px rgba(27,35,64,.06)}
.setcard .no{font-size:11.5px;letter-spacing:1px;color:var(--teal);font-weight:700}
.setcard h4{margin:5px 0 4px;font-size:16px}
.setcard p{margin:0;font-size:12.5px;color:var(--ink3)}
.chatwrap{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.msg{max-width:86%;padding:12px 15px;border-radius:12px;font-size:13.8px;line-height:1.75;white-space:pre-line}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;box-shadow:var(--shadow)}
.msg.user{background:var(--indigo);color:#fff;align-self:flex-end}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid #d5def5;background:#f7f9ff;color:#33407a;border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit}
.chip:hover{background:#edf2ff}
.coachbar{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.coachbar input{flex:1 1 260px;min-width:0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:14px}
.coachbar input:focus{outline:none;border-color:#9fb0ea;box-shadow:0 0 0 3px rgba(53,82,214,.10)}
.genwrap{margin-top:16px}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1b2340;color:#fff;
  padding:11px 18px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:86vw;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* ===== 账号 / 登录 ===== */
.authmask,.acctmask{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(14,21,48,.55);backdrop-filter:blur(6px)}
.authmask.show,.acctmask.show{display:flex}
.authcard{width:100%;max-width:390px;background:#fff;border-radius:16px;padding:24px 24px 20px;box-shadow:0 24px 60px rgba(12,20,52,.28)}
.authcard h3{margin:0 0 4px;font-size:20px;color:#1b2552;letter-spacing:-.2px}
.authcard .asub{color:#78829c;font-size:12.5px;margin:0 0 16px;line-height:1.7}
.authtabs{display:flex;gap:6px;background:#f3f6fc;border-radius:9px;padding:4px;margin-bottom:14px}

<script>
/* ============================================================
   情态动词专项训练 · 数据层
   题型：choice 单选 / fill 填空 / text 句型转换 / open 汉译英自评
   ============================================================ */
const GROUPS = {
  A:{title:`基础辨析`,sub:`15 题 · 单选`,desc:`先分清每个情态动词到底管什么：能力、许可、必须、建议、推测。`},
  B:{title:`语境选择`,sub:`12 题 · 单选`,desc:`把句子放回对话里，考语用：该用 mustn't 还是 needn't，答语怎么接。`},
  C:{title:`动词形式填空`,sub:`12 题 · 填空`,desc:`情态动词后面一定用原形；但 have to、be able to 会随人称和时态变。`},
  D:{title:`句型转换`,sub:`8 题 · 改写`,desc:`肯定、否定、疑问互改，改完先问一句：意思变了没有。`},
  E:{title:`句子改错`,sub:`6 题 · 改错`,desc:`每句一处错，全是我们班最常写错的那几种。`},
  F:{title:`连词成句`,sub:`5 题 · 组句`,desc:`先摆情态动词，再摆主语，最后放剩下的部分。`},
  G:{title:`汉译英`,sub:`6 题 · 翻译`,desc:`自己写，写完对照参考答案自评。写不出的先回规则区看句型。`},
  H:{title:`短文填空`,sub:`8 题 · 语篇`,desc:`一篇短信八个空，考的是在整段里选对情态动词。`}
};
const EXAMPASSAGE = `Dear Tom,\nI'm a middle school student now. There are many rules in my school. We (1)____ wear a uniform every day, but we (2)____ wear a tie. We (3)____ be late for class. In the library, we (4)____ keep quiet.\nMy brother is in Grade 9. His school is far from home, so he (5)____ get up at six every morning. I usually (6)____ finish my homework before dinner, because my parents ask me to.\nYesterday I asked my mother, “(7)____ I watch TV for a while?” She said, “Yes, but you (8)____ watch for more than an hour.”\nWhat about your school? Please write to me soon.\nYours,\nLi Ming`;
const WORDBANK = [`must`,`mustn't`,`needn't`,`may`,`don't have to`,`has to`,`have to`,`can`];

const KPS = {
  C1:{name:`三条铁律与动词形式`,short:`情态动词后接原形`},
  C2:{name:`can / could：能力与许可`,short:`会、能、可以`},
  C3:{name:`may：许可与推测`,short:`可以、也许`},
  C4:{name:`must / have to / needn't`,short:`必须、禁止、不必`},
  C5:{name:`shall / should：建议`,short:`要不要、应该`},
  C6:{name:`would：委婉请求与意愿`,short:`你愿意吗`},
  C7:{name:`推测句 must be / can't be`,short:`一定是、不可能是`},
  C8:{name:`答语与语用`,short:`问 must，答 needn't`},
  C9:{name:`if + would / wish + could`,short:`假设与愿望（拓展）`},
  C10:{name:`语篇与写作迁移`,short:`整段里用对`}
};

const QS = [
/* ---------- A 基础辨析 ---------- */
{id:`A1`,g:`A`,type:`choice`,kp:`C8`,level:2,
 stem:`— Must I finish the work today?\n— No, you ____. You can do it tomorrow.`,
 opts:[`mustn't`,`needn't`,`can't`,`shouldn't`],ans:1,
 exp:`must 开头提问，否定回答固定用 needn't 或 don't have to，意思是“不必”。mustn't 是“不许、禁止”，用它回答就把“今天不必交”变成了“今天禁止交”，意思全变了。can't 表能力不够或推测“不可能”，也不用来回答 must。`},
{id:`A2`,g:`A`,type:`choice`,kp:`C4`,level:1,
 stem:`You ____ play football in the street. It's dangerous.`,
 opts:[`mustn't`,`needn't`,`may`,`could`],ans:0,
 exp:`在马路上踢球是明令禁止，用 mustn't（不许）。needn't 是“不必”，may 是“可以”，could 是“能/可以”，三个都不带禁止意味，放在这里等于允许，语义反了。`},
{id:`A3`,g:`A`,type:`choice`,kp:`C3`,level:1,
 stem:`— ____ I use your bike?\n— Sure. Here is the key.`,
 opts:[`Must`,`May`,`Should`,`Need`],ans:1,
 exp:`向别人借东西、请求许可，用 May I ...? 最标准。Must I 是“我必须吗”，Should I 是“我该不该”，Need I 是“我需要吗”，都不是在请求许可。`},
{id:`A4`,g:`A`,type:`choice`,kp:`C2`,level:2,
 stem:`My sister ____ swim well when she was six.`,
 opts:[`can`,`could`,`may`,`must`],ans:1,
 exp:`when she was six 是过去时间，表过去的能力要用 could。can 只表现在；may 表许可或推测；must 表必须或肯定推测，都不能跟过去时间搭配表示“当时会”。`},
{id:`A5`,g:`A`,type:`choice`,kp:`C6`,level:2,
 stem:`— Could you help me carry the box?\n— ____.`,
 opts:[`Yes, I could.`,`Sure.`,`No, I couldn't.`,`You're welcome.`],ans:1,
 exp:`Could you ...? 是委婉请求，不是问过去能力，所以答语用 Sure / Of course / Certainly，不用 Yes, I could。You're welcome 是别人道谢时的回答，位置不对。`},
{id:`A6`,g:`A`,type:`choice`,kp:`C4`,level:2,
 stem:`It's Sunday tomorrow. You ____ get up early.`,
 opts:[`mustn't`,`don't have to`,`can't`,`shouldn't`],ans:1,
 exp:`明天周日，不用早起，是“不必”，用 don't have to。mustn't 是禁止，can't 是不能，shouldn't 是不该，三个都变成“不许早起”，与原意不符。`},
{id:`A7`,g:`A`,type:`choice`,kp:`C7`,level:2,
 stem:`— Where is Tom?\n— He ____ be in the library. I saw him there just now.`,
 opts:[`can't`,`must`,`may`,`should`],ans:1,
 exp:`just now 刚在图书馆见过他，说明“现在他一定在图书馆”，肯定推测用 must be。can't be 是“不可能”，may be 是“可能在”（把握不足），should 表“按理应该”，都不如 must 确定。`},
{id:`A8`,g:`A`,type:`choice`,kp:`C7`,level:2,
 stem:`That ____ be Lucy's bag. Hers is much bigger.`,
 opts:[`must`,`can't`,`may`,`needn't`],ans:1,
 exp:`她的包大得多，所以这个“不可能是她的”，否定推测用 can't be。must be 是“一定是”，意思正好相反；may be 是“可能是”；needn't 表“不必”，不能用来推测。`},
{id:`A9`,g:`A`,type:`choice`,kp:`C4`,level:1,
 stem:`We ____ keep quiet in the library.`,
 opts:[`can`,`may`,`must`,`could`],ans:2,
 exp:`图书馆保持安静是规定、是义务，用 must（必须）。can、may、could 都偏“可以、能够”，读起来像“允许你安静”，不是规则要求。`},
{id:`A10`,g:`A`,type:`choice`,kp:`C5`,level:2,
 stem:`— Shall we go to the park this afternoon?\n— ____.`,
 opts:[`Good idea.`,`Yes, we shall.`,`No, we don't.`,`That's right.`],ans:0,
 exp:`Shall we ...? 是提建议、征求意见，同意就说 Good idea / OK / Let's go。英语里不拿 Yes, we shall 来答这种提议，No, we don't 也用错了助动词。`},
{id:`A11`,g:`A`,type:`choice`,kp:`C5`,level:1,
 stem:`You look tired. You ____ have a rest.`,
 opts:[`should`,`can`,`may`,`mustn't`],ans:0,
 exp:`看到别人累，给出建议用 should（应该）。can、may 是“可以”，语气是许可不是建议；mustn't 是禁止休息，完全相反。`},
{id:`A12`,g:`A`,type:`choice`,kp:`C6`,level:2,
 stem:`— ____ you like to come to my birthday party?\n— I'd love to.`,
 opts:[`Would`,`Do`,`Will`,`Could`],ans:0,
 exp:`Would you like to ...? 是固定邀请句型，答语 I'd love to 也是配套的。Do you like 问的是“你喜不喜欢”，Will you 是“你会不会”，Could you 是“你能不能帮我”，都不跟 I'd love to 搭配。`},
{id:`A13`,g:`A`,type:`choice`,kp:`C7`,level:2,
 stem:`The light is on. Someone ____ be in the room.`,
 opts:[`must`,`can't`,`needn't`,`shouldn't`],ans:0,
 exp:`灯亮着，说明房里“一定有人”，肯定推测用 must be。can't be 是“不可能有人”，needn't 是“不必”，shouldn't 是“不该”，都不符合“灯亮着”这个证据。`},
{id:`A14`,g:`A`,type:`choice`,kp:`C4`,level:2,
 stem:`Don't worry. You ____ finish it today. Tomorrow is OK.`,
 opts:[`mustn't`,`can't`,`don't have to`,`shouldn't`],ans:2,
 exp:`明天做也行，今天“不必”完成，用 don't have to。mustn't 是禁止，can't 是不能，shouldn't 是不该，都会让孩子以为“今天不许做”。`},
{id:`A15`,g:`A`,type:`choice`,kp:`C8`,level:2,
 stem:`— Must he stay at home?\n— Yes, he ____.`,
 opts:[`must`,`need`,`can`,`should`],ans:0,
 exp:`must 提问，肯定回答就用 must，否定回答才用 needn't。need、can、should 都不能直接接在 Yes, he 后面回答 must 的问句。`},

/* ---------- B 语境选择 ---------- */
{id:`B1`,g:`B`,type:`choice`,kp:`C5`,level:2,
 stem:`A: My bag is heavy.\nB: ____ I carry it for you?`,
 opts:[`Must`,`Shall`,`Should`,`Need`],ans:1,
 exp:`主动提出帮别人做事，用 Shall I ...?（要我……吗）。Must I 是“我必须吗”，Should I 是“我该不该”，Need I 是“我需要吗”，都没有“我来帮你”的意思。`},
{id:`B2`,g:`B`,type:`choice`,kp:`C5`,level:2,
 stem:`A: I can't find my keys.\nB: You ____ look under the sofa.`,
 opts:[`should`,`can`,`may`,`mustn't`],ans:0,
 exp:`给建议用 should（应该去沙发下面找找）。can、may 是许可，mustn't 是禁止，都不能拿来提建议。`},
{id:`B3`,g:`B`,type:`choice`,kp:`C5`,level:1,
 stem:`A: I've got a bad cold.\nB: You ____ go to see a doctor.`,
 opts:[`can`,`should`,`may`,`could`],ans:1,
 exp:`生病了给对方建议，用 should。can、may、could 都偏“可以”，语气太弱，像在给许可而不是劝他去看病。`},
{id:`B4`,g:`B`,type:`choice`,kp:`C4`,level:2,
 stem:`Teacher: You ____ be late for class again.`,
 opts:[`needn't`,`mustn't`,`don't have to`,`couldn't`],ans:1,
 exp:`老师警告“不许再迟到”，用 mustn't。needn't、don't have to 都是“不必”，等于说迟到没关系；couldn't 是过去不能，时态也不对。`},
{id:`B5`,g:`B`,type:`choice`,kp:`C5`,level:2,
 stem:`A: ____ we meet at the school gate at 8:00?\nB: OK.`,
 opts:[`Shall`,`Must`,`Need`,`Should`],ans:0,
 exp:`Shall we ...? 用来提议一起做某事并征求意见，答语 OK 正好接。Must we 是“我们必须吗”，Need we 是“我们需要吗”，Should we 是“我们该不该”，都带质疑，不是提议。`},
{id:`B6`,g:`B`,type:`choice`,kp:`C6`,level:2,
 stem:`A: Could I use your phone?\nB: ____.`,
 opts:[`Yes, you could.`,`Of course.`,`No, I don't.`,`You're welcome.`],ans:1,
 exp:`Could I ...? 是请求许可，同意用 Of course / Sure / Go ahead。Yes, you could 是中式答法；No, I don't 助动词不对；You're welcome 答的是 Thank you。`},
{id:`B7`,g:`B`,type:`choice`,kp:`C7`,level:2,
 stem:`A: Who's that man over there?\nB: It ____ be Mr Li. He is in Shanghai now.`,
 opts:[`must`,`can't`,`may`,`needn't`],ans:1,
 exp:`他本人在上海，所以远处那个人“不可能是李老师”，否定推测用 can't be。must be 是“一定是”，与后面的事实冲突。`},
{id:`B8`,g:`B`,type:`choice`,kp:`C7`,level:2,
 stem:`A: Is this your pen?\nB: It ____ be mine. Mine is blue, but this is black.`,
 opts:[`must`,`may`,`can't`,`should`],ans:2,
 exp:`自己的是蓝笔，这只是黑的，所以“不可能是我的”，用 can't be。may be 表可能，语气不够；must be 与事实矛盾；should 表“按理应该”，也不对。`},
{id:`B9`,g:`B`,type:`choice`,kp:`C3`,level:1,
 stem:`A: ____ I open the window?\nB: Yes, please. It's hot here.`,
 opts:[`May`,`Must`,`Need`,`Should`],ans:0,
 exp:`征求对方同意“我可以开窗吗”，用 May I。Yes, please 正是许可的答语。Must I 是“我必须开吗”，Need I 是“我需要开吗”，Should I 是“我该开吗”，都不对。`},
{id:`B10`,g:`B`,type:`choice`,kp:`C4`,level:2,
 stem:`A: I'm going to the library.\nB: You ____ return the book before Friday.`,
 opts:[`may`,`must`,`can`,`could`],ans:1,
 exp:`图书馆规定周五前必须还书，用 must。may、can、could 都是“可以”，把硬性规定说成了可选项。`},
{id:`B11`,g:`B`,type:`choice`,kp:`C5`,level:2,
 stem:`A: It's raining hard.\nB: We ____ go out now.`,
 opts:[`shouldn't`,`needn't`,`may`,`must`],ans:0,
 exp:`雨很大，现在“不该出去”，给建议或劝阻用 shouldn't。needn't 是“不必”，may 是“可以”，must 是“必须”，语义都不对。`},
{id:`B12`,g:`B`,type:`choice`,kp:`C6`,level:2,
 stem:`A: I don't know what to wear for the party.\nB: You ____ wear your blue dress. It looks nice.`,
 opts:[`could`,`must`,`need`,`have to`],ans:0,
 exp:`could 除了表过去能力，还能用来委婉提建议，等于“你可以试试”。must、have to 变成命令，need 是“需要”，语气都不合适。`},

/* ---------- C 动词形式填空 ---------- */
{id:`C1`,g:`C`,type:`fill`,kp:`C1`,level:1,
 stem:`He can ____ (swim) very well.`,
 answers:[`swim`],
 exp:`情态动词 can 后面必须跟动词原形，主语是 He 也不加 s。写成 swims 是最典型的错。`},
{id:`C2`,g:`C`,type:`fill`,kp:`C1`,level:1,
 stem:`You mustn't ____ (play) with fire.`,
 answers:[`play`],
 exp:`mustn't 后面同样接原形，play 不加 -ing 也不加 s。`},
{id:`C3`,g:`C`,type:`fill`,kp:`C1`,level:3,
 stem:`____ (be) she able to come tomorrow?`,
 answers:[`is`],
 exp:`这题考的是 be able to，不是 can。be able to 里的 be 要随主语变形式，she 对应 Is；写成 Can 就把原句结构拆了。`},
{id:`C4`,g:`C`,type:`fill`,kp:`C4`,level:2,
 stem:`Tom ____ (have to) look after his sister today.`,
 answers:[`has to`],
 exp:`have to 是实义动词短语，主语 Tom 是第三人称单数，要变成 has to。情态动词不变形，have to 要变形，这是两套东西。`},
{id:`C5`,g:`C`,type:`fill`,kp:`C4`,level:3,
 stem:`They ____ (not have to) come early.`,
 answers:[`don't have to`,`do not have to`,`needn't`],
 exp:`have to 的否定要借助助动词 do，主语 They 用 don't have to；也可以换成 needn't，意思都是“不必”。写成 haven't to 是错的。`},

 answers:[`need i hand it in now? no, you needn't`,`need i hand it in now? no, you don't have to`],

{id:`L1`,g:`L`,type:`text`,kp:`C4`,level:3,
 stem:`He has to get up early.（改否定句）`,
 answers:[`he doesn't have to get up early`,`he does not have to get up early`],
 exp:`has to 的否定借 does，has 还原成 have：He doesn't have to ...。`},
{id:`L2`,g:`L`,type:`text`,kp:`C4`,level:3,
 stem:`He has to get up early.（改一般疑问句）`,
 answers:[`does he have to get up early?`],
 exp:`借助 does 提前，has 还原 have：Does he have to get up early?`},
{id:`L3`,g:`L`,type:`text`,kp:`C12`,level:3,
 stem:`You had better see a doctor.（改否定句）`,
 answers:[`you had better not see a doctor`,`you'd better not see a doctor`],
 exp:`had better 的否定在 better 后加 not：had better not do。不是 hadn't better。`},
{id:`L4`,g:`L`,type:`text`,kp:`C12`,level:4,
 stem:`She ought to say sorry.（改否定句）`,
 answers:[`she oughtn't to say sorry`,`she ought not to say sorry`],
 exp:`ought to 的否定是 oughtn't to / ought not to，to 保留。`},
{id:`L5`,g:`L`,type:`text`,kp:`C12`,level:4,
 stem:`They used to play chess.（改否定句）`,
 answers:[`they didn't use to play chess`,`they did not use to play chess`],

{id:`L6`,g:`L`,type:`text`,kp:`C15`,level:3,

{id:`L7`,g:`L`,type:`text`,kp:`C15`,level:4,
 stem:`You mustn't smoke here.（用 be allowed to 改写）`,

{id:`L8`,g:`L`,type:`text`,kp:`C13`,level:3,
 stem:`He would like to join us.（改一般疑问句）`,
 answers:[`would he like to join us?`],
 exp:`would 提到主语前：Would he like to join us? 后面仍旧 to join。`},

{id:`M1`,g:`M`,type:`fill`,kp:`C13`,level:3,
 stem:`(1)____ you tell me how to get to your new home?`,

{id:`M2`,g:`M`,type:`fill`,kp:`C3`,level:3,
 stem:`I (2)____ take the underground, but I'm not sure which line to take.`,

{id:`M3`,g:`M`,type:`fill`,kp:`C12`,level:3,
 stem:`You'd better (3)____ me a map.`,

{id:`M4`,g:`M`,type:`fill`,kp:`C4`,level:3,

{id:`M5`,g:`M`,type:`fill`,kp:`C12`,level:4,

{id:`M6`,g:`M`,type:`fill`,kp:`C3`,level:3,

{id:`M7`,g:`M`,type:`fill`,kp:`C4`,level:3,

{id:`M8`,g:`M`,type:`fill`,kp:`C3`,level:4,

{id:`M9`,g:`M`,type:`fill`,kp:`C15`,level:4,

{id:`M10`,g:`M`,type:`fill`,kp:`C4`,level:4,
 stem:`You (10)____ worry about food—I can cook.`,
 answers:[`needn't`,`don't have to`,`do not have to`],

{id:`N1`,g:`N`,type:`open`,kp:`C12`,level:4,

{id:`N2`,g:`N`,type:`open`,kp:`C12`,level:4,

{id:`N6`,g:`N`,type:`open`,kp:`C15`,level:4,

 opts:[`must have rained`,`must rain`,`can't have rained`,`should rain`],ans:0,

{id:`O2`,g:`O`,type:`choice`,kp:`C14`,level:4,
 stem:`She ____ the film—she told me the ending.`,
 opts:[`can't have seen`,`mustn't have seen`,`needn't have seen`,`shouldn't see`],ans:0,

{id:`O3`,g:`O`,type:`choice`,kp:`C14`,level:4,
 stem:`He hasn't come yet. He ____ missed the bus.`,
 opts:[`might have`,`must be`,`may be`,`can't have`],ans:0,
 exp:`不确定的过去推测用 might have done；must be 是对现在，can't have 是“不可能”。`},
{id:`O4`,g:`O`,type:`choice`,kp:`C14`,level:4,
 stem:`You ____ bought so much food—nobody came.`,
 opts:[`needn't have bought`,`mustn't have bought`,`didn't need buy`,`needn't buy`],ans:0,

{id:`O5`,g:`O`,type:`choice`,kp:`C12`,level:3,
 stem:`My grandfather ____ walk to work, but now he takes a bus.`,

{id:`O6`,g:`O`,type:`text`,kp:`C12`,level:4,
 stem:`He used to smoke.（改一般疑问句）`,

 exp:`used to 的疑问借 did，use 还原不加 d：Did he use to smoke?`},
{id:`O7`,g:`O`,type:`fill`,kp:`C11`,level:4,
 stem:`She ____ (dare not) go out at night.`,
 answers:[`daren't`,`dare not`],
 exp:`dare 作情态动词，否定 daren't / dare not + 原形，第三人称不加 s。`},
{id:`O8`,g:`O`,type:`text`,kp:`C12`,level:4,
 stem:`You are supposed to be here at eight.（改否定句）`,
 answers:[`you aren't supposed to be here at eight`,`you are not supposed to be here at eight`],
 exp:`be supposed to 的否定把 not 加在 be 后：aren't supposed to be。`},
{id:`O9`,g:`O`,type:`fill`,kp:`C12`,level:4,
 stem:`I would rather ____ (not go) out tonight.`,
 answers:[`not go`],
 exp:`would rather 的否定是 would rather not + 原形。`},
{id:`O10`,g:`O`,type:`choice`,kp:`C14`,level:4,
 stem:`You ____ have told him—he already knew the truth.`,
 opts:[`needn't have told`,`mustn't have told`,`shouldn't have told`,`can't have told`],ans:0,
 exp:`他早就知道，所以你“本来不必告诉”，用 needn't have done；shouldn't have done 是“本该不做却做了”，带责备。`}
];

, "am", "are", "be"], "ans": 2, "exp": "两个人是复数，be 动词用 are。"}, {"id": "R8", "g": "R", "type": "choice", "kp": "G2", "level": 2, "stem": "— ____ he like apples?\n— Yes, he does.", "opts": ["Do", "Does", "Is", "Are"], "ans": 1, "exp": "答语 he does 提示问句用 Does。Does 后面动词必须原形 like。"}, {"id": "R9", "g": "R", "type": "fill", "kp": "G2", "level": 1, "stem": "My mother ____ (wash) the dishes every evening.", "answers": ["washes"], "exp": "every evening 表习惯；my mother 三单，wash 变 washes（ch/sh 结尾加 es）。"}, {"id": "R10", "g": "R", "type": "fill", "kp": "G2", "level": 2, "stem": "Kate ____ (not like) maths. She prefers English.", "answers": ["doesn't like", "does not like"], "exp": "三单否定：doesn't + 原形 like，不能写 doesn't likes。"}, {"id": "R11", "g": "R", "type": "fill", "kp": "G2", "level": 2, "stem": "____ your sister ____ (read) English every morning?", "answers": ["does read"], "exp": "一般疑问句：Does + 主语 + 原形。两个空一起写 does read。"}, {"id": "R12", "g": "R", "type": "fill", "kp": "G2", "level": 1, "stem": "They ____ (study) in No.1 Middle School.", "answers": ["study"], "exp": "主语 They 复数，动词用原形 study。"}, {"id": "S1", "g": "S", "type": "choice", "kp": "G3", "level": 1, "stem": "The film is very ____. We all like it.", "opts": ["interest", "interesting", "interested", "interests"], "ans": 1, "exp": "修饰事物“电影”用 -ing 形式 interesting。interested 说人“感兴趣”。"}, {"id": "S2", "g": "S", "type": "choice", "kp": "G3", "level": 1, "stem": "I am ____ in Chinese history.", "opts": ["interest", "interesting", "interested", "interestingly"], "ans": 2, "exp": "主语是人，说“感兴趣”用 be interested in。"}, {"id": "S3", "g": "S", "type": "choice", "kp": "G3", "level": 1, "stem": "It is ____ today. Let's go to the park.", "opts": ["sun", "sunny", "sunning", "suny"], "ans": 1, "exp": "系动词 is 后接形容词；sun 变 sunny（双写 n 加 y）。"}, {"id": "S4", "g": "S", "type": "choice", "kp": "G3", "level": 2, "stem": "She looks ____ today because she got a new bike.", "opts": ["happily", "happy", "happiness", "happier"], "ans": 1, "exp": "look 作系动词“看起来”，后接形容词 happy。happily 是副词，修饰动作。"}, {"id": "S5", "g": "S", "type": "choice", "kp": "G3", "level": 2, "stem": "There is a ____ table in the room.", "opts": ["round big wooden", "big round wooden", "wooden big round", "big wooden round"], "ans": 1, "exp": "多个形容词排序：大小 → 形状 → 材料。所以 big round wooden。"}, {"id": "S6", "g": "S", "type": "choice", "kp": "G3", "level": 1, "stem": "The soup smells ____. I want some more.", "opts": ["well", "delicious", "deliciously", "taste"], "ans": 1, "exp": "smell 是系动词，后接形容词 delicious。well 是副词，指“做得好”。"}, {"id": "S7", "g": "S", "type": "choice", "kp": "G3", "level": 2, "stem": "It is ____ to play football on the road.", "opts": ["danger", "dangerous", "dangerously", "safe"], "ans": 1, "exp": "句型 It is + 形容词 + to do sth.，用 dangerous。danger 是名词。"}, {"id": "S8", "g": "S", "type": "choice", "kp": "G3", "level": 2, "stem": "The shoes are too ____. I can't buy them.", "opts": ["expensive", "expensively", "expense", "more expensive"], "ans": 0, "exp": "too 后接形容词原级 expensive。more expensive 是比较级，不能直接跟 too。"}, {"id": "S9", "g": "S", "type": "fill", "kp": "G3", "level": 1, "stem": "The weather is ____ (wind) today.", "answers": ["windy"], "exp": "名词 wind 变形容词 windy（加 y）。"}, {"id": "S10", "g": "S", "type": "fill", "kp": "G3", "level": 1, "stem": "I am very ____ (tire) after the long trip.", "answers": ["tired"], "exp": "人感到累用 -ed：tired。tiring 说事情“令人累”。"}, {"id": "S11", "g": "S", "type": "fill", "kp": "G3", "level": 2, "stem": "Our school is big and ____ (beauty).", "answers": ["beautiful"], "exp": "beauty 变形容词 beautiful，跟 big 并列。"}, {"id": "S12", "g": "S", "type": "fill", "kp": "G3", "level": 1, "stem": "This maths problem is too ____ (difficulty) for me.", "answers": ["difficult"], "exp": "difficulty 是名词，形容词是 difficult。"}, {"id": "T1", "g": "T", "type": "choice", "kp": "G4", "level": 1, "stem": "There ____ a book and two pens on the desk.", "opts": ["is", "are", "have", "has"], "ans": 0, "exp": "There be 就近原则：离 be 最近的是 a book（单数），用 is。"}, {"id": "T2", "g": "T", "type": "choice", "kp": "G4", "level": 1, "stem": "There ____ some milk in the fridge.", "opts": ["are", "is", "have", "has"], "ans": 1, "exp": "milk 不可数，用 is。some 不改变单复数判断。"}, {"id": "T3", "g": "T", "type": "choice", "kp": "G4", "level": 1, "stem": "____ there any students in the classroom now?", "opts": ["Is", "Are", "Have", "Has"], "ans": 1, "exp": "students 复数，用 Are there。"}, {"id": "T4", "g": "T", "type": "choice", "kp": "G4", "level": 1, "stem": "There ____ a lot of trees in the park.", "opts": ["is", "are", "has", "have"], "ans": 1, "exp": "a lot of + 复数名词，be 用 are。"}, {"id": "T5", "g": "T", "type": "choice", "kp": "G4", "level": 2, "stem": "There ____ some water in the bottle.", "opts": ["are", "is", "have", "has"], "ans": 1, "exp": "water 不可数，用 is。"}, {"id": "T6", "g": "T", "type": "choice", "kp": "G4", "level": 2, "stem": "— How many classrooms ____ there in your school?\n— Thirty.", "opts": ["is", "are", "have", "has"], "ans": 1, "exp": "How many + 复数，问 There be 用 are there。"}, {"id": "T7", "g": "T", "type": "choice", "kp": "G4", "level": 1, "stem": "There ____ a map of China on the wall.", "opts": ["is", "are", "have", "has"], "ans": 0, "exp": "a map 单数，用 is。"}, {"id": "T8", "g": "T", "type": "choice", "kp": "G4", "level": 2, "stem": "There aren't ____ apples in the basket.", "opts": ["some", "any", "a", "an"], "ans": 1, "exp": "否定句用 any。some 多用于肯定句和表示请求的疑问句。"}, {"id": "T9", "g": "T", "type": "fill", "kp": "G4", "level": 1, "stem": "There ____ (be) two computers in the office.", "answers": ["are"], "exp": "two computers 复数，用 are。"}, {"id": "T10", "g": "T", "type": "fill", "kp": "G4", "level": 1, "stem": "There ____ (be) some bread on the table.", "answers": ["is"], "exp": "bread 不可数，用 is。"}, {"id": "T11", "g": "T", "type": "fill", "kp": "G4", "level": 2, "stem": "____ there ____ (be) a library in your school?", "answers": ["is"], "exp": "单数 a library，疑问句 Is there ...? 只填 is 即可。"}, {"id": "T12", "g": "T", "type": "fill", "kp": "G4", "level": 2, "stem": "There ____ (not be) any juice in the glass.", "answers": ["isn't", "is not"], "exp": "juice 不可数，否定用 isn't。"}, {"id": "U1", "g": "U", "type": "choice", "kp": "G5", "level": 1, "stem": "I ____ visit my grandma next Sunday.", "opts": ["will", "am", "do", "did"], "ans": 0, "exp": "next Sunday 表将来，用 will + 原形。"}, {"id": "U2", "g": "U", "type": "choice", "kp": "G5", "level": 1, "stem": "She ____ going to buy a new bike tomorrow.", "opts": ["is", "are", "will", "does"], "ans": 0, "exp": "be going to 结构中，She 用 is。"}, {"id": "U3", "g": "U", "type": "choice", "kp": "G5", "level": 1, "stem": "They ____ have a party next Friday.", "opts": ["will", "are", "do", "did"], "ans": 0, "exp": "will + 原形 have；next Friday 是将来标志。"}, {"id": "U4", "g": "U", "type": "choice", "kp": "G5", "level": 2, "stem": "Look at the dark clouds! It ____ rain soon.", "opts": ["will", "is going to", "is", "was"], "ans": 1, "exp": "有明显迹象（乌云）的预测用 be going to。will 更多是临时决定或单纯预测。"}, {"id": "U5", "g": "U", "type": "choice", "kp": "G5", "level": 1, "stem": "We ____ go to the zoo this weekend. We have too much homework.", "opts": ["will not", "don't", "didn't", "aren't"], "ans": 0, "exp": "将来否定：will not（won't）+ 原形。"}, {"id": "U6", "g": "U", "type": "choice", "kp": "G5", "level": 2, "stem": "— ____ you going to join the chess club?\n— Yes, I am.", "opts": ["Do", "Are", "Will", "Did"], "ans": 1, "exp": "答语 Yes, I am 提示问句是 Are you going to ...。"}, {"id": "U7", "g": "U", "type": "choice", "kp": "G5", "level": 2, "stem": "There ____ a football match next week.", "opts": ["will have", "will be", "is having", "are"], "ans": 1, "exp": "“将有”用 There will be，不能用 There will have。"}, {"id": "U8", "g": "U", "type": "choice", "kp": "G5", "level": 1, "stem": "He ____ be twelve years old next year.", "opts": ["will", "is", "does", "did"], "ans": 0, "exp": "next year 将来，will + 原形 be。"}, {"id": "U9", "g": "U", "type": "fill", "kp": "G5", "level": 1, "stem": "My parents ____ (visit) Beijing next month.", "answers": ["will visit"], "exp": "next month 将来，will + 原形 visit。"}, {"id": "U10", "g": "U", "type": "fill", "kp": "G5", "level": 2, "stem": "She ____ (be) a teacher in the future.", "answers": ["will be"], "exp": "in the future 表将来，will be。"}, {"id": "U11", "g": "U", "type": "fill", "kp": "G5", "level": 2, "stem": "We ____ (not have) a test tomorrow.", "answers": ["won't have", "will not have"], "exp": "将来否定 won't + 原形 have。"}, {"id": "U12", "g": "U", "type": "fill", "kp": "G5", "level": 2, "stem": "____ you ____ (come) to my party tomorrow?", "answers": ["will come"], "exp": "将来疑问：Will + 主语 + 原形，填 will come。"}, {"id": "V1", "g": "V", "type": "choice", "kp": "G6", "level": 2, "stem": "If it ____ tomorrow, we will stay at home.", "opts": ["rains", "will rain", "rained", "is raining"], "ans": 0, "exp": "主将从现：if 从句用一般现在时，主句才用 will。"}, {"id": "V2", "g": "V", "type": "choice", "kp": "G6", "level": 2, "stem": "I will call you if I ____ free tonight.", "opts": ["am", "will be", "was", "be"], "ans": 0, "exp": "if 从句用现在时表将来，主语 I 用 am。"}, {"id": "V3", "g": "V", "type": "choice", "kp": "G6", "level": 1, "stem": "If you don't hurry, you ____ miss the bus.", "opts": ["will", "are", "do", "did"], "ans": 0, "exp": "主句表将来结果，用 will + 原形。"}, {"id": "V4", "g": "V", "type": "choice", "kp": "G6", "level": 1, "stem": "We ____ go out if the weather is fine.", "opts": ["will", "are", "do", "did"], "ans": 0, "exp": "if 从句已用 is，主句用 will。"}, {"id": "V5", "g": "V", "type": "choice", "kp": "G6", "level": 2, "stem": "If he ____ hard, he will pass the exam.", "opts": ["work", "works", "will work", "worked"], "ans": 1, "exp": "if 从句主语 he 三单，用 works。"}, {"id": "V6", "g": "V", "type": "choice", "kp": "G6", "level": 1, "stem": "She will be happy if you ____ her.", "opts": ["help", "helps", "will help", "helped"], "ans": 0, "exp": "主句已经用 will be，if 从句用一般现在时 help。"}, {"id": "V7", "g": "V", "type": "choice", "kp": "G6", "level": 3, "stem": "If you ____ water to 0℃, it becomes ice.", "opts": ["cool", "cools", "will cool", "cooled"], "ans": 0, "exp": "客观事实的条件句，主句也用现在时 becomes，从句用 cool。"}, {"id": "V8", "g": "V", "type": "choice", "kp": "G6", "level": 2, "stem": "Don't wait for me if I ____ late.", "opts": ["am", "will be", "was", "be"], "ans": 0, "exp": "if 从句用现在时 am，不能写 will be。"}, {"id": "V9", "g": "V", "type": "fill", "kp": "G6", "level": 2, "stem": "If it ____ (be) sunny tomorrow, we ____ (go) to the park.", "answers": ["is will go", "is; will go"], "exp": "if 从句用 is，主句用 will go（主将从现）。"}, {"id": "V10", "g": "V", "type": "fill", "kp": "G6", "level": 3, "stem": "He ____ (not come) if he ____ (be) busy.", "answers": ["won't come is", "won't come; is"], "exp": "主句否定将来 won't come，从句用 is。"}, {"id": "V11", "g": "V", "type": "fill", "kp": "G6", "level": 2, "stem": "If you ____ (study) hard, you ____ (get) good grades.", "answers": ["study will get", "study; will get"], "exp": "从句 study，主句 will get。"}, {"id": "V12", "g": "V", "type": "fill", "kp": "G6", "level": 2, "stem": "I ____ (tell) him if I ____ (see) him.", "answers": ["will tell see", "will tell; see"], "exp": "主句 will tell，从句 see。"}, {"id": "W1", "g": "W", "type": "choice", "kp": "G7", "level": 1, "stem": "I ____ to the museum last Sunday.", "opts": ["go", "went", "goes", "going"], "ans": 1, "exp": "last Sunday 过去，go 的过去式 went。"}, {"id": "W2", "g": "W", "type": "choice", "kp": "G7", "level": 1, "stem": "She ____ her homework yesterday evening.", "opts": ["do", "does", "did", "doing"], "ans": 2, "exp": "yesterday evening 过去，do 变 did。"}, {"id": "W3", "g": "W", "type": "choice", "kp": "G7", "level": 1, "stem": "They ____ very happy at the party last night.", "opts": ["is", "are", "was", "were"], "ans": 3, "exp": "主语 They 复数，过去 be 用 were。"}, {"id": "W4", "g": "W", "type": "choice", "kp": "G7", "level": 2, "stem": "He ____ to school yesterday because he was ill.", "opts": ["doesn't go", "didn't go", "wasn't go", "not go"], "ans": 1, "exp": "过去否定：didn't + 原形 go。"}, {"id": "W5", "g": "W", "type": "choice", "kp": "G7", "level": 1, "stem": "____ you see the film last night?", "opts": ["Do", "Does", "Did", "Are"], "ans": 2, "exp": "last night 过去，疑问用 Did + 原形。"}, {"id": "W6", "g": "W", "type": "choice", "kp": "G7", "level": 1, "stem": "We ____ football after school yesterday.", "opts": ["play", "plays", "played", "playing"], "ans": 2, "exp": "yesterday 过去，play 加 ed 变 played。"}, {"id": "W7", "g": "W", "type": "choice", "kp": "G7", "level": 2, "stem": "My mother ____ a cake for me two days ago.", "opts": ["make", "makes", "made", "making"], "ans": 2, "exp": "two days ago 过去，make 的过去式 made。"}, {"id": "W8", "g": "W", "type": "choice", "kp": "G7", "level": 1, "stem": "It ____ rainy last week.", "opts": ["is", "was", "were", "are"], "ans": 1, "exp": "last week 过去，主语 It 用 was。"}, {"id": "W9", "g": "W", "type": "fill", "kp": "G7", "level": 1, "stem": "Tom ____ (visit) his uncle last weekend.", "answers": ["visited"], "exp": "last weekend 过去，visit 加 ed。"}, {"id": "W10", "g": "W", "type": "fill", "kp": "G7", "level": 2, "stem": "They ____ (not be) at home last night.", "answers": ["weren't", "were not"], "exp": "过去否定 be 动词：were not / weren't。"}, {"id": "W11", "g": "W", "type": "fill", "kp": "G7", "level": 2, "stem": "____ she ____ (buy) a new bag yesterday?", "answers": ["did buy"], "exp": "过去疑问：Did + 主语 + 原形，填 did buy。"}, {"id": "W12", "g": "W", "type": "fill", "kp": "G7", "level": 1, "stem": "We ____ (have) a good time at the party.", "answers": ["had"], "exp": "have 的过去式是 had。"}, {"id": "X1", "g": "X", "type": "choice", "kp": "G8", "level": 1, "stem": "This is ____ book. Please don't take it away.", "opts": ["I", "my", "me", "mine"], "ans": 1, "exp": "名词 book 前用形容词性物主代词 my。"}, {"id": "X2", "g": "X", "type": "choice", "kp": "G8", "level": 2, "stem": "The blue bag is ____. Mine is over there.", "opts": ["her", "hers", "she", "herself"], "ans": 1, "exp": "句末单独用，名词性物主代词 hers，相当于 her bag。"}, {"id": "X3", "g": "X", "type": "choice", "kp": "G8", "level": 1, "stem": "____ is my best friend. We often study together.", "opt Before they left, their teacher, Miss Chen, gave them some rules. "You must stay with your group," she said. "You mustn't touch the models. You can take photos, but you can't use a flash. If you need help, you can ask the workers in blue coats."
Li Wei's group first went to the space room. They saw a model of a rocket and learned how scientists work in space. Then they watched a short film about the Earth. The film told them that we must protect the environment because there is only one Earth.
At lunch time, Li Wei found that he had forgotten his wallet. He was worried. "You needn't worry," said his friend, Wang Fang. "I can lend you some money. You can pay me back tomorrow."

  if(!Array.isArray(d.coachQuiz)) d.coachQuiz = [];

  if(d.final && d.final.total !== 43) d.final = null;
  return d;
}
function registerExtras(){
  (state.extra || []).forEach(q => { if(q && q.id) qById[q.id] = q; });
}
function saveState(){
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  if(typeof queuePush === `function`) queuePush();
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 1900);
}
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function norm(s){
  return String(s||'')
    .replace(/[’‘]/g, `'`)
    .replace(/\s+/g, ` `)
    .replace(/\s*([,.!?;:])\s*/g, `$1`)
    .replace(/[.!?;:]+$/g, ``)
    .trim().toLowerCase();
}
function answerText(q){
  if(q.type === `choice`) return `${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}`;
  if(q.type === `fill` || q.type === `text`) return q.answers.slice(0,2).join(`  /  `);
  return q.model;
}
function gradeQ(q, val){
  if(q.type === `choice`) return {ok: Number(val) === q.ans, expect: answerText(q)};
  if(q.type === `fill` || q.type === `text`){
    const ok = q.answers.some(a => norm(a) === norm(val));
    return {ok, expect: answerText(q)};
  }
  return {ok:false, expect:q.model};
}
function answeredCount(){ return Object.keys(state.ans).length; }
function accuracy(){
  const keys = Object.keys(state.ans);
  if(!keys.length) return null;
  const ok = keys.filter(k => state.ans[k].ok).length;
  return Math.round(ok * 100 / keys.length);
}
function kpStats(){
  const map = {};
  Object.keys(state.ans).forEach(id=>{
    const q = qById[id]; if(!q) return;
    const m = map[q.kp] || (map[q.kp] = {done:0, ok:0});
    m.done++; if(state.ans[id].ok) m.ok++;
  });
  return map;
}
function weakKps(n){
  const st = kpStats();
  return Object.keys(st)
    .filter(k => st[k].done >= 2 && st[k].ok / st[k].done < 0.7)
    .sort((a,b) => (st[a].ok/st[a].done) - (st[b].ok/st[b].done))
    .slice(0, n || 3)
    .map(k => ({kp:k, ...st[k]}));
}
function wrongKps(n){
  const cnt = {};
  state.wrong.forEach(id=>{
    const q = qById[id]; if(!q) return;
    cnt[q.kp] = (cnt[q.kp] || 0) + 1;
  });
  return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]).slice(0, n || 3).map(kp=>({kp, n:cnt[kp]}));
}
function groupStats(g){
  const qs = QS.filter(q => q.g === g);
  const done = qs.filter(q => state.ans[q.id]).length;
  const ok = qs.filter(q => state.ans[q.id] && state.ans[q.id].ok).length;
  return {total:qs.length, done, ok};
}
function go(route){
  if(location.hash !== `#/` + route) location.hash = `#/` + route;

}
function parseHash(){
  const h = location.hash.replace(/^#\/?/, ``);
  if(!h) return [`home`];
  return h.split(`/`);
}

/* ===== 题卡 ===== */
function stemHtml(q){
  const text = esc(q.stem).replace(/\n/g, `<br>`).replace(/____/g, `<span class="blank"></span>`);
  return text;
}
function qCard(q, mode){
  const rec = state.ans[q.id];
  const locked = mode === `practice` && rec;
  const showFb = mode !== `exam` && mode !== `final` && rec;
  const selMode = mode === `exam` || mode === `final`;
  const selMap = mode === `final` ? finalSel : examSel;
  const audio = q.listen ? `<div class="audiobar">
      <button class="btn sm" data-play="${q.id}" data-rate="0.92">▶ 播放</button>
      <button class="btn sm ghost" data-play="${q.id}" data-rate="0.72">慢速 0.8×</button>
      <button class="btn sm ghost" data-script="${q.id}"${rec?``:` disabled`}>${rec?`看原文`:`答题后可看原文`}</button>
      <span class="hint">${q.audioUrl?`仿真人声，可重复听，先不看原文`:`可重复听，先不看原文`}</span>
    </div>
    <div class="scriptbox" id="sc-${q.id}"><b>听力原文：</b>${esc(q.audio||``)}</div>` : ``;
  let body = ``;
  if(q.type === `choice`){
    body = `<div class="opts">` + q.opts.map((o,i)=>{
      let cls = `opt`;
      if(selMode){
        if(selMap[q.id] === i) cls += ` sel`;
      } else if(rec){
        if(i === q.ans) cls += ` right`;
        if(rec.v === i && i !== q.ans) cls += ` wrong`;
      }
      const dis = locked ? ` disabled` : ``;
      return `<button class="${cls}" data-opt="${q.id}" data-i="${i}"${dis}><span class="k">${String.fromCharCode(65+i)}</span><span>${esc(o)}</span></button>`;
    }).join(``) + `</div>` + (mode === `practice` && rec ? `<div class="qtext"><button class="btn sm ghost" data-retry="${q.id}">重做这道</button></div>` : ``);
  } else if(q.type === `fill` || q.type === `text`){
    const val = selMode ? (selMap[q.id]||``) : (rec && rec.v !== undefined ? esc(rec.v) : ``);
    const cls = rec && !selMode ? (rec.ok ? ` right` : ` wrong`) : ``;
    const ph = q.type === `fill` ? `填一个词或短语` : `写完整句子`;
    body = `<div class="qtext">
      <input id="in-${q.id}" class="${cls}" data-in="${q.id}" placeholder="${ph}" value="${val}" autocomplete="off"${locked?` disabled`:``}>
      ${!selMode && !rec ? `<button class="btn sm" data-submit="${q.id}">提交</button>` : ``}
      ${!selMode && rec ? `<button class="btn sm ghost" data-retry="${q.id}">重做</button>` : ``}
    </div>`;
  } else if(q.type === `open`){
    const val = rec && rec.v !== undefined ? esc(rec.v) : ``;
    body = `<div class="qtext">
      <input data-in="${q.id}" placeholder="先自己写，写完再对照答案" value="${val}" autocomplete="off"${locked?` disabled`:``}>
      ${!rec ? `<button class="btn sm ghost" data-open="${q.id}">看参考答案</button>` : `<button class="btn sm ghost" data-retry="${q.id}">重写</button>`}
    </div>
    <div class="selfcheck" id="self-${q.id}" style="display:${rec?'block':'none'}">
      <div style="font-size:13px;color:#4a5470;margin:6px 0 8px">参考答案：<b style="color:#26327a">${esc(q.model)}</b></div>
      ${!rec ? `<button class="btn sm" data-self="${q.id}" data-ok="1">我写对了</button>
      <button class="btn sm ghost" data-self="${q.id}" data-ok="0">我写错了，进错题本</button>` : ``}
    </div>`;
  }
  let fb = ``;
  if(showFb){
    fb = feedbackHtml(q, rec);
  }
  return `<div class="q card" id="q-${q.id}">
    <div class="qhead"><span class="qno">${q.id}</span><span class="tag">${typeName(q.type)}</span>
      ${q.listen?`<span class="tag ext">听力</span>`:``}
      <span class="tag core">${KPS[q.kp] ? KPS[q.kp].short : q.kp}</span><span style="margin-left:auto;color:#9aa3ba">L${q.level}</span></div>
    <div class="stem">${stemHtml(q)}</div>
    ${audio}
    ${body}
    <div id="fb-${q.id}">${fb}</div>
  </div>`;
}
function typeName(t){
  return {choice:`单选`,fill:`填空`,text:`改写`,open:`翻译`}[t] || `题`;
}
function feedbackHtml(q, rec){
  const ok = rec.ok;
  let head, why;
  if(q.type === `choice`){
    const my = (typeof rec.v === `number`) ? `${String.fromCharCode(65+rec.v)}. ${q.opts[rec.v]}` : `未选`;
    head = ok ? `对，答案是 ${answerText(q)}` : `错。你选 ${my}；正确是 ${answerText(q)}`;
  } else if(q.type === `open`){
    head = ok ? `自评：写对了` : `自评：还没写对，已进错题本`;
  } else {
    head = ok ? `对：${answerText(q)}` : `错。你的答案：${esc(rec.v||`（空）`)}；参考：${answerText(q)}`;
  }
  why = `解析：${esc(q.exp)}`;
  if(q.type === `open` && rec.ok) why = `解析：${esc(q.exp)}　（参考答案：${q.model}）`;
  return `<div class="fb show ${ok?`ok`:`no`}">
    <div class="title">${head}</div>
    <div class="why">${why}</div>
    <div class="ans">${(!ok && q.hint)?`<b>${esc(q.hint)}</b>`:``}</div>
  </div>`;
}
function setAnswer(id, val, ok){
  state.ans[id] = {v:val, ok, ts:Date.now()};
  if(!ok && !state.wrong.includes(id)) state.wrong.push(id);
  if(ok && state.wrong.includes(id)) state.wrong = state.wrong.filter(x => x !== id);
  saveState(); render(true);
  toast(ok ? `对了，已记录` : `已记进错题本，看下面的解析`);
}

function finalLevel(score){
  if(score >= 39) return {k:`s`,t:`A · 期末稳了`};
  if(score >= 34) return {k:`a`,t:`B · 基本过关`};
  if(score >= 29) return {k:`b`,t:`C · 有明显漏洞`};
  return {k:`c`,t:`D · 先回炉基础`};
}
function submitFinal(){
  const qs = finalQs();
  const missing = qs.filter(q => finalSel[q.id] === undefined || finalSel[q.id] === ``);
  if(missing.length && !confirm(`还有 ${missing.length} 题没答，确定交卷？`)) return;
  let score = 0;
  const detail = [];
  qs.forEach(q=>{
    const val = finalSel[q.id];
    const res = gradeQ(q, val);
    if(res.ok) score++;
    state.ans[q.id] = {v:val === undefined ? `` : val, ok:res.ok, ts:Date.now()};
    if(!res.ok && !state.wrong.includes(q.id)) state.wrong.push(q.id);
    if(res.ok && state.wrong.includes(q.id)) state.wrong = state.wrong.filter(x => x !== q.id);
    let my = `未答`;
    if(q.type === `choice` && typeof val === `number`) my = `${String.fromCharCode(65+val)}. ${q.opts[val]}`;
    else if(val !== undefined && val !== ``) my = String(val);
    detail.push({id:q.id, ok:res.ok, my, expect:res.expect, sec:q.sec});
  });
  const secStats = FINAL_SECTIONS.map(sec=>{
    const rows = detail.filter(d=>d.sec===sec.key);
    return {title:sec.title, ok:rows.filter(d=>d.ok).length, total:rows.length};
  });
  state.final = {score, total:43, at:new Date().toLocaleString(`zh-CN`, {month:`2-digit`,day:`2-digit`,hour:`2-digit`,minute:`2-digit`}), detail, secStats};
  finalSubmitted = true;
  saveState(); render(); toast(`交卷完成：${score}/43`);
}

function submitExam(){
  const qs = examQs();
  const missing = qs.filter(q => examSel[q.id] === undefined || examSel[q.id] === ``);
  if(missing.length && !confirm(`还有 ${missing.length} 题没答，确定交卷？`)) return;
  let score = 0;
  const detail = [];
  qs.forEach(q=>{
    const val = examSel[q.id];
    const res = gradeQ(q, val);
    if(res.ok) score++;
    state.ans[q.id] = {v:val === undefined ? `` : val, ok:res.ok, ts:Date.now()};
    if(!res.ok && !state.wrong.includes(q.id)) state.wrong.push(q.id);
    if(res.ok && state.wrong.includes(q.id)) state.wrong = state.wrong.filter(x => x !== q.id);
    let my = `未答`;
    if(q.type === `choice` && typeof val === `number`) my = `${String.fromCharCode(65+val)}. ${q.opts[val]}`;
    else if(val !== undefined && val !== ``) my = String(val);
    detail.push({id:q.id, ok:res.ok, my, expect:res.expect});
  });
  state.exam = {score, total:25, at:new Date().toLocaleString(`zh-CN`, {month:`2-digit`,day:`2-digit`,hour:`2-digit`,minute:`2-digit`}), detail};
  examSubmitted = true;
  saveState(); render(); toast(`交卷完成：${score}/25`);
}

let speakToken = 0;
let curAudio = null;
function playQ(q, rate){
  if(q && q.audioUrl){
    try{
      if(curAudio){ try{ curAudio.pause(); }catch(e){} }
      curAudio = new Audio(q.audioUrl);
      curAudio.playbackRate = Number(rate) < 0.85 ? 0.8 : 1;
      curAudio.play().catch(()=>toast(`录音加载失败，再点一次或点“看原文”`));
      toast(`人声朗读播放中… 可重复听`);
      return true;
    }catch(e){}
  }
  if(q && q.audio) speak(q.audio, rate);
  return false;
}
function speak(text, rate){
  if(!(`speechSynthesis` in window)){
    toast(`这个浏览器不支持语音朗读，点“看原文”练阅读版`);
    return;
  }
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = `en-GB`;
    u.rate = rate || 0.92;
    u.pitch = 1;
    const vs = window.speechSynthesis.getVoices() || [];
    const v = vs.find(x => /en-GB|United Kingdom|British/i.test(x.lang + ` ` + x.name))
      || vs.find(x => /^en/i.test(x.lang));
    if(v) u.voice = v;
    window.speechSynthesis.speak(u);
    toast(`播放中… 可再点一次重听`);
  }catch(e){ toast(`播放失败，点“看原文”`); }
}

const KB = [

   b:`must 偏“说话人认为必须”，have to 偏“外部规定、客观所迫”。
例句：You must finish it today.（我要求你今天完成）
I have to wear a uniform.（学校规定）
否定完全不是一个意思：mustn't = 禁止；don't have to = 不必。
must 没有过去式，过去要用 had to；将来用 will have to。`},
  {k:[`mustn't`,`needn't`,`不必`,`禁止`],t:`mustn't 和 needn't 别混`,
   b:`mustn't = 不许、禁止；needn't = 不必、没必要。
Must I ...? 的否定回答固定是 No, you needn't.（不是 mustn't）
May I ...? 的否定回答才是 No, you mustn't.
一句话记：问“必须”答“不必”，问“可以”答“不许”。`},
  {k:[`can`,`could`,`能力`,`许可`],t:`can / could 三个身份`,
   b:`can：现在的能力、非正式许可、请求。
could：过去的能力；比 can 更委婉的请求；还可以表可能。
Could you help me? 不是问过去，是客气。
答语别说 Yes, I could.，说 Sure. / Of course.
can 的将来不能写 will can，要用 will be able to。`},
  {k:[`may`,`might`,`也许`,`可能`],t:`may / might 两条路`,
   b:`may：请求许可（May I ...?，最正式）；可能（It may rain.）。
might：可能性更小；也用于过去转述。May I ...? 否定答语 No, you mustn't.。
推测程度：must be（一定）> may be > might be > can't be（不可能）。`},
  {k:[`should`,`ought`,`应该`,`建议`],t:`should / ought to`,
   b:`两者几乎同义，ought to 更正式，to 不能丢。
否定：shouldn't do；oughtn't to do / ought not to do。
should 还可表“按理应该”：He should be here by now.
提建议别用 must，must 是命令。`},
  {k:[`had better`,`最好`,`d better`],t:`had better 的用法`,

后面永远原形，不加 to。`},
  {k:[`would rather`,`宁愿`,`rather than`],t:`would rather`,

两边都接原形：I would rather walk than take a bus.
否定：would rather not do。
别写 would rather to do，也别在 than 后写 doing。`},
  {k:[`used to`,`过去常常`,`be used to`],t:`used to 与 be used to`,
   b:`used to do：过去常做、现在不做了。否定 didn't use to；疑问 Did you use to ...?
be used to doing：习惯于做某事（to 是介词，后面 -ing）。
别混：I used to walk. ≠ I am used to walking.`},
  {k:[`need`,`dare`,`不敢`,`需要`],t:`need / dare 的两副面孔`,
   b:`作情态动词：Need I ...? / You needn't ...；Dare he ...? / He daren't ...
第三人称不加 s，后面接原形。
作实义动词：need to do / doesn't need to do；dare to do / doesn't dare to do。
Need I ...? 肯定答 Yes, you must.；否定 No, you needn't.`},
  {k:[`be able to`,`able`,`will can`],t:`be able to 各时态`,
   b:`can 只有现在和过去（could），其他时态用 be able to：
will be able to（将来）、have been able to（完成）、was able to（过去某次成功）。
不能说 will can / must can。`},
  {k:[`supposed`,`应该`,`按理`],t:`be supposed to`,
   b:`be supposed to do = 按理应该、按计划应该。
He is supposed to arrive at eight.（按计划八点到）
否定 be not supposed to do = 不应该、不允许。
后面接原形，不是 -ing。`},
  {k:[`推测`,`must be`,`can't be`,`might have`,`must have`],t:`推测怎么判断`,
   b:`对现在：must be（一定）/ may be / might be（可能）/ can't be（不可能）。
对过去：must have done（一定做过）/ can't have done（不可能做过）/ might have done（可能做过）。
有证据才用 must；和事实冲突用 can't。
注意 must be 的 be 不能丢：He must ill. 错。`},
  {k:[`答语`,`回答`,`must i`,`may i`],t:`情态动词答语总表`,
   b:`Must I ...? → Yes, you must. / No, you needn't.
May I ...? → Yes, you may. / No, you mustn't.
Need I ...? → Yes, you must. / No, you needn't.
Could I ...? → Sure. / Of course.
Could you ...? → Sure. / Sorry, I can't.
Would you like ...? → Yes, I'd love to.`},
  {k:[`if`,`wish`,`hope`,`虚拟`],t:`if + would，wish / hope`,

wish + could：明知很难实现（I wish I could fly.）
hope + can：有机会实现（I hope I can pass.）

  {k:[`被动`,`must be done`,`be finished`],t:`情态动词的被动`,

Library books must be returned on time.
别漏 be：must finish 是主动，must be finished 才是被动。`},
  {k:[`听力`,`听`,`弱读`,`连读`],t:`听力里的情态动词`,

can 弱读成 /kən/，几乎听不见；can't 反而重。
had better 听成 /ˈbetə/，前面有个很轻的 'd。
答语倒推问句：听到 No, you needn't 就是 Must I / Need I；听到 No, you mustn't 就是 May I。`},
  {k:[`覆盖`,`有哪些`,`清单`,`全量`],t:`这套资料覆盖了什么`,
   b:`核心：can/could、may/might、must/mustn't、have to、need/needn't、shall/should、ought to、will/would、would like、would rather、had better、be able to、be supposed to、used to、dare。
进阶：推测 must be / may be / can't be、对过去 must have done、情态被动 must be done、had to / will have to。
题型：单选、填空、多空、两句改错、转换、语篇、翻译、听力 22 题。`}
];
function coachMatch(text){
  const s = text.toLowerCase();
  let best = null, score = 0;
  KB.forEach(e=>{
    let n = 0;
    e.k.forEach(k=>{ if(s.includes(k.toLowerCase())) n += k.length; });
    if(n > score){ score = n; best = e; }
  });
  return score >= 2 ? best : null;
}
function detectError(text){
  const s = text.toLowerCase();
  const rules = [
    [/can\s+to\s+/, `can 后面不加 to，直接接原形：can swim，不是 can to swim。`, `C2`],
    [/must\s+to\s+/, `must 后面不加 to；要加 to 的是 have to / ought to / be able to。`, `C4`],
    [/should\s+to\s+/, `should 后面直接接原形，没有 should to。`, `C5`],
    [/will\s+can\b/, `将来不能说 will can，要用 will be able to。`, `C15`],
    [/must\s+(has|have)\s+to\b/, `must 和 have to 不能叠用，二选一。`, `C4`],
    [/can\s+\w+(s|es)\b/, `can 后面用原形，第三人称也不加 s：He can play，不是 plays。`, `C1`],
    [/had\s+better\s+to\b/, `had better 后面不加 to。`, `C12`],
    [/had\s+better\s+not\s+to\b/, `had better not 后面直接接原形。`, `C12`],
    [/would\s+rather\s+to\b/, `would rather 后面接原形，不加 to。`, `C12`],
    [/ought\s+(?!to\b)\w+/, `ought 后面必须带 to：ought to do。`, `C12`],
    [/must\s+(?!be\b|have\b|not\b)\w+\s+(ill|late|happy|angry|tired)\b/, `must 后面接形容词要加 be：must be ill。`, `C7`]
  ];
  for(const [re,msg,kp] of rules){ if(re.test(s)) return {msg, kp}; }
  return null;
}
function coachReply(text){
  const raw = String(text||``).trim();
  if(!raw) return {text:`写一句话，或者点上面的快捷问题。`};
  if(/^(你好|hi|hello|在吗)/i.test(raw)){
    return {text:`我在。可以直接问规则，比如“must 和 have to 区别”“Need I 怎么回答”；也可以说“根据错题出 5 题”。`};
  }
  if(/出.{0,4}题|做.{0,3}题|来.{0,3}道|再来|推题|多练|练习|做题|根据.*错|薄弱/.test(raw)){
    let kps = [], from = ``;
    if(/错题|错的|错/.test(raw)){
      const w = wrongKps(3).map(x=>x.kp);
      if(w.length){ kps = w; from = `错题本里错得最多的`; }
    }
    if(!kps.length){
      const kw = [[`must`,`C4`],[`need`,`C11`],[`dare`,`C11`],[`推测`,`C14`],[`should`,`C5`],[`ought`,`C12`],[`better`,`C12`],[`rather`,`C12`],[`used`,`C12`],[`able`,`C15`],[`supposed`,`C12`],[`被动`,`C15`],[`can`,`C2`],[`could`,`C2`],[`may`,`C3`],[`might`,`C3`],[`would`,`C13`],[`shall`,`C13`],[`听力`,`C16`],[`答语`,`C8`]];
      kw.forEach(([k,kp])=>{ if(raw.toLowerCase().includes(k) && !kps.includes(kp)) kps.push(kp); });
      if(kps.length) from = `你问到的`;
    }
    if(!kps.length){
      const w = weakKps(4).map(x=>x.kp);
      if(w.length){ kps = w; from = `练习正确率偏低的`; }
    }
    if(!kps.length){
      kps = [`C4`,`C12`,`C14`];
      from = `还没有足够错题，先按高频考点出的`;
    }
    kps = kps.filter(k=>GEN_BANK[k]).slice(0,3);
    if(!kps.length) kps = [`C4`,`C12`,`C14`];
    makeCoachQuiz(kps, 5);
    return {text:`按${from}出了 5 道新题：${kps.map(k=>KPS[k].short).join(`、`)}。做完自动判分，错的会进错题本。`};
  }
  const err = detectError(raw);
  if(err){
    if(GEN_BANK[err.kp]) makeCoachQuiz([err.kp], 3);
    return {text:`这句话有个典型错误。${err.msg}\n改完再读一遍：情态动词后面是不是原形、有没有多写 to、该不该加 be。\n下面顺手出了 3 道同规则的题，做完再回去改原句。`};
  }
  const hit = coachMatch(raw);
  if(hit) return {text:`${hit.t}\n${hit.b}`};
  return {text:`这个问法我还没收录。你可以换个说法，或者直接问这些：\n· must 和 have to 有什么区别\n· mustn't 和 needn't 怎么分\n· 推测句怎么判断\n· Need I 怎么回答\n· 根据我的错题出 5 题\n也可以把写错的整句发我，我帮你找错在哪。`};
}
async function sendCoach(preset){
  const input = $('coachInput');
  const text = (preset || (input && input.value) || ``).trim();
  if(!text) return;
  if(!state.chat) state.chat = [];
  state.chat.push({r:`user`, t:text});
  if(input) input.value = ``;
  if(state.chat.length > 40) state.chat = state.chat.slice(-40);
  saveStateLocalOnly();
  const useAI = APP.online && APP.ai;
  APP.aiThinking = useAI;
  renderCoach();
  let reply = null;
  if(useAI){
    try{
      const d = await aiCoachRequest();
      if(d.questions && d.questions.length) addServerQuestions(d.questions);
      reply = String(d.reply || ``).trim() || `这次没生成内容，换个问法再试`;
      if(d.limit) { APP.used = d.used || APP.used; APP.limit = d.limit; }
    }catch(e){
      let why = `AI 这次没回应`;
      if(e.status === 429) why = `今天的 AI 次数用完了`;
      else if(e.status === 503) why = `AI 还没配置`;
      reply = `${why}，先用本地助教回答：\n` + coachReply(text).text;
      APP.ai = e.status === 503 ? false : APP.ai;
    }
  }else{
    reply = coachReply(text).text;
  }
  APP.aiThinking = false;
  state.chat.push({r:`bot`, t:reply});
  if(state.chat.length > 40) state.chat = state.chat.slice(-40);
  saveState();
  renderCoach();
}

function nextGenId(){
  let n = 0;
  (state.extra||[]).forEach(q=>{ const m = /^X(\d+)$/.exec(q.id||``); if(m) n = Math.max(n, +m[1]); });
  Object.keys(state.ans).forEach(id=>{ const m = /^X(\d+)$/.exec(id); if(m) n = Math.max(n, +m[1]); });
  return `X${n+1}`;
}
function makeCoachQuiz(kps, count){
  const qs = [];
  const preferred = [], fallback = [];
  const pushTo = (arr, kp) => {
    if(GEN_BANK[kp]) GEN_BANK[kp].forEach(tpl => arr.push({kp, tpl}));
  };
  kps.filter(k=>GEN_BANK[k]).forEach(kp => pushTo(preferred, kp));
  Object.keys(GEN_BANK).filter(k=>!kps.includes(k)).forEach(kp => pushTo(fallback, kp));
  preferred.sort(()=>Math.random()-0.5);
  fallback.sort(()=>Math.random()-0.5);
  const pool = preferred.concat(fallback);
  const seen = new Set();
  for(let i=0;i<count;i++){
    let pick = pool.find(x=>{ const txt = String(x.tpl().stem||``); return !seen.has(txt); });
    if(!pick) break;
    const base = pick.tpl();
    seen.add(String(base.stem||``));
    const q = Object.assign(base, {id:nextGenId(), g:`X`, kp:pick.kp, level:3});
    qById[q.id] = q;
    state.extra.push(q);
    qs.push(q.id);
  }
  while(state.extra.length > 80){
    const old = state.extra.shift();
    if(old && qById[old.id]){
      delete qById[old.id];
      delete state.ans[old.id];
      state.wrong = state.wrong.filter(x=>x!==old.id);
    }
  }
  state.coachQuiz = qs;
  saveState();
}
function addServerQuestions(list){
  const qs = [];
  (list || []).forEach(raw=>{
    if(!raw || !raw.stem) return;
    const type = raw.type === `choice` ? `choice` : `fill`;
    const kp = KPS[raw.kp] ? raw.kp : `C4`;
    const q = {id:nextGenId(), g:`X`, kp, level:4, type,
      stem:String(raw.stem).slice(0,300), exp:String(raw.exp || ``).slice(0,500)};
    if(type === `choice`){
      if(!Array.isArray(raw.opts) || raw.opts.length !== 4) return;
      q.opts = raw.opts.map(x=>String(x).slice(0,120));
      q.ans = Number(raw.ans);
      if(!Number.isInteger(q.ans) || q.ans < 0 || q.ans > 3) return;
    }else{
      if(!Array.isArray(raw.answers) || !raw.answers.length) return;
      q.answers = raw.answers.map(x=>String(x).slice(0,120)).filter(Boolean);
      if(!q.answers.length) return;
    }
    qById[q.id] = q;
    state.extra.push(q);
    qs.push(q.id);
  });
  while(state.extra.length > 80){
    const old = state.extra.shift();
    if(old && qById[old.id]){
      delete qById[old.id];
      delete state.ans[old.id];
      state.wrong = state.wrong.filter(x=>x!==old.id);
    }
  }
  state.coachQuiz = qs;
  return qs;
}
function aiQuizIntent(text){
  return /出题|做.{0,3}题|来.{0,3}道|再来|根据.*错|薄弱|练习|推题/.test(String(text||``));
}
async function aiCoachRequest(){
  const last = state.chat[state.chat.length - 1];

  const wantsError = detectError(text) || /错在哪|错句|改错|对不对|这句|病句|为什么错/.test(text);
  const mode = wantsError ? `diagnose` : (aiQuizIntent(text) ? `quiz` : `chat`);

  };
  const messages = state.chat.slice(-8).map(m=>({role:m.r === `user` ? `user` : `assistant`, content:m.t}));
  return api(`/api/ai/chat`, {method:`POST`, headers:{'Content-Type':`application/json`},
    body: JSON.stringify({messages, mode, context:ctx})});
}

const APP = {online:false, user:null, ai:false, limit:0, used:0,
  authMode:`login`, busy:false, localBackup:null, lastSync:null,

function api(path, opt){
  const o = Object.assign({credentials:`same-origin`}, opt || {});
  return fetch(path, o).then(async res=>{
    let data = null;
    try{ data = await res.json(); }catch(e){}
    if(!res.ok){
      const err = new Error((data && (data.error || data.detail)) || (`HTTP ` + res.status));
      err.status = res.status;
      err.data = data;
      throw err;
    }
    return data;
  });
}

function authErrorText(e){
  if(!e) return `操作失败，再试一次`;
  if(e.status === 401) return `账号或密码不对`;
  if(e.status === 403) return e.message === `bad_origin` ? `页面来源不对，请从正式地址打开` : (e.message || `没有权限`);
  if(e.status === 409) return `这个账号已经注册过，直接登录`;
  if(e.status === 429) return `尝试太频繁，等几分钟再试`;
  if(e.status === 400) return e.message || `填写内容不合要求`;
  if(e.status === 503) return `AI 还没配置，先用本地助教`;
  return e.message || `网络不通，检查服务是否启动`;
}

async function submitAuth(){
  if(APP.busy) return;
  const account = ($('auAccount').value || ``).trim();
  const password = ($('auPass').value || ``).trim();
  const reg = APP.authMode === `reg`;
  const child = reg ? ($('auChild').value || ``).trim() : ``;

  const msg = $('authMsg');

  $('authBtn').textContent = reg ? `注册中…` : `登录中…`;

      body: JSON.stringify({account, password, child, invite})
    });

    hideAuth();
    await pullState(true);
    await refreshAiStatus();
    updateAcctPill();
    toast(reg ? `注册成功，记录会自动同步` : `登录成功`);
  }catch(e){
    msg.textContent = authErrorText(e);
  }finally{
    APP.busy = false;
    $('authBtn').disabled = false;
    $('authBtn').textContent = reg ? `注册并登录` : `登录`;
  }
}

function normalizeState(raw){
  const d = {ans:{}, wrong:[], exam:null, extra:[], chat:null, coachQuiz:[]};
  if(raw && typeof raw === `object`){
    Object.assign(d, raw);
    if(!d.ans || typeof d.ans !== `object`) d.ans = {};
    if(!Array.isArray(d.wrong)) d.wrong = [];
    if(!Array.isArray(d.extra)) d.extra = [];
    if(!Array.isArray(d.coachQuiz)) d.coachQuiz = [];
    if(d.exam && d.exam.total !== 25) d.exam = null;
  if(d.final && d.final.total !== 43) d.final = null;
  }
  return d;
}

async function pullState(notify){
  const d = await api(`/api/state?child=0`);
  if(d.state){
    state = normalizeState(d.state);
    registerExtras();
    saveStateLocalOnly();
    render();
    try{
      const localAns = Object.keys(normalizeState(JSON.parse(APP.localBackup || `{}`)).ans).length;
      if(!localAns) APP.localBackup = null;
    }catch(e){ APP.localBackup = null; }
    if(notify) toast(`已同步到这台设备`);
  }else{
    await pushStateNow();
    APP.localBackup = null;
    if(notify) toast(`本机进度已上传到账号`);
  }
}

function saveStateLocalOnly(){
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
}

function queuePush(){
  if(!APP.online) return;
  APP.dirty = true;
  updateAcctPill();
  clearTimeout(APP.pushTimer);
  APP.pushTimer = setTimeout(flushPush, 1200);
}

async function flushPush(){
  if(!APP.online || APP.pushing) return;
  APP.pushing = true;
  try{
    while(APP.dirty){
      APP.dirty = false;
      await api(`/api/state?child=0`, {method:`PUT`,
        headers:{'Content-Type':`application/json`}, body:JSON.stringify(state)});
      APP.lastSync = new Date().toLocaleTimeString(`zh-CN`, {hour:`2-digit`, minute:`2-digit`});
    }
  }catch(e){
    APP.dirty = true;
    if(e.status === 401){
      APP.online = false;
      showAuth();
    }
  }finally{
    APP.pushing = false;
    updateAcctPill();
  }
}

async function pushStateNow(){
  if(!APP.online) return;
  APP.dirty = true;
  await flushPush();
}

async function refreshAiStatus(){
  if(!APP.online) return;
  try{
    const d = await api(`/api/ai/status`);
    APP.ai = !!d.configured;

    APP.limit = d.limit || 0;
    APP.used = d.used || 0;
    if(parseHash()[0] === `coach`) renderCoach();

    contrast:[`对比辨析`,`同类、反向、变化，三路对比`],reading:[`文章阅读`,`200 词短文，找依据做题`],
    cloze:[`短文填空`,`50 词小短文，填情态动词`],exam:[`情态通关`,`25 题，交卷才出分`],
    wrong:[`错题本`,`重做对了才移出`],report:[`学习报告`,`按考点看，不看总分`]};
  const t = titles[key] || titles.home;

  else if(key === `use`) renderUse();
  else if(key === `listen`) route[1] ? renderListenSet(route[1]) : renderListenIndex();
  else if(key === `coach`) renderCoach();
  else if(key === `final`) renderFinal();
  else if(key === `contrast`) renderContrast();
  else if(key === `reading`) route[1] ? renderReadingSet(route[1]) : renderReadingIndex();

/* ===== 事件 ===== */
document.addEventListener(`click`, e=>{
  const play = e.target.closest(`[data-play]`);
  if(play){
    const q = qById[play.dataset.play];
    if(q && (q.audio || q.audioUrl)) playQ(q, Number(play.dataset.rate || 0.92));
    return;
  }
  const sc = e.target.closest(`[data-script]`);
  if(sc){
    const box = $('sc-' + sc.dataset.script);
    if(box) box.classList.toggle('show');
    return;
  }
  const opt = e.target.closest(`[data-opt]`);
  if(opt){
    const id = opt.dataset.opt, i = Number(opt.dataset.i);
    const q = qById[id];
    const route = parseHash()[0];
    if(route === `exam`){
      examSel[id] = i; render(true); return;
    }
    if(route === `final`){
      finalSel[id] = i; render(true); return;
    }
    const res = gradeQ(q, i);
    setAnswer(id, i, res.ok);
    return;
  }
  const sub = e.target.closest(`[data-submit]`);
  if(sub){
    const id = sub.dataset.submit, q = qById[id];
    const input = document.querySelector(`[data-in="${id}"]`);
    const val = (input && input.value || ``).trim();
    if(!val){ toast(`先写答案再提交`); return; }
    const res = gradeQ(q, val);
    setAnswer(id, val, res.ok);
    return;
  }
  const retry = e.target.closest(`[data-retry]`);
  if(retry){
    const id = retry.dataset.retry;
    delete state.ans[id]; saveState(); render(); return;
  }
  const open = e.target.closest(`[data-open]`);
  if(open){
    const id = open.dataset.open, q = qById[id];
    const input = document.querySelector(`[data-in="${id}"]`);
    if(input && !input.value.trim()){ toast(`先自己写一句，再对照答案`); input.focus(); return; }
    const box = $('self-'+id);
    if(box){
      box.style.display = `block`;
      if(!box.dataset.filled){
        box.dataset.filled = `1`;
        box.insertAdjacentHTML(`beforeend`, `<button class="btn sm" data-self="${id}" data-ok="1" style="margin-top:8px">我写对了</button>
        <button class="btn sm ghost" data-self="${id}" data-ok="0" style="margin-top:8px">我写错了，进错题本</button>`);
      }
    }
    return;
  }
  const self = e.target.closest(`[data-self]`);
  if(self){
    const id = self.dataset.self, ok = self.dataset.ok === `1`;
    const input = document.querySelector(`[data-in="${id}"]`);
    const val = (input && input.value || ``).trim();
    if(!val){ toast(`还没写句子，不能自评`); return; }
    setAnswer(id, val, ok);
    return;
  }
});
document.addEventListener(`input`, e=>{
  const id = e.target.dataset.in;
  if(!id) return;
  const route = parseHash()[0];
  if(route === `exam`) examSel[id] = e.target.value;
  else if(route === `final`) finalSel[id] = e.target.value;
});
document.addEventListener(`keydown`, e=>{
  if(e.key === `Enter` && e.target.matches(`[data-in]`)){
    const id = e.target.dataset.in;
    const q = qById[id];
    const route = parseHash()[0];
    if(!q || q.type === `open` || route === `exam` || route === `final`) return;
    const val = e.target.value.trim();
    if(!val) return;
    const res = gradeQ(q, val);
    setAnswer(id, val, res.ok);
  }
});
window.addEventListener(`hashchange`, render);

render();
bootAuth();

</script>
</body>
</html>
