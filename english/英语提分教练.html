<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英语提分教练</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231d1a16'/%3E%3Cpath d='M8 9h7v15H8zM17 9h7v15h-7z' fill='%23f6f2ea'/%3E%3Cpath d='M15.4 9h1.2v15h-1.2z' fill='%238f4b2d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#f6f2ea; --panel:#fffdf8; --ink:#1d1a16; --sub:#6f665c; --faint:#9a9084;
  --line:#ddd3c4; --line-soft:#eae2d6;
  --accent:#8f4b2d; --accent-ink:#6d3519;
  --ok:#2f5d50; --no:#a63a2a; --warn:#8a6a1f;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"SFMono-Regular","Consolas","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:700;letter-spacing:.01em;margin:0}
p{margin:0}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--accent-ink)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:30px;height:30px;flex:0 0 30px;background:var(--ink);display:grid;place-items:center}
.mark svg{width:18px;height:18px;display:block}
h1{font-size:20px;line-height:1.3}
.tag{font-size:12px;color:var(--faint);letter-spacing:.02em}
.hdr-stat{font-size:12.5px;color:var(--sub);text-align:right;line-height:1.5}
.hdr-stat b{font-family:var(--serif);color:var(--ink);font-size:14px}
.shell{display:grid;grid-template-columns:196px minmax(0,1fr);gap:0;max-width:1120px;margin:0 auto;align-items:start}
.rail{position:sticky;top:0;padding:20px 14px 40px 20px;border-right:1px solid var(--line-soft);align-self:start}
.rail nav{display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:10px;background:none;border:0;border-left:2px solid transparent;padding:9px 10px;text-align:left;color:var(--sub);font-size:14px;border-radius:0}
.navbtn:hover{color:var(--ink);background:#efe8dd}
.navbtn.on{color:var(--ink);font-weight:700;border-left-color:var(--accent);background:#f1eadd}
.navbtn i{font-family:var(--mono);font-style:normal;font-size:11px;color:var(--faint);width:14px}
.rail-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--faint);line-height:1.7}
main{padding:24px 28px 60px;min-width:0}
.viewhead{margin-bottom:18px}
.viewhead h2{font-size:17px;display:flex;align-items:baseline;gap:10px}
.viewhead h2 span{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em}
.lede{color:var(--sub);font-size:13.5px;margin-top:6px;max-width:66ch}
.panel{background:var(--panel);border:1px solid var(--line);padding:20px 22px;margin-bottom:16px}
.panel h3{font-size:14.5px;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--sub)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{background:var(--ink);color:#fbf7f0;border:1px solid var(--ink);padding:9px 16px;font-size:14px}
.btn:hover{background:#332d26}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:#efe8dd;border-color:var(--faint)}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fffaf3}
.btn.acc:hover{background:var(--accent-ink)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.entrycard{background:var(--panel);border:1px solid var(--line);padding:16px 18px;text-align:left;display:block;width:100%}
.entrycard:hover{border-color:var(--faint);background:#fffef9}
.entrycard b{display:block;font-family:var(--serif);font-size:15px;margin-bottom:4px}
.entrycard em{font-style:normal;font-size:12.5px;color:var(--sub);line-height:1.6;display:block}
.q{padding:16px 0;border-bottom:1px dashed var(--line-soft)}
.q:last-child{border-bottom:0}
.qno{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-bottom:2px}
.stem{font-size:15px;line-height:1.9}
.stem u{text-underline-offset:3px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.opt{display:flex;gap:9px;align-items:flex-start;background:#fbf7ef;border:1px solid var(--line-soft);padding:9px 12px;text-align:left;font-size:14px;line-height:1.6;width:100%}
.opt:hover{border-color:var(--faint)}
.opt.sel{border-color:var(--accent);background:#fbeee6}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--faint);flex:0 0 14px}
.opt.right{border-color:var(--ok);background:#eaf1ee}
.opt.wrong{border-color:var(--no);background:#f8e9e6}
.opt .k.right{color:var(--ok)}
.fill{display:flex;gap:10px;align-items:center;margin-top:10px}
.fill input{flex:1;min-width:0;border:1px solid var(--line);background:#fbf7ef;padding:9px 12px;font-family:var(--mono);font-size:14px;color:var(--ink)}
.fill input:focus{outline:2px solid #e8d9c9;border-color:var(--accent)}
.passage{background:#f3ede1;border-left:3px solid var(--line);padding:14px 16px;font-size:14.5px;line-height:1.95;margin-bottom:6px;white-space:pre-wrap}
.passage b{font-family:var(--mono);font-size:12px;color:var(--accent-ink)}
.gradebox{margin-top:10px;font-size:13.5px;line-height:1.8}
.verdict{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;padding:2px 8px;border:1px solid}
.verdict.ok{color:var(--ok);border-color:#b9cdc5;background:#eef4f1}
.verdict.no{color:var(--no);border-color:#e0c3bd;background:#f8ece9}
.explain.lite{font-size:12.5px;border-left-color:var(--line);margin-top:8px;color:#7d7468}
.explain{color:var(--sub);font-size:13px;margin-top:6px;padding-left:2px;border-left:2px solid var(--line-soft);padding-left:10px}
.reason{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--sub);flex-wrap:wrap}
.reason select{border:1px solid var(--line);background:#fbf7ef;padding:5px 8px;font-family:inherit;font-size:12.5px;color:var(--ink)}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
th,td{border:1px solid var(--line-soft);padding:7px 9px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{background:#efe8dc;font-weight:500;font-size:12.5px}
td.num{text-align:right;font-family:var(--mono)}
.st{font-family:var(--mono);font-size:11.5px;padding:1px 6px;border:1px solid var(--line);white-space:nowrap}
.st.s0{color:var(--faint)}
.st.s1{color:var(--sub)}
.st.s2{color:var(--warn);border-color:#ddd0a8;background:#faf5e4}
.st.s3{color:var(--accent-ink);border-color:#e2cbb9;background:#faeee4}
.st.s4{color:var(--ok);border-color:#b9cdc5;background:#eef4f1}
.txt{font-family:var(--mono);font-size:12.5px;line-height:1.85;background:#f3ede1;border:1px solid var(--line);padding:14px 16px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.empty{padding:34px 0;text-align:center;color:var(--faint);font-size:13.5px}
.tablewrap{overflow-x:auto;margin-bottom:16px}
.big{font-size:19px;letter-spacing:.2px;margin:6px 0 8px}
.big b{font-family:var(--mono);font-size:22px;color:var(--accent-ink)}
.foot{margin-top:12px;font-size:12px;color:var(--faint);line-height:1.8}
.gapcards{display:none;margin:0;padding:0}
.gapcards li{list-style:none;padding:10px 0;border-bottom:1px dashed var(--line-soft);font-size:13px;line-height:1.8}
.gapcards b{font-weight:500}
.gapcards .meta{display:block;color:var(--sub);margin:2px 0 0}
.gapcards .line{display:flex;align-items:center;gap:10px;margin:5px 0 0}
.gapcards i{font-style:normal;color:var(--accent);font-size:12.5px}
.pairs{display:grid;grid-template-columns:132px minmax(0,1fr);gap:0 18px;margin:12px 0 14px}
.pairs dt{font-family:var(--mono);font-size:13px;color:var(--accent);padding:9px 0;border-bottom:1px dashed var(--line-soft);align-self:start}
.pairs dd{margin:0;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px;line-height:1.75}
.pairs dd b{font-weight:500}
.pairs .eg{display:block;font-family:var(--mono);font-size:12.5px;color:var(--sub);margin-top:2px}
.teach{border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);padding:2px 0;margin-bottom:6px}
.tr{display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px;line-height:1.7}
.tr:last-child{border-bottom:0}
.tr span{color:var(--faint);font-family:var(--mono);font-size:11.5px;padding-top:3px}
.tr b{font-weight:500}
.tr code{font-family:var(--mono);font-size:12.5px;background:#f3ede1;padding:1px 5px;display:inline-block;justify-self:start;width:max-content;max-width:100%}
.tr code.bad{background:#f8ece9;color:var(--no)}
.range{-webkit-appearance:none;appearance:none;width:100%;height:2px;background:var(--line);margin:12px 0 6px}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);border:0;cursor:pointer}
.range::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);border:0;cursor:pointer}
.range::-moz-range-track{height:2px;background:var(--line)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:6px 0;line-height:1.6}
.chk input{margin-top:4px;accent-color:var(--accent);flex:0 0 auto}
.seg{display:flex;gap:0;border:1px solid var(--line);width:fit-content;margin-bottom:6px}
.seg button{background:transparent;border:0;border-right:1px solid var(--line-soft);padding:7px 14px;font-size:13px;color:var(--sub)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:#fbf7f0}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fbf7f0;padding:10px 18px;font-size:13px;z-index:20;opacity:0;pointer-events:none;transition:opacity .18s}
.toast.on{opacity:1}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;border-right:0;border-bottom:1px solid var(--line-soft);padding:12px 16px;min-width:0}
  .rail nav{flex-direction:row;overflow-x:auto;gap:4px;min-width:0;-webkit-overflow-scrolling:touch}
  .navbtn{border-left:0;border-bottom:2px solid transparent;white-space:nowrap;flex:0 0 auto}
  .navbtn.on{border-left:0;border-bottom-color:var(--accent)}
  .rail-foot{display:none}
  main{padding:20px 16px 48px;min-width:0}
  .top{padding:14px 16px}
  .opts,.grid2,.grid3{grid-template-columns:1fr}
  h1{font-size:17px}
  .viewhead h2{flex-wrap:wrap;gap:6px}
}
@media (max-width:560px){
  .swipe{display:inline}
  .pairs{grid-template-columns:1fr;gap:0}
  .pairs dt{border-bottom:0;padding-bottom:0}
  .pairs dd{padding-top:2px}

  table.gaptable{display:none}
  .gapcards{display:block}
  .top{flex-wrap:wrap;gap:8px}
  .hdr-stat{text-align:left;font-size:11.5px;line-height:1.6}
  .tag{display:none}
  .panel{padding:16px}
  .stem{font-size:14.5px;line-height:1.85}
  .tablewrap table{min-width:720px}
  .tablewrap{padding-bottom:2px}
}
@media print{.rail,.top,.actions{display:none}.panel{border:0}}

.swipe{display:none}

td.ph{font-family:"Charis SIL","Doulos SIL","DejaVu Sans","Lucida Sans Unicode",Georgia,serif;font-size:19px;line-height:1.5;letter-spacing:.6px;white-space:nowrap}
td.ph .ph{}
td.note{color:var(--ink-2);font-size:12.5px}
td.ph2{font-family:"Charis SIL","DejaVu Sans",Georgia,serif;font-size:16px;letter-spacing:.4px;white-space:nowrap}
table.tbl td.ph{white-space:nowrap}
.ipa{font-family:"Charis SIL","Doulos SIL","DejaVu Sans","Lucida Sans Unicode",Georgia,serif;font-size:15px;color:var(--ink-2)}

</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h7v14H4zM13 5h7v14h-7z" fill="#f6f2ea"/><path d="M11.4 5h1.2v14h-1.2z" fill="#8f4b2d"/></svg></div>
    <div>
      <h1>英语提分教练</h1>
      <p class="tag">广州初一 · 沪教版牛津 2024 · 120 分卷 95→110</p>
    </div>
  </div>
  <div class="hdr-stat" id="hdrStat"></div>
</header>

<div class="shell">
  <aside class="rail">
    <nav id="nav" aria-label="导航"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>
  <main id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===== 知识点：名称与一句话规则 ===== */
const KPS = [
  ['G1','Wh- 特殊疑问句'],['G2','冠词 a/an/the'],['G3','一般现在时（含三单）'],['G4','do / does 的否定与疑问'],
  ['G5','形容词作定语与表语'],['G6','there be 与 some/any'],['G7','一般将来时 will'],['G8','人称代词主格宾格'],
  ['G9','物主代词'],['G10','名词复数'],['G11','可数与不可数'],['G12','介词 in/on/at'],
  ['G13','频度副词位置'],['G14','情态动词'],['G15','疑问句与答语一致'],['G16','连词'],
  ['P1','长短元音'],['P2','/æ/ /e/ /eɪ/'],['P5','-s 尾音'],['P6','th 的两种读法'],['P8','不发音字母'],
  ['T3','完形填空'],['T5','单词拼写与词形'],['T6','句型转换'],
  ['V','词汇']
];
const KPNAME = Object.fromEntries(KPS);
const RULE = {
  G1:'问什么答什么：how 问方式，why 问原因，who 问人，how often 问频率',
  G2:'a/an 看第一个音素，不看字母；the 指特指或独一无二',
  G3:'主语是第三人称单数才加 -s/-es，其余用原形；Look! 之后用现在进行时',
  G4:'do/does 已经把三单信息吃掉，后面动词必须还原成原形',
  G5:'系动词（be、sound、taste、look、smell）后面接形容词，不接副词',
  G6:'there be 就近原则：be 跟最近的那个名词走；some 用于肯定，any 用于否定和疑问',
  G7:'will + 原形；有迹象的将来用 be going to',
  G8:'动词和介词后面用宾格（me/him/them）',
  G9:'后面有名词用形容词性（my），没有名词用名词性（mine）',
  G10:'-s/-es/-ies 与不规则（child→children、tooth→teeth、man→men）',
  G11:'不可数用 much / a little，可数用 many / a few',
  G12:'具体某天或某天的上下午用 on；月份年份季节用 in；钟点用 at',
  G13:'频度副词放在 be 动词之后、实义动词之前',
  G14:'情态动词后一律接原形；must 的否定回答用 needn\'t',
  G15:'答语助动词跟问句一致：Are you…? → Yes, I am. / Do you…? → Yes, I do.',
  G16:'前后相反用 but，因果关系用 because / so，二选一用 or',
  P1:'长音 /iː/ 与短音 /ɪ/ 是两个音，不是"读长一点"',
  P2:'a 在开音节读 /eɪ/，闭音节读 /æ/',
  P5:'清音后 /s/，浊音与元音后 /z/，咝音（s/x/ch/sh）后 /ɪz/',
  P6:'th 在虚词（the/this/that/they）里读 /ð/，在实词里多读 /θ/',
  P8:'kn-、wr-、mb、gh 里有不发音的字母',
  T3:'先通读抓主线，再按词义、搭配、逻辑、复现四类判',
  T5:'先按音标写，再单独查词尾（-s、-ed、-ing、双写）',
  T6:'转换完先问一句"意思变了没有"，再看语序与缩写'
};

/* ===== 题目：t=c 选择，t=f 填空 ===== */
const BANK = [
  /* --- 诊断 A 段：16 编号各 1 题 + 8 个高频编号各 2 题，共 24 --- */
  {id:'A1',kp:'G1',t:'c',q:'— ______ do you usually go to school?　— By bus.',o:['What','How','Where','Who'],a:1},
  {id:'A2',kp:'G2',t:'c',q:'There is ______ “u” in the word “sun”.',o:['a','an','the','不填'],a:0,x:'“u” 读 /juː/，/j/ 是辅音，所以用 a'},
  {id:'A3',kp:'G3',t:'c',q:'My father ______ TV every evening.',o:['watch','watches','watching','watched'],a:1},
  {id:'A4',kp:'G4',t:'c',q:'Emma ______ have any brothers or sisters.',o:["doesn't","don't","isn't",'not'],a:0},
  {id:'A5',kp:'G5',t:'c',q:'The music sounds ______.',o:['beautiful','beautifully','beauty','beauties'],a:0},
  {id:'A6',kp:'G6',t:'c',q:'There ______ a pen and two books on the desk.',o:['is','are','have','has'],a:0,x:'就近原则，跟 a pen 走'},
  {id:'A7',kp:'G7',t:'c',q:'I ______ visit the science museum with my classmates tomorrow.',o:['will','am','was','do'],a:0},
  {id:'A8',kp:'G8',t:'c',q:'Please give ______ the book. ______ is on the desk.',o:['me; It','I; It','me; They','my; It'],a:0},
  {id:'A9',kp:'G9',t:'c',q:'This is ______ pen. ______ is over there.',o:['my; Mine','mine; My','my; My','me; Mine'],a:0},
  {id:'A10',kp:'G10',t:'c',q:'There are three ______ in the box.',o:['knifes','knives','knifs','knive'],a:1},
  {id:'A11',kp:'G11',t:'c',q:"There isn't ______ milk in the fridge. Let's buy some.",o:['many','much','a few','a lot'],a:1},
  {id:'A12',kp:'G12',t:'c',q:'We have an English class ______ Monday morning.',o:['in','on','at','for'],a:1},
  {id:'A13',kp:'G13',t:'c',q:'My sister ______ late for school.',o:['is often','often is','often be','be often'],a:0},
  {id:'A14',kp:'G14',t:'c',q:'You ______ finish your homework before dinner.',o:['must','must to','can to','musts'],a:0},
  {id:'A15',kp:'G16',t:'c',q:"I like apples, ______ I don't like pears.",o:['and','but','because','so'],a:1},

  /* --- 诊断 B1：辨音 15 题（5 个编号各 3 题）--- */
  {id:'P1',kp:'P1',t:'c',q:'选出划线部分读音与其他三个不同的一项',o:['sh<u>i</u>p','sh<u>ee</u>p','s<u>i</u>t','b<u>i</u>g'],a:1,x:'sheep 是 /iː/，其余 /ɪ/'},

function pad(n){return n<10?'0'+n:''+n}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function monday(){const d=new Date();const off=(d.getDay()+6)%7;const m=new Date(d.getTime()-off*864e5);return m.getFullYear()+'-'+pad(m.getMonth()+1)+'-'+pad(m.getDate())}
function item(id){return BANK.find(x=>x.id===id)||W2.find(x=>x.id===id)||VB.find(x=>x.id===id)}
function norm(s){return String(s||'').toLowerCase().replace(/['‘]/g,"'").replace(/\s+/g,' ').trim().replace(/[.。!！?？]+$/,'').trim()}
function mineOf(it,p){
  const a=p.answers[it.id];
  if(it.t==='c')return a===undefined||a===null?'未答':'ABCD'[a];
  return a?String(a):'未答';
}
function isRight(it,ans){
  if(ans===undefined||ans===null||ans==='')return false;
  if(it.t==='c')return Number(ans)===it.a;
  return it.a.map(norm).indexOf(norm(ans))>=0;
}

/* ===== 掌握判定（与脚本同一套门槛） ===== */
function nodeOf(kp){return P.kps[kp]}
function addSession(kp,correct,questions){
  const n=P.kps[kp]||(P.kps[kp]={sessions:[]});
  n.sessions.push({date:today(),correct:correct,questions:questions});
}
function bigSessions(kp){
  const n=P.kps[kp];
  return n?n.sessions.filter(x=>x.questions>=8):[];
}
function status(kp){
  const n=P.kps[kp];
  if(!n||!n.sessions.length)return '未学习';
  const big=bigSessions(kp);
  if(!big.length)return '学习中';
  const pass=x=>x.correct/x.questions>=0.85;
  if(big.length===1)return pass(big[0])?'基本掌握':'待巩固';
  const prev=big[big.length-2],cur=big[big.length-1];
  const gap=(new Date(cur.date)-new Date(prev.date))/864e5;
  if(pass(cur)&&pass(prev)&&gap>=1)return '稳定掌握';
  const pooled=(cur.correct+prev.correct)/(cur.questions+prev.questions);
  if(pass(cur)||pooled>=0.85)return '基本掌握';
  return '待巩固';
}
const STCLS={'未学习':'s0','学习中':'s1','待巩固':'s2','基本掌握':'s3','稳定掌握':'s4'};
function kpNum(k){return /^G\d+$/.test(k)?Number(k.slice(1)):99}
function statBadge(kp){const st=status(kp);return '<span class="st '+STCLS[st]+'">'+st+'</span>'}
function totals(){
  const r={q:0,c:0,sess:0};const days={};
  Object.keys(P.kps).forEach(k=>{(P.kps[k].sessions||[]).forEach(s=>{r.q+=s.questions;r.c+=s.correct;days[s.date]=1})});
  r.sess=Object.keys(days).length;return r;
}

function gatePanel(){
  const ex=P.exam||{};
  const a=ex.A,v=ex.V;
  const aAcc=a?Math.round(a.correct/a.questions*100):null;
  const vAcc=v?Math.round(v.correct/v.questions*100):null;
  const badKps={};P.mistakes.filter(m=>/^G\d+$/.test(m.kp)).forEach(m=>{badKps[m.kp]=(badKps[m.kp]||0)+1});
  const badList=Object.keys(badKps).sort((x,y)=>kpNum(x)-kpNum(y));
  const passA=aAcc!==null&&aAcc>=90;
  const passV=vAcc!==null&&vAcc>=85;
  let verdict,next;
  if(aAcc===null){verdict='语法段还没测。';next='先做 A 段 24 题。'}
  else if(!passA){verdict='语法段 '+a.correct+'/'+a.questions+'（'+aAcc+'%），没过 90%。';next='先补 '+(badList.slice(0,2).join('、')||'错的那几个编号')+'（补给页各 8 题），别急着往下学。'}
  else if(vAcc===null){verdict='语法段过了（'+aAcc+'%），但词汇段还没测。';next='做 V 段 20 题。词汇不过，语法过了也上不去分。'}
  else if(!passV){verdict='语法 '+aAcc+'%、词汇 '+vAcc+'%，词汇没过 85%。';next='词汇错题在错题本，先把词形那几条重做；选词错的多是搭配没记牢。'}
  else {verdict='期中范围（Unit 1–5）按这套题过关：语法 '+aAcc+'%、词汇 '+vAcc+'%。';next='advance';}
  const adv='<div class="teach" style="margin-top:10px">'
    +'<div class="tr"><span>下一阶段</span><b>一般过去时（规则动词 -ed 与不规则表）、过去时间状语、比较级与最高级、情态动词表推测、宾语从句初步（I think that…）</b></div>'
    +'<div class="tr"><span>顺序</span><b>先一般过去时，它占七下语法的大头；不规则动词表单独背，别混进规则动词里练</b></div>'
    +'<div class="tr"><span>现状</span><b>这个页面的题库只写到初一上，七下的题还没写。这批得另开，我不假装现在能出</b></div>'
    +'</div>';
  return '<div class="panel"><h3>阶段闸门 · 能不能推进下学期</h3>'
   +'<p class="hint">判定：A 段（24 题）≥90%（最多错 2 题），V 段（20 题）≥85%（错 3 题以内），两个条件同时满足才叫过关。</p>'
   +'<p class="hint" style="margin-top:8px"><b style="color:var(--ink);font-weight:500">'+verdict+'</b></p>'
   +(next==='advance'?adv+'<p class="foot">推进不等于这一批不用管：错的编号还要隔天做一组 8 题验一次。</p>':'<p class="hint" style="margin-top:6px">'+next+'</p>')
   +'</div>';

/* ===== 诊断扩容：每个语法编号 2 题 ===== */
const DIAG_EXTRA=['G2','G3','G4','G5','G9','G10','G13','G16'];   // 冠词、三单时态、否定、-ing/-ed、代词、词形、比较、连词：各多 1 题
function expandDiag(base){
  const out=[];
  Object.keys(KPNAME).filter(k=>/^G\d+$/.test(k)).sort((a,b)=>kpNum(a)-kpNum(b)).forEach(k=>{
    const cur=base.filter(id=>item(id)&&item(id).kp===k);
    if(cur.length){out.push(cur[0]);return;}
    const pick=BANK.filter(x=>x.kp===k).map(x=>x.id);
    if(pick.length)out.push(pick[0]);
  });
  DIAG_EXTRA.forEach(k=>{
    const used=base.filter(id=>item(id)&&item(id).kp===k)[1]||BANK.filter(x=>x.kp===k&&!out.includes(x.id))[0];
    if(used)out.push(used.id||used);
  });
  return out;
}

/* ===== 补给：错题聚合 → 重讲 + 新题 ===== */
function weakList(){
  const cnt={};P.mistakes.forEach(m=>cnt[m.kp]=(cnt[m.kp]||0)+1);
  const rank={'待巩固':0,'基本掌握':1,'学习中':2,'未学习':3,'稳定掌握':4};
  return Object.keys(P.kps).filter(k=>/^G\d+$/.test(k))
    .map(k=>({k:k,n:cnt[k]||0,st:status(k)}))
    .sort((a,b)=>b.n-a.n||rank[a.st]-rank[b.st]||kpNum(a.k)-kpNum(b.k))
    .slice(0,2).map(x=>x.k);
}
function buildRepair(kp){
  if(/^P/.test(kp))return BANK.filter(x=>x.kp[0]==='P').map(x=>x.id);
  if(/^T/.test(kp))return BANK.filter(x=>x.kp===kp).map(x=>x.id);
  const nw=W2.filter(x=>x.kp===kp).slice(0,4);
  const old=BANK.filter(x=>x.kp===kp).slice(0,4);
  return nw.concat(old).map(x=>x.id);
}
function gapText(kp){
  const n=P.kps[kp];
  if(!n||!n.sessions.length)return '还没测过。先做一组 8 题，样本不够不下结论。';
  const big=bigSessions(kp);
  if(!big.length)return '只测过零散几题，样本不够（门槛 8 题）。做一组 8 题的补给，规律才看得出来。';
  const last=big[big.length-1];
  const acc=Math.round(last.correct/last.questions*100);
  if(big.length<2)return '最近一组 8 题，对 '+last.correct+'（'+acc+'%），一次不算数。还差一次隔天的 8 题、过 85%。';
  const prev=big[big.length-2];
  const gap=Math.round((new Date(last.date)-new Date(prev.date))/864e5);
  if(last.correct/last.questions<0.85||prev.correct/prev.questions<0.85)return '有一次低于 85%，规则没吃透。看下面的重讲卡，再做一组。';
  if(gap<1)return '两次都在同一天，不算间隔复习。明天或后天再测一次。';
  return '两次都过、间隔也够，已算稳定掌握，可以进下一个编号。';
}
function gapTable(){
  const all=Object.keys(P.kps).filter(k=>/^G\d+$/.test(k)).sort((a,b)=>kpNum(a)-kpNum(b));
  if(!all.length)return '<p class="empty">还没有记录。做一次诊断就有了。</p>';
  const cnt={};P.mistakes.forEach(m=>cnt[m.kp]=(cnt[m.kp]||0)+1);
  const ks=all.filter(k=>{
    return (cnt[k]||0)>0||bigSessions(k).length>0||status(k)!=='学习中';
  });
  const rest=all.length-ks.length;
  const rows=ks.map(k=>{
     const big=bigSessions(k),last=big[big.length-1];
     let seen='样本不足',next='先做一组 8 题';
     if(last){
       const acc=Math.round(last.correct/last.questions*100);
       seen=last.correct+'/'+last.questions+'　'+acc+'%';
       next='还差 1 次隔天复测';
     }
     if(status(k)==='稳定掌握')next='进下一个';
     return {k:k,seen:seen,next:next};
   });
  const mob='<ul class="gapcards">'+rows.map(r=>'<li><b>'+r.k+'　'+KPNAME[r.k]+'</b>'
     +'<p class="meta">'+r.seen+'</p>'
     +'<p class="line">'+statBadge(r.k)+'<i>'+r.next+'</i></p></li>').join('')+'</ul>';
  return '<table class="gaptable" style="table-layout:fixed"><thead><tr><th style="width:32%">编号</th><th style="width:28%">最近一组</th><th style="width:16%">状态</th><th style="width:24%">下一步</th></tr></thead><tbody>'
   +rows.map(r=>'<tr><td>'+r.k+'　'+KPNAME[r.k]+'</td><td class="num">'+r.seen+'</td><td>'+statBadge(r.k)+'</td><td>'+r.next+'</td></tr>').join('')
   +'</tbody></table>'+mob
   +(rest?'<p class="foot">另有 '+rest+' 个编号只测过 1 题，样本不够定论，各做一组 8 题才会进这张表。</p>':'');
}

function startRepair(kp){
  const ids=buildRepair(kp);
  const note=ids.length<8
    ? '题库这一组只有 '+ids.length+' 题，够不着 8 题门槛，所以只验不判“掌握”。做完看错因，别急着换编号。'
    : (/^P/.test(kp)
        ? 'P 组五个编号（长短元音、a 的两种读法、-s 尾音、th、不发音字母）共 '+ids.length+' 题，一次做完。过 85%（最多错 '+(ids.length-Math.ceil(ids.length*0.85))+' 题）才算这一组清干净。'
        : '4 道新编变式 + 4 道之前做过的回炉题。先看规则再动笔，判完记档。');
  S.paper={title:kp+' '+KPNAME[kp]+' · 补给 '+ids.length+' 题',note:note,ids:ids,kind:'repair',kp:kp,answers:{},graded:false,key:'R:'+kp};
}

/* ===== 组题与出卷 ===== */
function buildTrain(kp){
  const main=BANK.filter(x=>x.kp===kp).slice(0,8);
  const sib=SIB[kp];let side=BANK.filter(x=>x.kp===sib).slice(0,4);
  if(side.length<4){side=side.concat(BANK.filter(x=>/^G/.test(x.kp)&&x.kp!==kp).slice(0,4-side.length))}
  return main.concat(side);
}
function start(key){
  let p;
  if(key==='train')return;
  if(/^G\d+$/.test(key)){
    p={title:key+' '+KPNAME[key]+' · 训练 12 题',note:'主编号 '+key+' 8 题——一个样本门槛；另加 4 题来自相邻编号，混着出，用来检验你是真会还是只认得出题型。',ids:buildTrain(key).map(x=>x.id),kind:'train',kp:key};
  }else{
    const d=PAPERS[key];
    p={title:d.title,note:d.note,ids:(key==='A'?expandDiag(d.ids):d.ids),kind:'diag'};
    if(key==='B3')p.passage=PASSAGE;
  }
  S.paper=Object.assign(p,{answers:{},graded:false,key:key});
}
function vPaper(){
  const p=S.paper;
  if(!p)return viewHead('没有进行中的卷子','—','回到首页或训练页重新开始。');
  const items=p.ids.map(item);

   +(p.passage?'<div class="passage"><b>完形短文</b>\n'+p.passage+'</div>':'')

   +'<div class="actions"><button class="btn acc" data-act="grade">交卷判分</button><button class="btn ghost" data-nav="home">退出</button></div>'
   +'<p class="foot">判分只报题型小分与错因，不报百分制。判完会写进本机档案。</p>';
}
function qHTML(it,stem,n){
  const ans=S.paper.answers[it.id];
  let body='';
  if(it.t==='c'){
    body='<div class="opts">'+it.o.map((o,i)=>{
      let cls='opt';
      if(S.paper.graded){if(i===it.a)cls+=' right';else if(Number(ans)===i)cls+=' wrong'}
      else if(Number(ans)===i)cls+=' sel';
      return '<button class="'+cls+'" data-opt="'+it.id+'" data-i="'+i+'"><span class="k">'+'ABCD'[i]+'</span><span>'+o+'</span></button>';
    }).join('')+'</div>';
  }else{
    body='<div class="fill"><input data-fill="'+it.id+'" value="'+escAttr(ans||'')+'" placeholder="'+(it.ph||'填写答案')+'" '+(S.paper.graded?'disabled':'')+'></div>';
  }
  return '<div class="q"><div class="qno">'+pad(n)+'</div><div class="stem">'+stem+'</div>'+body+'</div>';
}

/* ===== 判卷 ===== */
function grade(){
  const p=S.paper;if(!p||p.graded)return;
  p.graded=true;
  const items=p.ids.map(item);
  let c=0,q=0;const g={};
  items.forEach(it=>{
    const ok=isRight(it,p.answers[it.id]);
    q++;if(ok)c++;
    g[it.kp]=g[it.kp]||{c:0,q:0};g[it.kp].q++;if(ok)g[it.kp].c++;
  });
  p.score={c:c,q:q};
  Object.keys(g).forEach(k=>addSession(k,g[k].c,g[k].q));
  save();
  p.mistakes=items.filter(it=>!isRight(it,p.answers[it.id]));
  p.mistakes.forEach(it=>{
    const rec={date:today(),kp:it.kp,type:KPNAME[it.kp],q:it.q,answer:mineOf(it,p),correct:it.t==='c'?'ABCD'[it.a]:it.a[0],reason:KP2REASON[it.kp]||'规则不熟'};
    P.mistakes.push(rec);it.mi=P.mistakes.length-1;
  });
  if(p.key==='A'||p.key==='V'){
    P.exam=P.exam||{};
    P.exam[p.key]={date:today(),correct:p.score.c,questions:p.score.q};
  }
  save();
  render();
}
function vGraded(){
  const p=S.paper;if(!p||!p.graded)return vPaper();
  const items=p.ids.map(item);
  const acc=Math.round(p.score.c/p.score.q*100);
  const head='<div class="panel"><h3>判卷卡 · '+p.title+'</h3>'
   +'<p class="hint">共 '+p.score.q+' 题，对 '+p.score.c+'，错 '+(p.score.q-p.score.c)+'。档案已写入本机。</p>'
   +'<p class="hint" style="margin-top:6px">对错只报题型小分，不报百分制——总分看多了会麻木，小分才有用。</p></div>';
  const seen={};const seenOk={};
  const list=items.map((it,i)=>{
    const ok=isRight(it,p.answers[it.id]);
    const mine=mineOf(it,p);
    const right=it.t==='c'?'ABCD'[it.a]:it.a[0];
    let extra='';
    if(!ok){
      const first=!seen[it.kp];seen[it.kp]=1;
      extra='<div class="explain">正确答案：'+right+'　你答：'+mine+'<br>'+(first?'依据：'+RULE[it.kp]:'规则同上（'+it.kp+'），这类题先把那条规则默念一遍再选')+(it.x?'<br>'+it.x:'')
        +'<div class="reason">错因 <select data-mi="'+(it.mi!==undefined?it.mi:'')+'">'+REASONS.map(r=>'<option '+(KP2REASON[it.kp]===r?'selected':'')+'>'+r+'</option>').join('')+'</select></div></div>';
    }
    if(ok&&p.kind==='repair'){
      if(!seenOk[it.kp]){seenOk[it.kp]=1;extra='<div class="explain lite">规则：'+RULE[it.kp]+(TEACH[it.kp]?'　判法：'+TEACH[it.kp].step:'')+'</div>'}
      else if(TEACH[it.kp])extra='<div class="explain lite">判法：'+TEACH[it.kp].step+'</div>';
    }
    return '<div class="q"><div class="qno">'+it.kp+' · '+KPNAME[it.kp]+'</div><div class="stem">'+it.q+'</div>'
      +'<div class="gradebox"><span class="verdict '+(ok?'ok':'no')+'">'+(ok?'对':'错')+'</span></div>'+extra+'</div>';
  }).join('');
  const wrong=p.mistakes.length;
  const block='<div class="panel"><h3>错题与变式</h3>'
   +'<p class="hint">'+(wrong?'本次错 '+wrong+' 题。库里这两个编号还有 4 道新编变式 + 4 道回炉题，去补给页直接开练；要换更多场景，再点“复制给教练”。':'全对。可以直接进下一个编号，或者做一次 3 题复查。')+'</p>'
   +(wrong?'<p class="hint">这批 '+wrong+' 道已经存进错题本，上面改错因会同步更新。</p><div class="actions"><button class="btn acc" data-act="copy-coach">复制给教练（超出题库的深讲）</button><button class="btn ghost" data-nav="repair">去补给页补这两个编号</button></div>':'')
   +'</div>';
  const paste='<div class="panel"><h3>档案粘贴块</h3><p class="hint">复制到同一个文本文件里，就是跨会话的档案。新对话读不到历史时，把它贴给教练。</p><div class="txt">'+pasteBlock()+'</div><div class="actions"><button class="btn ghost" data-act="copy-paste">复制粘贴块</button></div></div>';
    const gate=(p.key==='A'||p.key==='V')?gatePanel():'';
  const th=p.kind==='repair'?'<div class="panel"><h3>这一组过线了吗</h3><p class="hint">'
    +(p.score.c/p.score.q>=0.85?'对了 '+p.score.c+'/'+p.score.q+'，过 85% 线。明天或后天再做一组 8 题，验间隔——两次都过才算稳定掌握。':'对了 '+p.score.c+'/'+p.score.q+'，没过 85%。规则还没吃透，先回补给页看那张重讲卡，再重做，别换编号。')
    +'</p></div>':'';
  return head+gate+th+'<div class="panel">'+list+'</div>'+block+paste;
}
function pasteBlock(){
  const ks=Object.keys(P.kps).sort((a,b)=>kpNum(a)-kpNum(b)||a.localeCompare(b));
  if(!ks.length)return '【学习档案】暂无记录';
  const t=totals();
  return ['【学习档案 '+today()+'】',
    (P.student.name?'学生：'+P.student.name+'　':'')+'累计 '+t.q+' 题，正确率 '+(t.q?Math.round(t.c/t.q*100):0)+'%',
    ks.map(k=>{
      const n=P.kps[k];const c=n.sessions.reduce((a,s)=>a+s.correct,0);const q=n.sessions.reduce((a,s)=>a+s.questions,0);
      return k+' '+KPNAME[k]+' | '+c+'/'+q+' | '+n.sessions.length+' 次 | '+status(k);

}

  const sess=Object.keys(days).length;
  const rx=P.exam&&P.exam.real;
  const realLine=rx?'<p class="hint">真卷（'+rx.date+'）：'+rx.title+'，除作文 '+rx.got+'/'+rx.max+'。</p>':'';
  const cell=(cc,qq)=>!qq?'—':(qq<8?'样本 '+qq+' 题':cc+'/'+qq+'　'+Math.round(cc/qq*100)+'%');
  const rows=ks.map(k=>{
    const n=P.kps[k],w=n.sessions.filter(x=>x.date>=since);

   +(rows?'<table style="margin-top:12px"><thead><tr><th style="width:46%">编号</th><th style="width:22%">本周</th><th style="width:18%">累计</th><th style="width:14%">状态</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p class="empty">本周暂无记录</p>')

   +'<span class="hint">目标分</span><input id="sTarget" type="number" value="'+P.student.target+'" style="width:80px;border:1px solid var(--line);background:#fbf7ef;padding:8px 12px;font-family:inherit">'
   +'<button class="btn sm ghost" data-act="save-setup">保存</button></div>'

    '一、本周练了什么','练了 '+sess+' 天，题量 '+q+' 题，涉及编号：'+(ks.filter(k=>P.kps[k].sessions.some(s=>s.date>=since)).join('、')||'暂无'),

    '', '三、已稳定掌握',''+(stable.join('、')||'暂无。状态不够门槛的不写“掌握”。'),
    '', '四、还没过关的编号',''+(weak.map(k=>k+' '+KPNAME[k]+'（'+status(k)+'）').join('；')||'暂无'),
    '', '五、下周三个动作','周一：'+(weak[0]?weak[0]+' 重讲＋同规则 5 题':'从诊断里挑一个未测的编号')+'；周三：做一次辨音＋语法选择小卷；周日：复查本周编号各 3 题，错 2 题退回待巩固。',

const S={paper:null};

  renderNav();

  else if(k==='diagnose')html=vDiagnose();
  else if(k==='train')html=vTrain();
  else if(k==='real')html=vReal();
  else if(k==='explain')html=vExplain();
  else if(k==='phonics')html=vPhonics();
  else if(k==='repair')html=vRepair();

  else html=vHome();
  document.getElementById('view').innerHTML=html;

function syncWriting(){
  let tot=0;
  W_ITEMS.forEach((w,i)=>{
    const inp=document.querySelector('input[data-w="'+i+'"]');
    if(!inp)return;
    const v=Number(inp.value);tot+=v;
    document.getElementById('wv'+i).textContent=v;
  });
  const t=document.getElementById('wtot');if(!t)return;
  t.textContent=tot;
  const band=tot>=13?'优秀（13–15）':tot>=10?'良好（10–12）':tot>=7?'及格（7–9）':'重写（6 分以下）';
  document.getElementById('wband').textContent=band;
}
document.addEventListener('click',function(e){
  const nav=e.target.closest('[data-nav]');
  if(nav){location.hash=nav.getAttribute('data-nav');render();return}
  const opt=e.target.closest('[data-opt]');
  if(opt){
    const id=opt.getAttribute('data-opt'),i=Number(opt.getAttribute('data-i'));
    if(S.paper&&!S.paper.graded){S.paper.answers[id]=i;
      opt.parentNode.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
      opt.classList.add('sel');}
    return;
  }
  const act=e.target.closest('[data-act]');
  if(!act)return;
  const a=act.getAttribute('data-act');
  if(a==='grade'){grade();location.hash='paper';render();return}
  if(a==='save-rsn'){
    const p=S.paper;
    if(p.saved){toast('这批错题已经存过，别重复入库');return}
    p.saved=true;
    p.mistakes.forEach(it=>{
      const sel=document.querySelector('select[data-rsn="'+it.id+'"]');
      const reason=sel?sel.value:(KP2REASON[it.kp]||'规则不熟');
      P.mistakes.push({date:today(),kp:it.kp,type:KPNAME[it.kp],q:it.q,answer:mineOf(it,p),correct:it.t==='c'?'ABCD'[it.a]:it.a[0],reason:reason});
    });
    save();toast('已存 '+p.mistakes.length+' 道错题');render();return;
  }
  if(a==='real-import'){importReal();return}
  if(a==='copy-paste'){copy(pasteBlock());return}
  if(a==='copy-coach'){
    const p=S.paper;
    const lines=['【批改与变式请求】','训练：'+p.title+'　'+today(),'共 '+p.score.q+' 题，对 '+p.score.c+'，错 '+(p.score.q-p.score.c)+'。','','错题：'];
    p.mistakes.forEach((it,i)=>{
      const sel=document.querySelector('select[data-rsn="'+it.id+'"]');
      const mine=mineOf(it,p);
      lines.push((i+1)+'. ['+it.kp+'] '+it.q+'　我答：'+mine+'　正确：'+(it.t==='c'?'ABCD'[it.a]:it.a[0])+'　错因：'+(sel?sel.value:(KP2REASON[it.kp]||'规则不熟')));
    });
    lines.push('','请按上面的错因出变式：只给错得最多的两个编号各 5 道，换词换场景，不许只换人名；先讲规则再给题，不要先给答案。');
    copy(lines.join('\n'));return;
  }
  if(a==='copy-write'){
    let tot=0;W_ITEMS.forEach((w,i)=>{const inp=document.querySelector('input[data-w="'+i+'"]');if(inp)tot+=Number(inp.value)});
    const errs=W_ERRS.filter((x,i)=>{const c=document.querySelector('input[data-e="'+i+'"]');return c&&c.checked});
    copy(['【作文批改请求】','自评：'+tot+'/15（内容 '+vis(0)+'，语言 '+vis(1)+'，结构 '+vis(2)+'，规范 '+vis(3)+'）',
      '最像的问题：'+(errs.length?errs.join('；'):'未勾选'),
      '请按 15 分量表批改，只改最影响分数的三处，其余标出来让学生自己改；给一版改后稿，长度不超过原稿 1.2 倍；再给下次要练的编号。'].join('\n'));
    function vis(i){const inp=document.querySelector('input[data-w="'+i+'"]');return inp?inp.value:'0'}
    return;
  }
  if(a.indexOf('mdel:')===0){P.mistakes.splice(Number(a.split(':')[1]),1);save();render();return}
  if(a==='clear-mistakes'){if(confirm('清空错题本？档案不受影响。')){P.mistakes=[];save();render()}return}
  if(a==='export-csv'){
    const head=['日期','题型','知识点','题干摘要','学生答案','正确答案','错因'];
    const rows=P.mistakes.map(m=>[m.date,m.type,m.kp,(m.q||'').replace(/"/g,''),m.answer,m.correct,m.reason]);
    dl('错题本.csv','\ufeff'+[head].concat(rows).map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv;charset=utf-8');
    toast('已导出 CSV');return;
  }
  if(a==='export-json'){dl('学习档案.json',JSON.stringify(P,null,2),'application/json');toast('已导出档案');return}
  if(a==='copy-report'){
    const since=monday();let q=0,c=0,s=0;const days={};
    Object.keys(P.kps).forEach(k=>P.kps[k].sessions.filter(x=>x.date>=since).forEach(x=>{q+=x.questions;c+=x.correct;days[x.date]=1}));
    s=Object.keys(days).length;
    copy(reportText(since,q,c,s));return;
  }
  if(a==='save-setup'){P.student.name=document.getElementById('sName').value.trim();P.student.target=Number(document.getElementById('sTarget').value)||110;save();toast('已保存');render();return}
  if(a==='reset'){if(confirm('清空本机全部记录？导出过的文件不受影响。')){P={student:{name:'',baseline:95,target:110},kps:{},mistakes:[],created:today()};save();render()}return}
  if(a.indexOf('repair:')===0){startRepair(a.split(':')[1]);location.hash='paper';render();return}
  if(a.indexOf('start:')===0){start(a.split(':')[1]);location.hash='paper';render();return}
  if(a.indexOf('train:')===0){start(a.split(':')[1]);location.hash='paper';render();return}
});
document.addEventListener('input',function(e){
  const f=e.target.closest('[data-fill]');
  if(f&&S.paper&&!S.paper.graded){S.paper.answers[f.getAttribute('data-fill')]=f.value;return}
  if(e.target.closest('[data-w]'))syncWriting();
});
document.addEventListener('change',function(e){
  const sel=e.target.closest('select[data-mi]');
  if(sel){const i=Number(sel.getAttribute('data-mi'));if(P.mistakes[i]){P.mistakes[i].reason=sel.value;save();toast('错因已更新')}}
});
window.addEventListener('hashchange',render);
render();

</script>
</body>
</html>
